련해 공동 해결책을 찾도록 촉진한다","일정 지연을 막기 위해 관리자가 직접 한 가지 방식을 선택한다","두 사람이 서로 다른 작업을 맡도록 업무를 분리한다"],"answer":[1],"explanation":"갈등의 원인이 기술적 의견 차이이므로 협업/문제 해결(Collaborate/Problem solve)이 가장 바람직하다. PMP 상황형 문제에서는 \\"에스컬레이션\\"이나 \\"일방적 결정\\"보다 팀 스스로 해결하도록 촉진하는 선택지가 우선이다.","optionNotes":["팀 차원에서 해결할 수 있는 문제를 바로 에스컬레이션하는 것은 오답 패턴이다.","정답. 근본 원인(기술적 근거)을 함께 검토하는 협업형 해결.","강요(Forcing)는 단기 해결이지만 관계를 악화시킨다.","회피/철수(Withdraw)로 근본 문제를 해결하지 못한다."]},{"id":"p02","domain":"people","edition":"both","approach":"agile","tags":["서번트리더십","자기조직화"],"stem":"새로 구성된 애자일 팀의 팀원들이 매일 아침 프로젝트 관리자가 작업을 배정해 주기를 기다리고 있다. 서번트 리더로서 가장 적절한 행동은?","options":["혼란을 줄이기 위해 당분간 매일 작업을 배정한다","제품 책임자(PO)에게 작업 배정을 요청한다","팀이 백로그에서 스스로 작업을 가져가도록 자기조직화를 코칭한다","기능 관리자에게 팀원의 주도성 부족을 알린다"],"answer":[2],"explanation":"애자일 팀은 풀(pull) 방식으로 스스로 작업을 선택한다. 서번트 리더는 지시하는 대신 팀이 자기조직화할 수 있도록 코칭하고 장애물을 제거한다.","optionNotes":["지시형 관리로 의존성을 강화한다.","PO는 우선순위를 정하지만 작업을 배정하지 않는다.","정답.","코칭 없이 문제를 외부로 넘기는 행동이다."]},{"id":"p03","domain":"people","edition":"both","approach":"hybrid","tags":["가상팀","팀헌장"],"stem":"세 개 시간대에 분산된 가상 팀에서 회의 결정 사항이 일부 팀원에게 전달되지 않는 일이 반복되고 있다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["모든 회의를 한 시간대 기준으로 고정한다","팀과 함께 핵심 협업 시간, 의사소통 채널, 결정 사항 기록 방식을 담은 업무 합의(팀 헌장)를 수립한다","전달이 누락된 팀원의 성과를 평가에 반영한다","모든 팀원을 한 장소로 집결(co-location)시키도록 요청한다"],"answer":[1],"explanation":"팀 헌장(Team charter)/업무 합의(Working agreements)는 가상 팀의 의사소통 규범을 명확히 하는 1차 도구다. 팀이 함께 만들어야 준수율이 높다.","optionNotes":["일부 시간대 팀원에게 불공정하며 근본 해결이 아니다.","정답.","프로세스 문제를 개인 책임으로 돌린다.","비용·현실성 측면에서 첫 조치로 부적절하다."]},{"id":"p04","domain":"people","edition":"both","approach":"predictive","tags":["이해관계자참여"],"stem":"그동안 관심이 낮던 고위 임원이 갑자기 프로젝트 방향에 강하게 반대하기 시작했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["스폰서에게 해당 임원을 설득해 달라고 요청한다","변경 요청을 제출해 임원의 의견을 반영한다","임원을 직접 만나 우려 사항을 파악하고 이해관계자 참여 평가를 갱신한다","기준선이 승인되었으므로 기존 계획대로 진행한다"],"answer":[2],"explanation":"먼저 우려의 실체를 이해해야 한다(분석 → 대응). 이해관계자의 현재/목표 참여 수준이 바뀌었으므로 참여 평가 매트릭스와 대응 전략을 갱신한다.","optionNotes":["직접 소통 없이 위임하는 것은 첫 조치가 아니다.","우려 내용을 확인하기 전에 변경을 제출하는 것은 성급하다.","정답.","권한·영향력이 큰 이해관계자를 무시하는 것은 리스크를 키운다."]},{"id":"p05","domain":"people","edition":"both","approach":"hybrid","tags":["역량개발"],"stem":"한 팀원이 신규 기술 스택에 익숙하지 않아 반복적으로 작업이 지연되고 있다. 프로젝트 관리자가 취할 가장 좋은 조치는?","options":["기술 역량이 맞지 않으므로 기능 관리자에게 해당 팀원의 교체를 요청한다","팀원과 1:1로 원인을 확인하고, 교육·페어 프로그래밍 등 역량 개발 계획을 함께 세운다","일정을 지키기 위해 해당 팀원의 작업을 숙련된 다른 팀원에게 재배정한다","일정 지연을 리스크 등록부에 기록하고 다음 보고 주기까지 추이를 지켜본다"],"answer":[1],"explanation":"성과 문제는 먼저 원인을 파악하고 개발(교육, 멘토링, 페어링)로 해결한다. 교체는 최후 수단이다.","optionNotes":["원인 파악과 육성 시도 없이 교체부터 요청하는 것은 최후 수단이다.","정답.","단기 일정은 지키지만 근본 원인(역량 부족)을 해결하지 못하고 다른 팀원 부담만 늘린다.","이미 발생 중인 이슈이므로 기록과 관찰만으로는 부족하다."]},{"id":"p06","domain":"people","edition":"8th","approach":"agile","tags":["심리적안전감","임파워먼트"],"stem":"회고에서 팀원들이 문제를 거의 말하지 않고, 결함은 스프린트 막바지에야 드러난다. 팀원들은 \\"실수를 말하면 책임을 지게 된다\\"고 느끼고 있다. 프로젝트 리더가 가장 먼저 해야 할 일은?","options":["책임 소재를 분명히 하기 위해 결함 발생 건수를 개인별로 집계해 팀에 공개한다","비난 없는(blameless) 회고 규칙을 팀과 합의하고, 리더 스스로 실수를 먼저 공유해 심리적 안전감을 조성한다","회고가 효과가 없으므로 생략하고, 문제는 데일리 스크럼에서 즉시 보고하게 한다","결함을 조기에 잡기 위해 품질 관리 담당자를 추가로 배치하고 검사를 강화한다"],"answer":[1],"explanation":"문제의 근본 원인은 심리적 안전감 부족이다. 권한이 위임된(empowered) 팀 문화는 실수를 학습 기회로 다루는 환경에서 만들어진다.","optionNotes":["개인 비난을 강화해 두려움을 더 키운다.","정답.","투명성과 지속적 개선 기회를 없애며 두려움의 원인은 그대로다.","증상(늦은 결함 발견)만 다루고 심리적 안전감 문제는 그대로다."],"diffNote":"7판은 \\"협업적인 팀 환경 조성\\", \\"리더십 발휘\\" 등 여러 원칙에 나누어 다루던 내용을, 8판은 \\"권한 위임 문화 구축(Build an empowered culture)\\" 원칙으로 묶어 강조한다."},{"id":"p07","domain":"people","edition":"8th","approach":"hybrid","tags":["AI","거버넌스","데이터보안"],"stem":"팀원들이 생성형 AI 도구로 고객 인터뷰 기록을 요약해 요구사항 초안을 만들자고 제안했다. 인터뷰 기록에는 고객사 기밀 정보가 포함되어 있다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["요약 작업의 생산성이 크게 높아지므로 팀의 제안대로 AI 도구 도입을 즉시 승인한다","기밀 유출 우려가 있으므로 프로젝트 내 모든 AI 도구 사용을 전면 금지한다고 공지한다","조직의 AI 사용 정책과 데이터 보호 요건을 확인하고, 사람의 검토 절차를 포함한 사용 가이드를 팀과 정한다","기밀의 소유자는 고객이므로 고객에게 AI 도구 사용 여부를 결정해 달라고 요청한다"],"answer":[2],"explanation":"AI 활용은 조직 거버넌스·데이터 보호·윤리 기준 안에서 이루어져야 하며, AI 산출물은 사람의 검토(human-in-the-loop)를 거쳐야 한다. 무조건 승인/금지가 아니라 통제된 도입이 정답 패턴이다.","optionNotes":["기밀 데이터 유출 리스크를 검토하지 않았다.","가치 창출 기회를 검토 없이 차단한다.","정답.","내부 정책 확인이 먼저이며, 결정을 고객에게 떠넘기는 것은 적절하지 않다."],"diffNote":"7판에는 AI 관련 지침이 사실상 없었고, 8판은 AI 활용과 이에 대한 거버넌스·윤리를 명시적으로 다룬다."},{"id":"p08","domain":"people","edition":"both","approach":"predictive","tags":["감성지능"],"stem":"진척 회의 도중 한 이해관계자가 일정 지연에 대해 크게 화를 내며 팀을 비난하고 있다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["분위기가 더 악화되기 전에 회의를 즉시 종료하고 다음에 다시 소집한다","지연 원인이 다른 부서에 있음을 데이터로 제시해 팀에 대한 비난을 반박한다","감정을 인정하고 경청한 뒤, 회의 후 별도로 만나 구체적인 우려를 논의하자고 제안한다","회의 후 스폰서에게 해당 이해관계자의 태도와 발언을 보고하고 조치를 요청한다"],"answer":[2],"explanation":"감성지능(EI): 상대의 감정을 인정하고 적극적으로 경청한 뒤, 공개석상이 아닌 자리에서 문제를 다룬다.","optionNotes":["감정을 다루지 않고 상황을 회피하는 것이다.","방어적 대응은 갈등을 키운다.","정답.","직접 대화를 시도하기 전의 에스컬레이션이다."]},{"id":"p09","domain":"people","edition":"both","approach":"agile","tags":["의사결정","자기조직화"],"stem":"애자일 팀이 두 가지 테스트 자동화 도구 중 무엇을 쓸지 프로젝트 관리자에게 결정해 달라고 요청했다. 두 도구 모두 조직 표준을 충족한다. 가장 적절한 대응은?","options":["PM의 경험상 더 나은 도구를 선택해 팀에 알려주고 바로 도입하게 한다","팀이 기준을 정하고 짧은 스파이크(spike)로 비교해 직접 결정하도록 권한을 위임한다","제품의 최종 책임자인 PO에게 도구 선택 결정을 넘기고 결과를 따르게 한다","도구 혼선을 막기 위해 PMO에 조직 차원의 표준 도구 지정을 요청한다"],"answer":[1],"explanation":"제약(조직 표준) 안의 기술적 결정은 팀에 위임한다. 스파이크는 불확실성을 줄이기 위한 짧은 탐색 작업이다.","optionNotes":["PM이 대신 결정하면 팀의 자율성과 주인의식을 저해한다.","정답.","PO는 가치·우선순위 책임자이지 기술 도구 선택의 책임자가 아니다.","두 도구 모두 이미 표준을 충족하므로 불필요한 에스컬레이션이다."]},{"id":"p10","domain":"people","edition":"both","approach":"agile","tags":["온보딩"],"stem":"스프린트 중간에 새 개발자가 팀에 합류했다. 가장 적절한 조치는?","options":["인원이 늘었으므로 이번 스프린트 커밋 범위를 늘려 새 팀원 몫의 작업을 추가한다","온보딩 계획을 세우고 기존 팀원과 페어로 일하게 하되, 현재 스프린트 약속은 변경하지 않는다","스프린트 흐름을 방해하지 않도록 다음 스프린트까지 아무 작업도 맡기지 않는다","빠른 적응을 위해 새 팀원에게 가장 긴급한 버그를 단독으로 맡겨 실무를 익히게 한다"],"answer":[1],"explanation":"스프린트 목표와 약속은 보호하고, 새 팀원은 페어링으로 빠르게 맥락을 익히게 한다. 팀 속도(velocity)는 이후 스프린트에서 자연스럽게 반영한다.","optionNotes":["신규 인원의 생산성을 과대평가해 목표를 위험하게 만든다.","정답.","학습 기회를 낭비하고 팀 통합을 늦춘다.","맥락 없는 단독 작업은 품질 리스크를 만든다."]},{"id":"p11","domain":"people","edition":"7th","approach":"hybrid","tags":["원칙","스튜어드십"],"stem":"PMBOK 7판의 원칙 중 \\"성실하고, 존중하며, 배려하는 관리자(steward)가 되라\\"에 가장 부합하는 행동은?","options":["계약상 의무만 충족하면 되므로 추가 영향은 고려하지 않는다","조직 내외부에 대한 영향과 윤리·법규 준수를 고려해 의사결정한다","프로젝트 목표 달성을 위해 일부 규정 위반은 감수한다","이해관계자 관리는 스폰서에게 맡긴다"],"answer":[1],"explanation":"스튜어드십(Stewardship)은 청렴성, 배려, 신뢰성, 법규 준수를 포함하며 조직 내외부 영향까지 고려하는 책임을 뜻한다.","optionNotes":["좁은 시야.","정답.","윤리 위반.","책임 회피."],"diffNote":"8판에서는 이 내용이 \\"책임 있는 리더가 되라(Be an accountable leader)\\"와 지속가능성 원칙 등으로 재편되었다."},{"id":"p12","domain":"people","edition":"both","approach":"predictive","tags":["협상","자원"],"stem":"매트릭스 조직에서 핵심 엔지니어가 다른 프로젝트로 차출될 예정이라는 사실을 알게 되었다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["프로젝트에 꼭 필요한 인력이므로 엔지니어에게 이동 요청을 거절하라고 부탁한다","기능 관리자와 만나 일정 영향을 공유하고 공동 해결책(시기 조정, 대체 인력 등)을 협상한다","인력 손실이 확실하므로 즉시 일정 기준선 변경 요청을 제출해 지연을 반영한다","핵심 인력 유지를 위해 스폰서에게 차출을 막아 달라고 바로 요청한다"],"answer":[1],"explanation":"매트릭스 조직에서 자원은 기능 관리자와 협상한다. 영향 분석을 바탕으로 윈-윈 해결책을 먼저 찾는다.","optionNotes":["조직 의사결정을 우회하게 만든다.","정답.","협상으로 해결 가능성을 확인하기 전이다.","직접 협상 전의 에스컬레이션."]},{"id":"r01","domain":"process","edition":"both","approach":"predictive","tags":["통합변경통제"],"stem":"예측형 프로젝트 실행 중 핵심 고객이 새로운 보고서 기능을 추가해 달라고 요청했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["고객 만족을 위해 팀에 바로 작업을 지시한다","요청을 거절한다","변경이 범위·일정·원가·리스크에 미치는 영향을 분석한다","변경 통제 위원회(CCB)에 바로 승인을 요청한다"],"answer":[2],"explanation":"변경 요청 처리 순서: 영향 분석 → 변경 요청 제출 → CCB 승인/거절 → 계획 갱신 → 이해관계자 통보.","optionNotes":["도금(gold plating)/범위 추가(scope creep).","분석 없이 거절할 근거가 없다.","정답.","영향 분석 없이 CCB에 올릴 수 없다."]},{"id":"r02","domain":"process","edition":"both","approach":"agile","tags":["백로그","스프린트"],"stem":"스프린트 진행 중 PO가 새로운 기능을 이번 스프린트에 넣어 달라고 요구한다. 스프린트 목표와는 무관한 기능이다. 가장 적절한 대응은?","options":["PO의 요청이므로 팀이 추가 근무를 해서라도 이번 스프린트에 기능을 넣는다","해당 기능을 제품 백로그에 추가하고 다음 스프린트 계획 시 우선순위를 정하도록 PO와 협의한다","스프린트 계획이 바뀌었으므로 현재 스프린트를 즉시 취소하고 다시 계획한다","스프린트 규칙 위반이므로 스폰서에게 PO의 요구를 보고하고 판단을 요청한다"],"answer":[1],"explanation":"스프린트 중에는 스프린트 목표를 보호한다. 새 요구는 제품 백로그에 넣고 PO가 우선순위를 정한다. 스프린트 취소는 목표 자체가 무의미해졌을 때만 고려한다.","optionNotes":["지속 가능한 속도 원칙을 위반하고 스프린트 목표를 흔든다.","정답.","스프린트 목표가 여전히 유효하므로 취소는 부적절하다.","팀 수준에서 협의할 사안이며 에스컬레이션할 일이 아니다."]},{"id":"r03","domain":"process","edition":"both","approach":"predictive","tags":["EVM"],"stem":"현재 프로젝트의 CPI는 0.8, SPI는 1.1이다. 이 프로젝트의 상태로 옳은 것은?","options":["예산 이내, 일정 지연","예산 초과, 일정 앞섬","예산 초과, 일정 지연","예산 이내, 일정 앞섬"],"answer":[1],"explanation":"CPI = EV/AC < 1 이면 예산 초과, SPI = EV/PV > 1 이면 일정이 계획보다 앞서 있다."},{"id":"r04","domain":"process","edition":"both","approach":"predictive","tags":["EVM","계산"],"stem":"BAC = 100,000달러, EV = 40,000달러, AC = 50,000달러이다. 현재의 원가 성과가 이후에도 계속된다고 가정할 때 EAC는?","options":["110,000달러","120,000달러","125,000달러","150,000달러"],"answer":[2],"explanation":"CPI = 40,000 / 50,000 = 0.8. 전형적 차이 가정 시 EAC = BAC / CPI = 100,000 / 0.8 = 125,000달러.","optionNotes":["AC + (BAC − EV) = 110,000: 비전형적(앞으로는 계획대로) 가정일 때.","계산 근거 없음.","정답.","계산 근거 없음."]},{"id":"r05","domain":"process","edition":"both","approach":"predictive","tags":["리스크","이슈"],"stem":"리스크 등록부에 식별되어 있던 \\"핵심 부품 공급 지연\\" 리스크가 실제로 발생했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["상황을 다시 파악하기 위해 새로운 리스크 식별 워크숍을 연다","리스크 등록부에 계획된 대응(비상 계획)을 실행하고 이슈 로그에 기록한다","부품 지연 비용을 메우기 위해 스폰서에게 추가 예산을 요청한다","지연이 확실하므로 변경 요청을 제출해 일정 기준선을 변경한다"],"answer":[1],"explanation":"식별된 리스크가 발생하면 이슈가 된다. 미리 계획한 비상 대응(contingency plan)을 실행하는 것이 우선이다.","optionNotes":["이미 계획된 대응이 있다.","정답.","우발 예비비(contingency reserve)를 먼저 활용한다.","대응 실행 후 필요 시 검토."]},{"id":"r06","domain":"process","edition":"both","approach":"hybrid","tags":["리스크","기회"],"stem":"새로 출시된 자동화 도구를 확보하면 일정을 3주 단축할 수 있다는 사실을 알게 되었다. 이 기회가 반드시 실현되도록 하려면 어떤 대응 전략을 써야 하는가?","options":["활용(Exploit)","증대(Enhance)","공유(Share)","수용(Accept)"],"answer":[0],"explanation":"활용(Exploit)은 기회 발생 확률을 100%로 만드는 전략이다. 증대는 확률·영향을 높이는 것, 공유는 제3자와 함께 실현하는 것이다."},{"id":"r07","domain":"process","edition":"both","approach":"agile","tags":["번다운","장애물"],"stem":"스프린트 번다운 차트가 4일째 거의 줄어들지 않고 있다. 가장 먼저 해야 할 일은?","options":["스프린트 길이를 연장한다","데일리 스크럼에서 팀과 함께 진행을 막는 장애물을 확인한다","남은 작업을 다음 스프린트로 이월한다","팀원별 작업 시간을 보고하게 한다"],"answer":[1],"explanation":"정체된 번다운은 장애물(impediment)의 신호다. 투명성을 바탕으로 팀과 원인을 확인하고 제거하는 것이 서번트 리더의 역할이다.","optionNotes":["타임박스 위반.","정답.","원인 파악 전 결정.","마이크로 매니지먼트."]},{"id":"r08","domain":"process","edition":"8th","approach":"hybrid","tags":["하이브리드","생애주기","테일러링"],"stem":"하드웨어 장비 제작(규제 인증 필요)과 제어 소프트웨어 개발이 함께 진행되는 프로젝트다. 가장 적절한 접근 방식은?","options":["규제 인증 산출물을 고려해 전체를 예측형으로 상세 계획하고 변경을 최소화한다","변화에 빠르게 대응하도록 하드웨어와 소프트웨어 전체를 스크럼으로 진행한다","하드웨어는 단계 게이트 기반 예측형, 소프트웨어는 반복형으로 운영하고, 통합 마일스톤과 공통 거버넌스로 연결한다","통합 리스크를 줄이기 위해 하드웨어 제작이 끝난 뒤에 소프트웨어 개발을 시작한다"],"answer":[2],"explanation":"산출물 특성에 맞춰 개발 방식을 테일러링하는 하이브리드가 적합하다. 핵심은 서로 다른 리듬을 통합 마일스톤·의존성 관리·공통 의사결정 체계로 연결하는 것이다.","optionNotes":["소프트웨어의 불확실성에 대응하지 못한다.","규제 인증 산출물에 부적합.","정답.","불필요하게 일정이 길어진다."],"diffNote":"7판은 \\"개발 방식 및 생애주기\\" 성과 영역에서 다뤘다. 8판은 하이브리드 운영을 거버넌스 성과 영역과 함께 보며, 서로 다른 방식을 한 체계로 통제하는 것을 강조한다."},{"id":"r09","domain":"process","edition":"8th","approach":"predictive","tags":["품질","근본원인"],"stem":"인도 후 고객이 동일한 유형의 결함을 반복해서 보고하고 있다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["고객 불만을 줄이기 위해 결함 수정 패치를 즉시 배포한다","근본 원인 분석으로 결함이 생긴 프로세스 지점을 찾아 개선한다","결함 유출을 막기 위해 출하 전 검사 인력을 두 배로 늘린다","사용 오류일 수 있으므로 고객에게 사용 방법 교육을 제공한다"],"answer":[1],"explanation":"반복 결함은 프로세스 문제의 신호다. 검사(inspection)보다 예방(prevention), 즉 품질을 프로세스에 내재화하는 것이 핵심이다.","optionNotes":["재발 원인을 없애지 못하는 증상 대응이다.","정답.","검사 강화는 예방보다 비용이 크다.","결함 원인을 확인하지 않았다."],"diffNote":"8판은 \\"프로세스와 인도물에 품질을 내재화하라(Embed quality into processes and deliverables)\\"를 핵심 원칙으로 둔다."},{"id":"r10","domain":"process","edition":"both","approach":"predictive","tags":["조달","계약"],"stem":"확정 가격(FFP) 계약의 공급업체가 범위 설명이 모호했다며 추가 비용을 청구했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["FFP 계약은 가격이 고정되어 있으므로 추가 비용 청구를 즉시 거절한다","공급업체와의 관계를 유지하기 위해 추가 비용을 승인하고 작업을 계속하게 한다","계약서와 작업 기술서(SOW)를 검토해 청구 근거를 확인하고, 계약에 정한 클레임 절차를 따른다","계약 위반 가능성이 있으므로 법무팀과 함께 소송 준비에 착수한다"],"answer":[2],"explanation":"계약 관련 분쟁은 계약 조건이 우선이다. 근거를 확인하고 클레임 관리(협상 → ADR → 소송 순) 절차를 따른다.","optionNotes":["청구 근거를 확인하기 전에 내린 결정이다.","청구 근거를 확인하기 전에 내린 결정이다.","정답.","소송은 계약상 클레임 절차를 거친 뒤의 최후 수단이다."]},{"id":"r11","domain":"process","edition":"both","approach":"predictive","tags":["일정","주경로","계산"],"stem":"경로 A-B-D의 총 기간은 12일, 경로 A-C-D의 총 기간은 10일이다. 활동 C의 총 여유(total float)는?","options":["0일","2일","10일","12일"],"answer":[1],"explanation":"주경로는 가장 긴 경로(A-B-D, 12일)다. C는 비주경로에만 있으므로 여유 = 12 − 10 = 2일."},{"id":"r12","domain":"process","edition":"both","approach":"agile","tags":["완료정의"],"stem":"스프린트 리뷰에서 PO는 기능이 \\"완료되지 않았다\\"고 하고, 개발자들은 \\"완료했다\\"고 주장한다. 재발을 막기 위한 가장 좋은 조치는?","options":["제품 책임자이므로 앞으로는 PO의 판단을 최종 기준으로 따른다","팀과 PO가 함께 완료 정의(DoD)와 인수 기준을 명확히 합의한다","객관성을 위해 테스트 담당자가 완료 여부를 최종 판정하도록 한다","논쟁을 피하기 위해 스프린트 리뷰를 생략하고 문서로 대체한다"],"answer":[1],"explanation":"DoD는 모든 백로그 항목에 적용되는 공통 완료 기준이고, 인수 기준은 항목별 조건이다. 둘 다 합의되어 있어야 \\"완료\\"가 투명해진다."},{"id":"r13","domain":"process","edition":"both","approach":"predictive","tags":["범위확인"],"stem":"팀이 품질 통제를 마친 인도물을 고객에게 제출했다. 고객이 공식적으로 인수(accept)하는 프로세스는?","options":["품질 통제(Control Quality)","범위 확인(Validate Scope)","범위 통제(Control Scope)","프로젝트 종료(Close Project)"],"answer":[1],"explanation":"품질 통제 = 내부적으로 정확성 확인(검증된 인도물), 범위 확인 = 고객/스폰서의 공식 인수(승인된 인도물)."},{"id":"r14","domain":"process","edition":"8th","approach":"hybrid","tags":["재무","자금조달"],"stem":"스폰서는 프로젝트 자금을 분기별로 나누어 집행하겠다고 한다. 원가 기준선상 2분기 지출이 2분기 자금 한도를 초과한다. 가장 적절한 조치는?","options":["2분기에 필요한 만큼 초과 지출하고, 차액은 3분기 자금에서 정산하도록 재무팀에 통보한다","자금 한도 조정(funding limit reconciliation)을 통해 작업 일정을 재조정하거나 자금 시점 변경을 협의한다","기준선대로 작업을 진행하고 2분기 자금 부족분은 우발사태 예비비로 충당해 메운다","원가 기준선과 관계없이 2분기 자금 한도에 맞춰 팀이 판단해 범위를 즉시 줄인다"],"answer":[1],"explanation":"자금 한도와 계획 지출이 맞지 않으면 일정(활동 시점) 조정 또는 자금 집행 시점 협의로 조정한다. 범위 축소는 변경 통제가 필요하다.","optionNotes":["자금 한도를 무시한 통제 위반이다.","정답.","예비비는 리스크 대응용이지 자금 시점 차이를 메우는 용도가 아니다.","변경 통제 없이 범위를 바꿀 수 없다."],"diffNote":"7판에는 재무를 독립적으로 다루는 성과 영역이 없었고(측정·계획 영역에 분산), 8판은 재무(Finance)를 독립 성과 영역으로 둔다."},{"id":"r15","domain":"process","edition":"both","approach":"hybrid","tags":["교훈"],"stem":"교훈(lessons learned)을 수집하는 가장 적절한 시점은?","options":["프로젝트 종료 시 한 번","단계 종료 시에만","프로젝트 전 기간에 걸쳐 지속적으로","문제가 발생했을 때만"],"answer":[2],"explanation":"교훈은 프로젝트 전반에 걸쳐 수집·공유하며(애자일의 회고 포함), 종료 시에는 최종 정리해 조직 프로세스 자산으로 이관한다."},{"id":"r16","domain":"process","edition":"8th","approach":"hybrid","tags":["판비교","성과영역"],"stem":"다음 중 PMBOK 8판에서 새로 독립된 성과 영역으로 제시된 것을 모두 고르시오. (3개)","options":["거버넌스(Governance)","재무(Finance)","불확실성(Uncertainty)","인도(Delivery)","자원(Resources)"],"answer":[0,1,4],"explanation":"8판의 7개 성과 영역: 거버넌스, 범위, 일정, 재무, 이해관계자, 자원, 리스크. 불확실성·인도는 7판의 8개 성과 영역(이해관계자, 팀, 개발 방식 및 생애주기, 기획, 프로젝트 작업, 인도, 측정, 불확실성)에 속한다.","diffNote":"7판 8개 성과 영역 → 8판 7개 성과 영역으로 재구성. 범위·일정·재무·자원·리스크처럼 지식 영역에 가까운 명칭이 돌아왔다."},{"id":"r17","domain":"process","edition":"both","approach":"agile","tags":["추정"],"stem":"애자일 팀이 사용자 스토리의 상대적 크기를 빠르게 추정하면서 팀원 간 가정 차이도 드러내고 싶어 한다. 가장 적합한 기법은?","options":["모수 추정(Parametric estimating)","플래닝 포커","3점 추정(PERT)","상향식 추정"],"answer":[1],"explanation":"플래닝 포커는 스토리 포인트로 상대 추정을 하며, 추정값이 크게 다를 때 토론을 통해 숨은 가정을 드러낸다."},{"id":"b01","domain":"business","edition":"both","approach":"predictive","tags":["규제준수"],"stem":"프로젝트 진행 중 개인정보 보호 관련 새 규제가 발표되어 6개월 후 시행된다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["규제 시행까지 6개월이 남았으므로 시행 전까지는 기존 계획대로 진행한다","규제가 요구사항·범위·일정에 미치는 영향을 평가하고 준수 담당 부서와 확인한다","규제 리스크가 확인될 때까지 프로젝트를 중단하고 스폰서 결정을 기다린다","규제는 외부 요인이므로 대응에 드는 비용을 고객에게 청구하겠다고 통보한다"],"answer":[1],"explanation":"외부 비즈니스 환경 변화는 즉시 영향을 평가하고 필요 시 변경 요청으로 반영한다."},{"id":"b02","domain":"business","edition":"7th","approach":"hybrid","tags":["가치인도","편익실현"],"stem":"프로젝트는 일정과 예산 안에 완료되었지만, 6개월 후 기대한 업무 효율 개선이 나타나지 않았다. 이를 예방하기 위해 프로젝트 초기에 했어야 할 일은?","options":["범위 기술서를 더 상세히 작성해 인도물과 인수 기준을 빈틈없이 정의하고 고객 서명을 받는다","편익 관리 계획(benefits management plan)에 측정 지표·책임자·측정 시점을 정의하고 운영 조직으로의 인계를 계획한다","효율 개선이 나타날 때까지 충분한 기간을 확보하도록 프로젝트 기간을 처음부터 길게 잡는다","프로젝트 종료 직후 고객 만족도 조사를 실시해 결과를 교훈 등록부에 기록하도록 계획한다"],"answer":[1],"explanation":"프로젝트의 성공은 산출물이 아니라 결과(outcome)와 가치로 판단한다. 편익은 대개 프로젝트 종료 후 실현되므로 측정 책임과 방법을 미리 정해야 한다.","diffNote":"7판은 \\"가치 인도 시스템(System for Value Delivery)\\"으로 산출물 → 결과 → 가치 흐름을 정립했다. 8판은 이를 전략과의 정렬·가치 실현 측정으로 더 구체화한다."},{"id":"b03","domain":"business","edition":"8th","approach":"predictive","tags":["지속가능성","ESG"],"stem":"자재 공급업체 후보 중 A사는 10% 저렴하지만 탄소 배출과 폐기물 처리 기준이 미흡하다. 조직은 공개적으로 탄소 감축 목표를 약속했다. 가장 적절한 조치는?","options":["원가 기준선을 지키는 것이 PM의 책임이므로 10% 저렴한 A사를 선택하고 계약을 진행한다","조직의 지속가능성 목표를 선정 기준에 포함해 총 가치(원가·환경·평판 리스크)를 비교하고, 그 결과를 의사결정권자에게 제시한다","의견이 갈리는 문제이므로 공정성을 위해 팀원 투표로 공급업체를 결정하고 결과를 따른다","고객 계약서에 환경 요건이 없으므로 환경 기준은 제외하고 가격과 품질만으로 평가한다"],"answer":[1],"explanation":"지속가능성은 선택 사항이 아니라 의사결정 기준이다. 단기 원가만이 아니라 환경·사회·평판 영향을 포함한 총 가치를 평가한다.","optionNotes":["단기 원가만 고려하고 조직의 공개 약속과 평판 리스크를 무시한다.","정답.","전략적 기준에 근거한 책임 있는 의사결정이 아니다.","조직의 지속가능성 전략과 정렬되지 않는다."],"diffNote":"7판은 지속가능성을 스튜어드십 원칙 안에서 간접적으로 다뤘다. 8판은 \\"모든 영역에 지속가능성을 통합하라\\"를 독립 원칙으로 둔다."},{"id":"b04","domain":"business","edition":"both","approach":"hybrid","tags":["조직변화관리"],"stem":"새 ERP 시스템 배포 후 현업 사용자들이 기존 엑셀 방식을 고집하며 시스템을 쓰지 않는다. 가장 적절한 조치는?","options":["시스템 정착을 위해 기존 엑셀 파일 접근을 시스템적으로 차단하고 전사에 공지한다","변화 관리 계획에 따라 사용자 변화 담당자(change champion)를 지정하고, 맞춤 교육과 피드백 채널을 운영한다","프로젝트 인도물은 이미 배포되었으므로 사용 정착 문제는 운영 부서에 맡기고 종료한다","사용률을 빠르게 높이기 위해 경영진에게 시스템 사용 의무화 공문 발송을 요청한다"],"answer":[1],"explanation":"조직 변화는 강제보다 인식 → 필요성 → 역량 → 강화 단계를 거치게 하는 것이 효과적이다(ADKAR 등 변화 모델)."},{"id":"b05","domain":"business","edition":"both","approach":"predictive","tags":["비즈니스케이스"],"stem":"경쟁사가 유사 제품을 먼저 출시해 프로젝트의 비즈니스 케이스가 더 이상 타당하지 않아 보인다. 프로젝트 관리자가 해야 할 일은?","options":["계획대로 완료한다","스스로 프로젝트를 중단한다","영향 분석 결과를 스폰서·거버넌스 기구에 보고하고 지속 여부 재검토를 요청한다","범위를 늘려 경쟁 제품보다 기능을 더 많이 만든다"],"answer":[2],"explanation":"프로젝트 지속/중단은 스폰서와 거버넌스 기구가 결정한다. PM은 비즈니스 케이스 타당성을 지속 점검하고 정보를 제공한다."},{"id":"b06","domain":"business","edition":"8th","approach":"hybrid","tags":["거버넌스","PMO","테일러링"],"stem":"PMO는 모든 프로젝트에 단계 게이트마다 상세 문서를 요구한다. 애자일로 운영 중인 팀은 이 요구가 인도 속도를 크게 떨어뜨린다고 호소한다. 가장 적절한 조치는?","options":["애자일 팀의 속도가 더 중요하므로 PMO 요구를 무시하고 애자일 방식대로 계속 진행한다","조직 표준이므로 인도 속도가 떨어지더라도 모든 게이트 문서를 작성하도록 팀에 지시한다","PMO와 협의해 게이트의 목적(통제·가시성)을 충족하면서도 작동하는 증분·데모·지표로 대체하는 경량 거버넌스로 테일러링한다","PMO 게이트 요구와의 충돌을 없애기 위해 프로젝트 전체를 예측형 방식으로 전환한다"],"answer":[2],"explanation":"거버넌스의 목적(의사결정·감독·책임)을 유지하면서 개발 방식에 맞게 테일러링하는 것이 하이브리드 거버넌스의 핵심이다.","diffNote":"8판은 거버넌스(Governance)를 독립 성과 영역으로 두고, 예측형·애자일이 공존하는 환경에서의 통제 방식을 강조한다."},{"id":"b07","domain":"business","edition":"8th","approach":"hybrid","tags":["AI","디지털전환","전략정렬"],"stem":"경영진이 \\"AI 고객 상담 챗봇을 3개월 안에 도입하라\\"고 지시했다. 프로젝트 착수 시 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["3개월 일정을 맞추기 위해 시장에서 가장 유명한 AI 솔루션 업체와 바로 계약을 체결한다","도입 목적과 측정 가능한 성과 지표(예: 응답 시간, 상담 이관률)를 조직 전략과 연결해 정의하고, 데이터·윤리·규제 리스크를 식별한다","빠르게 가능성을 보여주기 위해 목표 정의 없이 팀에 챗봇 PoC 개발부터 바로 착수시킨다","3개월 일정은 비현실적이므로 경영진에게 지시를 재검토해 달라고 하고 착수를 보류한다"],"answer":[1],"explanation":"디지털 전환 프로젝트도 기술이 아니라 전략적 가치에서 출발한다. 성과 지표를 정의하고 AI 고유 리스크(편향, 개인정보, 환각)를 초기에 식별한다.","diffNote":"8판은 AI·디지털 전환 맥락과 전략적 가치 실현을 명시적으로 다룬다."},{"id":"b08","domain":"business","edition":"8th","approach":"hybrid","tags":["판비교","원칙"],"stem":"PMBOK 7판은 12개의 프로젝트 관리 원칙을 제시했다. 8판에서는 원칙이 몇 개로 재정리되었는가?","options":["4개","6개","8개","12개 유지"],"answer":[1],"explanation":"8판은 원칙을 6개로 통합했다: 전체론적 관점 채택, 가치에 집중, 프로세스와 인도물에 품질 내재화, 책임 있는 리더가 되라, 모든 영역에 지속가능성 통합, 권한 위임 문화 구축."},{"id":"b09","domain":"business","edition":"both","approach":"agile","tags":["규제준수","데이터보안"],"stem":"테스트 환경에 실제 고객 개인정보가 그대로 복사되어 사용되고 있음을 발견했다. 가장 먼저 해야 할 일은?","options":["진행 중인 테스트에 지장이 없도록 테스트가 끝날 때까지 기다렸다가 데이터를 삭제한다","데이터 사용을 중단하고 조직의 보안·개인정보 책임자에게 보고한 뒤, 마스킹된 테스트 데이터로 교체한다","팀원들에게 해당 데이터를 외부에 유출하지 말라고 공지하고 테스트를 계속한다","데이터를 계속 쓸 수 있도록 해당 고객들에게 테스트 사용 동의를 받는다"],"answer":[1],"explanation":"규정 위반이 확인되면 즉시 중단하고 적절한 책임자에게 보고한다. 윤리·규정 준수 문제는 \\"나중에\\"가 정답이 될 수 없다."},{"id":"b10","domain":"business","edition":"both","approach":"agile","tags":["포트폴리오","MVP","가치"],"stem":"포트폴리오 재조정으로 프로젝트 예산이 30% 삭감되었다. 일정은 그대로다. 가장 적절한 대응은?","options":["약속한 범위를 지키기 위해 품질 기준을 낮춰서라도 모든 기능을 유지한다","PO·이해관계자와 함께 백로그를 재우선순위화해 가장 높은 가치를 주는 MVP 범위를 다시 정의한다","예산 없이 목표 달성이 불가능하므로 스폰서에게 프로젝트 취소를 요청한다","팀 규모를 그대로 유지하고 초과 비용은 프로젝트 종료 시점에 한꺼번에 보고한다"],"answer":[1],"explanation":"제약이 바뀌면 가치 기준으로 범위를 재조정한다. 애자일에서는 고정된 시간·비용 안에서 범위를 유동적으로 조정한다."},{"id":"b11","domain":"business","edition":"8th","approach":"predictive","tags":["원칙","전체론적관점"],"stem":"물류 시스템 교체 프로젝트에서, 일정 단축을 위해 운영팀의 연말 성수기와 전환 시점을 겹치게 하자는 의견이 나왔다. 8판 원칙 \\"전체론적 관점 채택\\"에 가장 부합하는 판단은?","options":["일정 목표가 프로젝트 성공 기준이므로 성수기와 겹치더라도 전환을 그대로 진행한다","프로젝트가 운영·고객·다른 이니셔티브와 상호작용하는 시스템임을 고려해 전환 시점이 조직 전체에 미치는 영향을 평가한다","프로젝트 일정을 지키기 위해 운영팀에 성수기 업무 일정을 조정해 달라고 요청한다","운영 리스크를 없애기 위해 전환을 무기한 연기하고 성수기 이후 다시 논의한다"],"answer":[1],"explanation":"전체론적 관점은 프로젝트를 조직·환경과 상호작용하는 시스템으로 보고, 국지적 최적화가 아닌 전체 영향을 고려하는 것이다.","diffNote":"7판의 \\"시스템적 사고(Recognize, evaluate, and respond to system interactions)\\" 원칙이 8판의 \\"전체론적 관점 채택(Adopt a holistic view)\\"으로 이어진다."}]`),JSON.parse(`[{"id":"g-b001","domain":"business","edition":"8th","approach":"predictive","tags":["편익실현","편익책임자"],"stem":"콜센터 평균 처리 시간을 20% 단축하기 위한 상담 시스템 개선 프로젝트가 종료 단계에 있다. 비즈니스 케이스상 편익은 시스템 가동 6개월 후부터 측정 가능하며, 프로젝트 팀은 다음 달 해산될 예정이다. 프로젝트 관리자가 편익 실현을 위해 해야 할 가장 적절한 조치는?","options":["편익 측정이 끝날 때까지 프로젝트 종료를 연기하고 팀을 유지해 결과를 직접 확인한다.","최종 보고서에 기대 편익과 목표치를 상세히 기재하고 승인을 받아 프로젝트를 종료한다.","편익 등록부와 측정 계획을 운영 부서의 편익 책임자에게 인계하고 측정 책임을 합의한다.","6개월 후 프로젝트 관리자가 직접 지표를 측정해 스폰서에게 보고하겠다고 일정에 반영한다."],"answer":[2],"explanation":"편익은 프로젝트 종료 후 운영 단계에서 실현되는 경우가 많으므로, 측정과 실현을 지속적으로 책임질 편익 책임자에게 지표·시점·책임을 명확히 이관해야 한다. 프로젝트의 성공은 인도물이 아니라 그로 인한 결과와 가치로 판단된다.","optionNotes":["편익 실현 시점까지 팀을 유지하는 것은 불필요한 비용이며, 편익 측정은 운영 조직의 역할이다.","기대 편익을 기록만 하고 측정 책임자를 정하지 않으면 편익 실현이 추적되지 않는다.","정답. 편익 등록부와 측정 계획을 운영의 편익 책임자에게 인계해 종료 후에도 가치 실현이 추적되도록 한다.","프로젝트 관리자는 종료 후 다른 업무로 이동하므로 지속적인 측정 책임을 개인이 지는 것은 지속 가능하지 않다."],"diffNote":"8판은 재무 성과 영역과 가치 인도 강조를 통해 프로젝트 종료 이후 편익 실현까지의 책임 연결을 더 명시적으로 다룬다. 7판은 가치 인도 시스템 관점에서 개념적으로 설명하는 데 그쳤다."},{"id":"g-b002","domain":"business","edition":"both","approach":"predictive","tags":["전략정렬","비즈니스케이스"],"stem":"제조사의 신규 공장 자동화 프로젝트가 40% 진척된 시점에, 이사회가 해외 생산 이전을 골자로 하는 새 중기 전략을 발표했고 이 공장은 3년 내 축소 대상에 포함되었다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["새 전략이 비즈니스 케이스에 미치는 영향을 분석해 스폰서와 거버넌스 기구에 계속 여부 결정을 요청한다.","승인된 기준선과 계약 의무가 유효하므로 전략 발표와 관계없이 계획대로 실행을 계속한다.","공장 축소가 사실상 확정적이므로 손실을 줄이기 위해 즉시 작업을 중지하고 팀을 해산한다.","범위를 축소하는 변경 요청을 작성해 변경 통제 위원회(CCB)에 신속히 제출하여 매몰 비용을 줄인다."],"answer":[0],"explanation":"프로젝트는 조직 전략을 실현하기 위한 수단이므로 전략이 바뀌면 비즈니스 케이스의 타당성을 재평가해야 한다. 프로젝트 관리자는 영향을 분석해 제시하고, 계속 여부는 스폰서와 거버넌스 기구가 결정한다.","optionNotes":["정답. 전략 정렬 여부를 분석하고 의사결정 권한자에게 판단을 요청하는 것이 올바른 순서이다.","전략과 정렬되지 않은 프로젝트를 기계적으로 계속하면 조직 자원을 낭비할 수 있다.","중단 결정은 프로젝트 관리자가 일방적으로 내릴 수 없으며 거버넌스 기구의 권한이다.","영향 분석 전에 구체적 변경안을 제출하는 것은 순서가 틀렸고, 축소가 최선인지도 알 수 없다."]},{"id":"g-b003","domain":"business","edition":"both","approach":"hybrid","tags":["PMO","VDO"],"stem":"한 보험사가 프로젝트 대부분을 하이브리드 방식으로 전환하면서 기존 PMO를 가치 인도 사무국(VDO, Value Delivery Office)으로 개편하기로 했다. 개편 TF에 참여한 프로젝트 관리자로서 새 VDO의 역할로 제안하기에 가장 적절한 것은?","options":["팀 간 일관성을 위해 모든 팀의 스프린트 백로그를 승인하고 작업 배정을 직접 결정한다.","팀 코칭, 가치 지표 체계 정립, 경영진 후원 확보 등 팀의 가치 인도를 돕는 지원에 집중한다.","하이브리드의 불확실성을 통제하기 위해 단계 게이트 문서와 승인 절차를 더 강화한다.","팀 자율성을 극대화하기 위해 프로젝트 관리 표준을 모두 폐지하고 각 팀이 독립적으로 운영하게 한다."],"answer":[1],"explanation":"VDO는 통제보다 가능화(enabling)에 초점을 둔 PMO 형태로, 코칭·역량 개발·가치 측정·경영진 후원 확보를 통해 팀의 가치 인도를 지원한다. 자율적인 팀을 존중하면서도 조직 차원의 일관성과 학습을 촉진한다.","optionNotes":["백로그 승인과 작업 배정 결정은 팀과 제품 책임자의 권한이며, VDO의 지원 성격과 맞지 않는다.","정답. 코칭·지표·후원 확보 등 가능화 역할이 VDO의 핵심이다.","문서 통제 강화는 기존 통제형 PMO의 방식이며 개편 취지에 어긋난다.","표준의 전면 폐지는 조직 차원의 일관성과 지식 공유를 잃게 하며 VDO의 목적이 아니다."]},{"id":"g-b004","domain":"business","edition":"8th","approach":"predictive","tags":["PMO","테일러링"],"stem":"통제형 PMO(Controlling PMO)가 운영되는 공공기관에서 6주짜리 소규모 내부 시스템 개선 프로젝트를 맡았다. PMO 표준은 규모와 관계없이 42종의 문서 템플릿 작성을 요구하며, 팀은 문서 작업량이 실제 개발 작업보다 많아질 것을 우려한다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["소규모 프로젝트이므로 PMO에 따로 알리지 않고 핵심 문서만 선별해 작성한다.","PMO 표준은 의무 사항이므로 팀의 우려와 관계없이 42종 문서를 모두 작성한다.","문서 부담이 개발 작업보다 과도하므로 스폰서에게 PMO 표준 적용 면제를 즉시 요청한다.","프로젝트 특성을 근거로 문서 테일러링 안을 작성해 PMO 절차에 따라 승인을 받는다."],"answer":[3],"explanation":"프로세스와 산출물은 프로젝트 규모·복잡성·리스크에 맞게 테일러링해야 하지만, 통제형 PMO 환경에서는 정해진 거버넌스 절차를 통해 승인받아야 한다. 근거를 갖춘 테일러링 제안은 규정 준수와 효율성을 함께 확보한다.","optionNotes":["PMO 몰래 표준을 생략하는 것은 거버넌스 위반이며 감사 시 문제가 된다.","규모에 맞지 않는 과도한 문서는 가치 없는 작업을 늘리며 테일러링 원칙에 어긋난다.","근거 분석 없이 면제를 요청하는 것은 PMO 거버넌스를 우회하는 성급한 조치이다.","정답. 근거를 갖춘 테일러링 안을 정식 절차로 승인받는 것이 적절하다."],"diffNote":"8판은 40개 프로세스를 비규범적이고 테일러링 가능한 것으로 제시하고 PMO 지침을 보강했다. 7판은 테일러링을 별도 섹션으로 다뤘지만 PMO와의 연계는 상대적으로 적었다."},{"id":"g-b005","domain":"business","edition":"both","approach":"predictive","tags":["컴플라이언스","감사"],"stem":"내부 감사팀이 진행 중인 결제 시스템 프로젝트를 점검한 결과, 운영 서버 접근 권한에 대한 분기별 검토가 사내 보안 정책대로 수행되지 않았다는 지적 사항을 발견했다. 감사팀은 30일 내 시정 계획 제출을 요구했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["출시 일정이 더 시급하므로 지적 사항 대응은 출시 이후로 미루고 감사팀에 통보한다.","지적 사항의 원인과 범위를 파악하고 보안 담당자와 시정 및 재발 방지 계획을 세운다.","검토 수행 확인서를 담당자에게 받아 감사팀에 제출해 지적 사항을 신속히 종결한다.","접근 권한 관리는 보안팀 소관이므로 지적 사항을 보안팀에 이관하고 작업을 계속한다."],"answer":[1],"explanation":"규정 준수 이슈는 즉시 대응해야 하며, 먼저 원인과 범위를 이해한 뒤 시정 조치와 재발 방지 대책을 수립한다. 프로젝트 관리자는 프로젝트 내 규정 준수에 대한 책임을 진다.","optionNotes":["규정 미준수를 방치하면 보안 리스크와 감사 리스크가 커지며 기한도 지킬 수 없다.","정답. 원인 분석 후 시정 및 재발 방지 계획을 세우는 것이 올바른 대응이다.","수행하지 않은 검토에 대한 확인서는 허위 보고로 윤리 강령의 정직 의무를 위반한다.","프로젝트 내 통제 미흡은 프로젝트 관리자의 책임이며 다른 부서로 떠넘길 수 없다."]},{"id":"g-b006","domain":"business","edition":"both","approach":"predictive","tags":["윤리","선물수수"],"stem":"공공 교통 신호 시스템 구축 프로젝트의 공급업체 평가위원으로 참여 중이다. 입찰 평가 기간에 한 입찰 업체의 영업 담당자가 '업계 세미나 참석'을 명목으로 항공권과 리조트 숙박이 포함된 해외 출장을 제안했다. 조직 정책은 평가 기간 중 이해관계자로부터의 선물 수수를 금지한다. 가장 적절한 대응은?","options":["세미나가 업무와 관련 있으므로 수락하되 평가에서는 다른 업체와 동일하게 공정히 채점한다.","형평성을 맞추기 위해 다른 입찰 업체에도 동일한 수준의 세미나 지원을 요청한다.","제안을 정중히 거절하고, 정책에 따라 해당 사실을 조달 또는 윤리 담당 부서에 보고한다.","제안을 거절하고, 정책을 위반한 해당 업체를 평가위원 권한으로 즉시 입찰에서 탈락시킨다."],"answer":[2],"explanation":"PMI 윤리 및 직업 행동 강령은 공정성과 이해충돌 회피를 요구하며, 조직 정책을 준수해야 한다. 부적절한 제안은 거절하고 정해진 절차에 따라 보고해 조직이 적절히 판단하도록 한다.","optionNotes":["정책이 금지하는 선물을 수락하는 것은 공정성을 해치며 외관상 이해충돌도 발생한다.","다른 업체에 혜택을 요구하는 것은 오히려 부정행위를 확대한다.","정답. 거절하고 정해진 절차로 보고하는 것이 윤리·규정 준수에 맞다.","탈락 결정은 평가위원 개인이 일방적으로 내릴 수 없으며 조달 절차에 따라 처리되어야 한다."]},{"id":"g-b007","domain":"business","edition":"both","approach":"predictive","tags":["윤리","이해충돌"],"stem":"병원 증축 프로젝트에서 의료 장비 조달 입찰이 공고되었다. 입찰 참여 업체 목록을 검토하던 프로젝트 관리자는 자신의 배우자가 지분을 보유한 업체가 포함되어 있음을 알게 되었다. 프로젝트 관리자는 평가위원장으로 지정되어 있다. 가장 적절한 조치는?","options":["이해충돌 사실을 스폰서와 조달 부서에 공개하고 해당 입찰 평가에서 빠지겠다고 요청한다.","지분은 배우자 소유이고 본인은 공정하게 평가할 수 있으므로 별도 조치 없이 평가를 진행한다.","이해충돌을 미리 해소하기 위해 배우자에게 해당 업체의 입찰 참여 철회를 요청한다.","공정성 논란을 피하기 위해 그 업체에는 의도적으로 보수적인 점수를 부여한다."],"answer":[0],"explanation":"윤리 강령은 실제 또는 잠재적 이해충돌을 적절한 이해관계자에게 공개하고 의사결정 과정에서 물러날 것을 요구한다. 본인의 공정성에 대한 확신과 무관하게 공개가 우선이다.","optionNotes":["정답. 이해충돌을 공개하고 평가에서 빠지는 것이 공정성 원칙에 맞다.","공정하게 평가할 의지가 있어도 잠재적 이해충돌은 공개해야 한다.","업체의 입찰 참여에 개입하는 것은 부적절하며 공정 경쟁을 훼손한다.","의도적으로 낮은 점수를 주는 것도 불공정한 평가이며 이해충돌을 숨기는 행위이다."]},{"id":"g-b008","domain":"business","edition":"both","approach":"agile","tags":["윤리","투명성"],"stem":"스프린트 리뷰 하루 전, 영업 임원이 '주요 고객이 참석하니 아직 테스트가 끝나지 않은 결제 기능도 완료된 것처럼 시연해 달라'고 요청했다. 해당 기능은 아직 완료 정의(Definition of Done)를 충족하지 못했다. 스크럼 마스터로서 가장 적절한 대응은?","options":["주요 고객이 참석하므로 완료된 것처럼 시연하고 남은 테스트는 다음 스프린트에서 마무리한다.","논란을 피하기 위해 별도 설명 없이 결제 기능을 시연 항목에서 조용히 제외한다.","임원과의 갈등을 피하고 기능을 완성할 시간을 벌기 위해 스프린트 리뷰를 일주일 연기한다.","임원에게 투명성의 중요성을 설명하고, 결제 기능은 실제 진척과 남은 작업을 그대로 공유한다."],"answer":[3],"explanation":"정직은 PMI 윤리 강령의 핵심 가치이며 애자일의 투명성 원칙과도 일치한다. 미완성 기능을 완료된 것처럼 보여주면 고객의 잘못된 기대와 의사결정을 유발하므로, 실제 상태를 투명하게 공유해야 한다.","optionNotes":["미완성 기능을 완료된 것처럼 시연하는 것은 정직 의무를 위반한다.","설명 없이 제외하면 임원과의 신뢰 문제를 회피할 뿐 투명한 소통이 아니다.","리뷰 연기는 문제를 회피하는 것이며 피드백 기회를 잃게 한다.","정답. 임원과 직접 대화하고 실제 상태를 투명하게 공유하는 것이 적절하다."]},{"id":"g-b009","domain":"business","edition":"8th","approach":"predictive","tags":["지속가능성","생애주기비용"],"stem":"물류센터 신축 프로젝트에서 설계팀이 지붕 단열재 두 가지 대안을 제시했다. A안은 초기 비용이 8% 저렴하지만 에너지 효율이 낮아 30년 운영 기간 동안 에너지 비용과 탄소 배출이 크게 늘어난다. B안은 초기 비용이 높지만 생애주기 비용이 더 낮다. 예산이 빠듯한 상황에서 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["승인된 예산 기준선 준수가 최우선이므로 초기 비용이 낮은 A안을 선택해 설계를 확정한다.","환경적으로 우수한 B안을 선택하고 늘어나는 초기 비용은 우발사태 예비비로 충당한다.","지금은 결정을 운영 단계로 미루고, 설계는 일정 유지를 위해 일단 A안 기준으로 진행한다.","두 안의 생애주기 비용과 환경 영향을 비교 분석해 스폰서가 결정할 수 있도록 제시한다."],"answer":[3],"explanation":"지속가능성은 초기 비용뿐 아니라 인도물의 전체 생애주기에 걸친 경제·환경·사회적 영향을 고려해 의사결정하는 것을 의미한다. 예산 기준선에 영향을 주는 선택이므로 분석 결과를 의사결정 권한자에게 제시하는 것이 적절하다.","optionNotes":["초기 비용만 보는 것은 장기 운영 비용과 환경 영향을 무시한 단기적 판단이다.","예비비는 식별된 리스크 대응용이며, 설계 대안 선택을 프로젝트 관리자가 일방적으로 결정하는 것도 부적절하다.","설계 단계 결정을 미루면 이후 변경 비용이 커지고 지속가능성 고려가 사실상 배제된다.","정답. 생애주기 관점의 분석을 바탕으로 이해관계자의 의사결정을 지원한다."],"diffNote":"8판은 '모든 프로젝트 영역에 지속가능성 통합'을 6원칙 중 하나로 명시했다. 7판은 스튜어드십 원칙 안에서 간접적으로 다뤘다."},{"id":"g-b010","domain":"business","edition":"8th","approach":"hybrid","tags":["AI거버넌스","조달"],"stem":"제조사의 하이브리드 프로젝트에서 조달 담당자가 생성형 AI 기반 도구로 협력업체 제안서를 자동 채점해 상위 3개 업체만 평가위원회에 올리자고 제안했다. 회사에는 아직 AI 사용 정책이 없고, 도구의 채점 로직은 공개되지 않는다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["평가 효율이 크게 높아지므로 도구를 즉시 도입하고 채점 결과를 그대로 평가에 활용한다.","관련 부서와 편향 검증·인간 검토·근거 기록 등 사용 기준을 정한 뒤 보조 수단으로 쓸지 정한다.","AI 사용 정책이 없어 리스크가 크므로 프로젝트 전반에서 AI 사용을 전면 금지한다.","도구 결과를 활용하되 불필요한 이의 제기를 막기 위해 공급업체에는 AI 사용 사실을 알리지 않는다."],"answer":[1],"explanation":"조달 평가는 공정성과 설명 가능성이 요구되는 영역이므로, 불투명한 AI 결과로 업체를 걸러내면 편향과 책임 소재 문제가 생긴다. 관련 부서와 사용 기준(편향 검증, 인간 감독, 투명성)을 정한 뒤 보조 수단으로 활용하는 것이 책임 있는 AI 활용이다.","optionNotes":["검증 없이 블랙박스 결과로 업체를 탈락시키면 공정성과 설명 책임을 확보할 수 없다.","정답. 거버넌스 기준을 먼저 정하고 사람이 최종 책임을 지는 보조 수단으로 활용한다.","정책이 없다는 이유로 전면 금지하는 것은 과도하며 AI의 정당한 가치를 버린다.","AI 사용 사실을 숨기는 것은 투명성과 정직 원칙에 어긋난다."],"diffNote":"8판은 AI 활용을 전반에 반영하고 투명성·책임성을 강조한다. 7판에는 AI 거버넌스에 대한 직접적 지침이 거의 없었다."},{"id":"g-b011","domain":"business","edition":"8th","approach":"agile","tags":["AI거버넌스","책임성"],"stem":"제품 책임자(PO)가 고객 데이터 분석 AI 도구가 추천한 순서대로 제품 백로그 우선순위를 정하고 있다. 한 주요 이해관계자가 '왜 우리 부서 요구사항이 계속 뒤로 밀리느냐'고 묻자 PO는 'AI가 그렇게 판단했다'고만 답했다. 애자일 코치로서 가장 적절한 조치는?","options":["AI 판단은 객관적인 데이터에 기반하므로 이해관계자에게 결과를 수용하도록 설득한다.","이해관계자 불만이 커지고 있으므로 PO에게 AI 도구 사용을 즉시 중단하라고 지시한다.","우선순위 책임은 AI가 아닌 PO에게 있음을 코칭하고 PO가 결정 근거를 설명하도록 돕는다.","불만 해소를 위해 해당 부서 요구사항을 백로그 최상단으로 옮기도록 PO에게 권한다."],"answer":[2],"explanation":"AI는 의사결정을 지원할 수 있지만 책임은 사람에게 남는다. PO는 AI 추천을 비판적으로 검토하고 이해관계자에게 우선순위의 근거를 설명할 수 있어야 한다.","optionNotes":["AI 결과를 근거 설명 없이 수용하도록 요구하는 것은 투명성과 책임성을 회피하는 것이다.","코치는 PO에게 지시할 권한이 없으며, 도구 사용 자체가 문제의 본질도 아니다.","정답. 책임 있는 리더십과 투명한 의사결정을 코칭하는 것이 적절하다.","목소리 큰 이해관계자를 위해 우선순위를 바꾸는 것은 가치 기반 우선순위 결정이 아니며 PO 권한도 침해한다."],"diffNote":"8판은 '책임 있는 리더가 되라' 원칙과 AI 활용 지침을 통해 AI 지원 의사결정에서도 사람의 책임을 강조한다. 7판에는 AI 관련 지침이 없었다."},{"id":"g-b012","domain":"business","edition":"both","approach":"predictive","tags":["EEF","OPA"],"stem":"신규 프로젝트 기획 단계에서 프로젝트 관리자가 기업 환경 요인(EEF, Enterprise Environmental Factors)과 조직 프로세스 자산(OPA, Organizational Process Assets)을 구분해 정리하고 있다. 다음 중 조직 프로세스 자산(OPA)에 해당하는 것은? (2개를 고르시오)","options":["과거 프로젝트에서 축적된 교훈 저장소","프로젝트에 적용되는 정부 산업 규제와 표준","조직의 변경 통제 절차와 표준 템플릿","현지 노동 시장의 숙련 인력 수급 상황","조직 문화와 경영진의 리스크 선호도"],"answer":[0,2],"explanation":"OPA는 조직이 보유하고 프로젝트가 활용할 수 있는 계획·프로세스·정책·절차·지식 기반(교훈, 템플릿 등)이다. EEF는 프로젝트 팀이 통제할 수 없으면서 프로젝트에 영향을 주는 내·외부 조건으로, 규제·시장 상황·조직 문화 등이 포함된다.","optionNotes":["정답. 교훈 저장소는 조직의 지식 기반으로 대표적인 OPA이다.","정부 규제와 산업 표준은 외부 EEF이다.","정답. 변경 통제 절차와 템플릿은 조직의 프로세스·정책 자산으로 OPA이다.","노동 시장 상황은 외부 EEF이다.","조직 문화와 리스크 선호도는 내부 EEF이다."]},{"id":"g-b013","domain":"business","edition":"both","approach":"hybrid","tags":["조직변화관리","변화준비도"],"stem":"전국 120개 지점에 신규 고객관리 시스템을 단계적으로 도입하는 하이브리드 프로젝트에서, 변화 준비도 평가(Change readiness assessment) 결과 지방 지점 30곳의 준비도가 낮게 나왔다. 해당 지점들은 이전 시스템 교체 실패 경험이 있고 디지털 숙련도가 낮은 직원 비율이 높다. 다음 출시 웨이브에 이 지점들이 포함되어 있다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["준비도가 낮은 원인에 맞춰 변화 챔피언·맞춤 교육·현장 지원을 강화하고 전환 시점 조정을 협의한다.","일정 준수가 중요하므로 계획대로 전 지점에 출시하고 문제가 생기면 현장 지원팀이 대응한다.","출시 리스크를 줄이기 위해 준비도가 낮은 30개 지점을 이번 프로젝트 범위에서 제외한다.","경영진에 요청해 지점장들에게 시스템 사용을 의무화하는 공문을 발송하고 사용률을 점검한다."],"answer":[0],"explanation":"조직 변화의 성공은 기술 인도가 아니라 사람들이 새로운 방식을 채택하는 데 달려 있다. 준비도 평가 결과를 근거로 변화 관리 활동과 출시 전략을 조정하는 것이 편익 실현 가능성을 높인다.","optionNotes":["정답. 준비도 원인에 맞춘 변화 관리 활동과 출시 조정이 적절하다.","평가 결과를 무시하고 진행하면 채택 실패와 과거의 실패 경험 반복 위험이 크다.","범위 제외는 비즈니스 목표를 훼손하며 변경 통제 없이 할 수 없다.","강제 지시만으로는 저항과 낮은 준비도의 원인을 해결할 수 없다."]},{"id":"g-b014","domain":"business","edition":"both","approach":"predictive","tags":["외부환경","지정학리스크"],"stem":"해외 플랜트 건설 프로젝트의 핵심 압축기를 공급하는 업체가 소재한 국가에 대해 새로운 국제 수출 제재가 발표되었다. 해당 장비는 4개월 후 선적될 예정이며 주 공정 경로(Critical path)상에 있다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["공급 차질이 확실하므로 즉시 계약을 해지하고 제재 대상이 아닌 국가의 업체와 신규 계약한다.","제재가 외교 협상에 따라 철회될 가능성이 있으므로 선적 시점까지 상황을 지켜본다.","스폰서에게 일정 지연이 불가피하다고 보고하고 일정 기준선 변경 요청을 즉시 제출한다.","법무·조달과 함께 제재가 계약 이행과 일정에 미치는 영향을 분석하고 리스크 등록부를 갱신한다."],"answer":[3],"explanation":"외부 환경 변화가 발생하면 먼저 영향을 분석하고 리스크로 관리해야 한다. 제재는 법적 해석이 필요하므로 법무·조달과 협력해 계약상 영향을 파악한 뒤 대응 전략을 세운다.","optionNotes":["영향 분석 없이 계약을 해지하면 법적 분쟁과 추가 비용이 발생할 수 있다.","주 공정 경로상의 리스크를 방치하는 것은 수동적 회피이다.","영향을 분석하기도 전에 지연을 단정하고 기준선 변경을 요청하는 것은 성급하다.","정답. 영향 분석과 리스크 등록부 갱신이 가장 먼저 할 일이다."]},{"id":"g-b015","domain":"business","edition":"8th","approach":"predictive","tags":["재무","외부환경"],"stem":"18개월 공공 건축 프로젝트의 9개월 차에 원자재 가격이 예상보다 12% 상승했다. 남은 자재 구매 예산은 500만 달러이고, 우발사태 예비비(Contingency reserve)는 40만 달러가 남아 있다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["가격이 더 오르기 전에 남은 예비비 40만 달러를 즉시 모두 사용해 자재를 선구매한다.","영향(약 60만 달러)을 분석해 EAC를 갱신하고, 예비비로 부족한 금액은 스폰서와 협의한다.","승인된 예산을 지키기 위해 설계 기준 범위 안에서 자재 품질 등급을 낮춰 구매한다.","부족분 20만 달러는 관리 예비비에서 쓰도록 프로젝트 관리자가 직접 승인한다."],"answer":[1],"explanation":"500만 달러의 12%는 60만 달러로, 남은 예비비 40만 달러로는 20만 달러가 부족하다. 재무 영향을 정량화하고 예측치를 갱신한 뒤, 예비비를 초과하는 부분은 스폰서와 협의해야 한다.","optionNotes":["영향 분석 없이 예비비를 소진하면 다른 리스크 대응 여력이 사라지고 부족분 문제도 해결되지 않는다.","정답. 영향(600,000 - 400,000 = 200,000 부족)을 정량화하고 예측을 갱신해 스폰서와 협의한다.","품질 등급을 일방적으로 낮추면 품질 요구사항 위반이며 변경 통제를 거쳐야 한다.","관리 예비비는 경영진의 승인이 필요하며 프로젝트 관리자가 직접 사용할 수 없다."],"diffNote":"8판은 재무를 독립된 성과 영역으로 두어 비용 예측, 예비비, 재무 의사결정을 강조한다. 7판에는 재무 성과 영역이 없었고 측정·기획 영역에 분산되어 있었다."},{"id":"g-b016","domain":"business","edition":"both","approach":"hybrid","tags":["공급망","외부환경"],"stem":"신규 매장 20곳 오픈과 모바일 주문 앱 개발을 함께 진행하는 하이브리드 프로그램에서, 주요 해상 항로 차질로 매장용 주방 설비의 도착이 8주 지연된다는 통보를 받았다. 앱 개발 팀은 2주 스프린트로 진행 중이며, 매장 오픈 일정은 대규모 마케팅 캠페인과 연동되어 있다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["설비가 도착할 때까지 앱 개발 스프린트를 중단해 인건비를 절감하고 일정을 맞춘다.","캠페인 비용이 이미 집행되었으므로 예정대로 진행하고 매장 오픈 지연은 사후 공지한다.","지연이 오픈·캠페인·앱 출시에 주는 영향을 분석하고 대체 운송 등 대안을 이해관계자와 협의한다.","운송 지연은 계약상 공급업체 책임이므로 공급업체에 해결을 맡기고 현재 계획을 유지한다."],"answer":[2],"explanation":"공급망 차질은 여러 연결된 작업에 파급되므로 전체 영향을 분석하고 대안을 마련해 이해관계자와 함께 결정해야 한다. 하이브리드 환경에서는 예측형·적응형 부분 간 의존성을 함께 고려한다.","optionNotes":["앱 개발은 설비와 독립적으로 가치를 낼 수 있으므로 중단은 불필요한 손실이다.","영향 분석 없이 캠페인을 진행하면 고객 신뢰와 브랜드에 손상을 줄 수 있다.","정답. 통합적 영향 분석과 대안 검토 후 이해관계자와 협의하는 것이 적절하다.","공급업체에 책임이 있더라도 프로젝트 영향 관리는 프로젝트 관리자의 몫이다."]},{"id":"g-b017","domain":"business","edition":"both","approach":"predictive","tags":["지식재산권","라이선스"],"stem":"의료기기 제조사의 상용 소프트웨어 개발 프로젝트에서 한 개발자가 개발 기간을 3주 단축할 수 있다며 강한 카피레프트 조건의 오픈소스 라이브러리(GPL)를 사용하자고 제안했다. 이 제품은 소스코드를 공개하지 않는 독점 소프트웨어로 배포된다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["라이선스 조건이 제품 배포 방식과 충돌하는지 법무 또는 오픈소스 담당과 검토한 뒤 결정한다.","오픈소스는 누구나 무료로 쓸 수 있으므로 일정 단축을 위해 바로 사용을 승인한다.","일정 단축 효과가 크므로 우선 사용하고, 라이선스 문제가 확인되면 그때 대체 라이브러리로 바꾼다.","라이선스 리스크를 원천 차단하기 위해 프로젝트에서 모든 오픈소스 사용을 금지한다."],"answer":[0],"explanation":"오픈소스도 라이선스 조건이 있으며, 강한 카피레프트 라이선스는 배포 방식에 따라 소스 공개 의무를 발생시킬 수 있다. 사용 전에 전문 부서의 검토를 거쳐 지식재산권 리스크를 관리해야 한다.","optionNotes":["정답. 사용 전 라이선스 준수 여부를 전문가와 검토한다.","무료라는 것과 조건 없이 사용할 수 있다는 것은 다르며, 라이선스 의무를 무시한 판단이다.","출시 후 발견되면 소스 공개 의무나 법적 분쟁 등 더 큰 비용이 발생할 수 있다.","전면 금지는 과도한 대응이며 허용적 라이선스의 정당한 활용 가치까지 버린다."]},{"id":"g-b018","domain":"business","edition":"both","approach":"agile","tags":["지식재산권","계약"],"stem":"한 스타트업이 외부 개발 협력사 인력 3명을 내부 스크럼 팀에 합류시켜 핵심 추천 알고리즘을 개발하고 있다. 스프린트 4 진행 중, 협력사와의 계약서에 개발 산출물의 지식재산권(IP) 귀속 조항이 없다는 사실이 확인되었다. 프로젝트 리더로서 가장 적절한 조치는?","options":["회사 팀 안에서 함께 작업했으므로 IP는 회사에 귀속된다고 보고 개발을 계속 진행한다.","권리 분쟁 소지를 없애기 위해 협력사 인력을 즉시 팀에서 제외하고 내부 인력으로 대체한다.","빠른 해결을 위해 협력사 인력 개개인에게 산출물에 대한 IP 포기 각서를 받는다.","법무·조달 부서에 알려 IP 귀속 조항을 보완하는 계약 변경과 기존 산출물 권리 정리를 요청한다."],"answer":[3],"explanation":"핵심 자산의 IP 귀속이 불명확하면 사업 가치 자체가 위협받는다. 계약 문제는 계약 권한이 있는 법무·조달 부서를 통해 공식적으로 해결해야 하며, 기존 산출물에 대한 권리도 함께 정리해야 한다.","optionNotes":["IP는 계약과 관련 법에 따라 결정되며 자동 귀속을 가정하는 것은 위험하다.","인력을 제외해도 이미 만든 산출물의 권리 문제는 해결되지 않고 팀 생산성만 떨어진다.","개인 각서는 협력사와의 계약 관계를 우회하는 것으로 법적 효력이 불확실하다.","정답. 정식 계약 보완을 통해 현재와 과거 산출물의 IP를 명확히 한다."]},{"id":"g-b019","domain":"business","edition":"8th","approach":"predictive","tags":["사회적책임","이해관계자"],"stem":"도심 지하철 역사 리모델링 프로젝트에서 야간 공사 소음으로 인근 주민 민원이 급증하고 있다. 공사는 허가된 소음 기준을 지키고 있으며, 주민들은 프로젝트 이해관계자 등록부에 포함되어 있지 않다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["허가된 소음 기준을 준수하고 있으므로 법적 의무가 없는 민원에는 별도로 대응하지 않는다.","주민을 이해관계자로 식별해 우려를 파악하고 작업 시간 조정 등 완화 방안을 검토한다.","인허가 기관이 지자체이므로 주민 민원 대응을 지자체에 일임하고 공사를 계속한다.","민원 확산을 막기 위해 야간 공사를 즉시 전면 중단하고 주간 작업으로만 전환하도록 지시한다."],"answer":[1],"explanation":"프로젝트의 영향을 받는 지역사회는 이해관계자이며, 법적 최소 기준 준수를 넘어 사회적 영향을 관리하는 것이 사회적 책임과 지속가능성의 일부이다. 우려를 파악한 뒤 현실적인 완화 방안을 검토한다.","optionNotes":["법적 준수만으로는 사회적 영향과 이해관계자 관계를 관리할 수 없으며 민원이 프로젝트 리스크로 확대될 수 있다.","정답. 이해관계자로 식별하고 영향 완화 방안을 검토하는 것이 적절하다.","프로젝트가 만든 영향에 대한 대응 책임을 외부로 떠넘기는 것이다.","분석 없이 전면 중단하면 일정·비용에 큰 영향을 주며 변경 통제도 거치지 않은 결정이다."],"diffNote":"8판의 '모든 프로젝트 영역에 지속가능성 통합' 원칙은 환경뿐 아니라 사회적 영향과 지역사회를 포함한다. 7판은 스튜어드십 원칙에서 사회적 책임을 일반적으로 언급했다."},{"id":"g-b020","domain":"business","edition":"8th","approach":"hybrid","tags":["거버넌스","권한위임"],"stem":"대형 유통사의 하이브리드 프로젝트에서 애자일 팀들은 2주 스프린트로 작업하지만, 1천만 원 이하의 사소한 범위 조정까지도 월 1회 열리는 운영위원회 승인을 받아야 한다. 이 때문에 팀이 결정을 평균 3주씩 기다리고 있다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["팀의 대기 시간을 없애기 위해 승인 전이라도 팀이 먼저 진행하고 사후에 보고하도록 한다.","결정 대기 시간을 줄이기 위해 운영위원회 회의를 월 1회에서 매주 개최로 바꿔 달라고 요청한다.","변경 규모별 의사결정 권한 위임 기준을 정의한 거버넌스 테일러링 안을 운영위원회에 제안한다.","운영위원회 승인을 피할 수 있도록 큰 변경을 1천만 원 이하의 작은 단위로 쪼개 진행한다."],"answer":[2],"explanation":"효과적인 거버넌스는 의사결정을 적절한 수준에 위임해 통제와 민첩성의 균형을 맞춘다. 변경 규모별 권한 임계값을 정하면 위원회는 중요한 결정에 집중하고 팀은 빠르게 움직일 수 있다.","optionNotes":["승인 없이 진행하는 것은 현재 거버넌스를 위반한다.","회의 빈도를 높이면 일부 개선되지만 위원회의 부담만 늘고 근본적인 권한 구조 문제는 남는다.","정답. 권한 위임 임계값을 포함한 거버넌스 테일러링이 근본적 해결책이다.","의도적으로 변경을 쪼개 승인을 회피하는 것은 비윤리적이며 거버넌스를 무력화한다."],"diffNote":"8판은 거버넌스를 독립 성과 영역으로 두고 '권한 위임 문화 구축' 원칙을 제시해 하이브리드 환경의 의사결정 권한 설계를 강조한다. 7판에는 거버넌스 성과 영역이 없었다."},{"id":"g-b021","domain":"business","edition":"8th","approach":"predictive","tags":["재무","투자회수기간"],"stem":"한 물류회사가 창고 자동화 프로젝트를 검토 중이다. 초기 투자액은 100만 달러이며, 가동 후 연간 순현금흐름은 1·2년 차 각 20만 달러, 3년 차부터 매년 25만 달러로 예상된다. 회사의 포트폴리오 선정 기준은 '투자회수기간(Payback period) 4년 이내'이다. 할인하지 않은 투자회수기간과 기준 충족 여부로 옳은 것은?","options":["4.0년, 기준 충족","3.6년, 기준 충족","5.0년, 기준 미충족","4.4년, 기준 미충족"],"answer":[3],"explanation":"누적 현금흐름은 1년 차 20만, 2년 차 40만, 3년 차 65만, 4년 차 90만 달러이며, 남은 10만 달러는 5년 차 25만 달러 중 0.4년분이므로 투자회수기간은 4.4년이다. 기준(4년 이내)을 충족하지 못하지만, 투자회수기간은 회수 이후 현금흐름을 무시하므로 NPV 등 다른 지표와 함께 판단하는 것이 좋다.","optionNotes":["4년 차까지 누적 90만 달러로 아직 10만 달러가 회수되지 않았다.","모든 연도에 25만 달러가 들어온다고 가정하는 등 계산을 잘못한 값이다.","5년 차 전체를 반영한 값으로, 연중 회수 시점을 반영하지 않았다.","정답. 4년 + 10만/25만 = 4.4년으로 기준을 충족하지 못한다."],"diffNote":"8판은 재무 성과 영역을 신설해 투자 타당성 지표(투자회수기간, NPV 등)를 통한 재무적 의사결정을 강조한다. 7판에는 재무 성과 영역이 따로 없었다."},{"id":"g-b022","domain":"business","edition":"both","approach":"predictive","tags":["편익등록부","역편익"],"stem":"전자결재 시스템 도입 프로젝트를 실행하던 중, 새 시스템이 기존 문서 보관 장비와 호환되지 않아 운영 부서가 연간 약 8천만 원의 추가 유지보수 비용을 부담하게 된다는 사실이 확인되었다. 이 비용은 비즈니스 케이스에 반영되어 있지 않다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["해당 비용을 역편익으로 편익 등록부에 기록하고 비즈니스 케이스 영향을 분석해 스폰서에게 보고한다.","운영 비용은 프로젝트 범위와 예산 밖의 사안이므로 편익 등록부에 따로 기록하지 않는다.","편익을 지키기 위해 호환성 문제를 해결하는 추가 개발에 즉시 착수하고 결과를 보고한다.","현재 프로젝트 성과에는 영향이 없으므로 종료 보고서에 교훈으로만 기록해 둔다."],"answer":[0],"explanation":"역편익은 프로젝트 결과로 발생하는 부정적 영향으로, 편익과 함께 관리해야 비즈니스 케이스의 타당성을 정확히 판단할 수 있다. 영향을 분석해 의사결정 권한자에게 투명하게 보고해야 한다.","optionNotes":["정답. 역편익을 기록하고 비즈니스 케이스 영향을 분석해 보고한다.","운영 비용도 프로젝트 결과로 생기는 것이므로 투자 판단에 반드시 반영되어야 한다.","해결책을 분석·승인 없이 바로 착수하는 것은 변경 통제를 무시한 것이다.","종료 시점까지 기다리면 현재 의사결정에 필요한 정보가 전달되지 않는다."]},{"id":"g-b023","domain":"business","edition":"both","approach":"agile","tags":["OKR","성과측정"],"stem":"한 핀테크 기업의 제품 팀이 분기 목표 및 핵심 결과(OKR)를 수립하고 있다. 목표(Objective)는 '소상공인의 대출 신청 경험을 획기적으로 개선한다'이고, 팀이 제안한 핵심 결과(Key Result)는 '신규 기능 10개 출시'이다. 애자일 코치로서 가장 적절한 조언은?","options":["'신청 완료율 60%→75%'처럼 고객 결과(Outcome)를 측정하는 핵심 결과로 다시 쓰도록 돕는다.","기능 개수는 명확하고 측정이 쉬우므로 팀이 제안한 핵심 결과를 그대로 유지하도록 조언한다.","팀 생산성이 곧 고객 경험 개선으로 이어지므로 핵심 결과를 '속도(Velocity) 20% 향상'으로 바꾼다.","OKR은 팀 내부 동기부여 도구이므로 회사 전략 목표와 굳이 연계할 필요가 없다고 안내한다."],"answer":[0],"explanation":"핵심 결과는 산출물(Output)이 아니라 목표 달성 여부를 보여주는 측정 가능한 결과(Outcome)여야 한다. 고객 행동 변화를 측정해야 기능 출시가 실제로 가치를 냈는지 판단할 수 있다.","optionNotes":["정답. 고객 결과 중심의 측정 가능한 핵심 결과로 바꾸는 것이 적절하다.","기능 개수는 산출물 지표이며 고객 경험 개선 여부를 보여주지 못한다.","속도는 팀 내부의 용량 계획 지표로, 비교나 목표로 쓰면 왜곡되고 고객 가치와도 무관하다.","OKR은 조직 목표와의 정렬(Alignment)을 위한 도구이다."]},{"id":"g-b024","domain":"business","edition":"8th","approach":"agile","tags":["가치인도","성과측정"],"stem":"모바일 뱅킹 앱의 '자동 저축' 기능이 3개 스프린트에 걸쳐 개발·출시되었다. 출시 한 달 뒤 분석해 보니 활성 사용자의 2%만 이 기능을 사용하고 있으며, 목표는 15%였다. 팀은 다음 기능 개발로 바로 넘어가려 한다. 애자일 프로젝트 리더로서 가장 적절한 조치는?","options":["기능이 완료 정의를 충족해 인도되었으므로 성공으로 보고하고 다음 기능 개발로 넘어간다.","PO·팀과 사용자 데이터를 분석해 낮은 사용률의 원인 가설을 세우고 개선 여부를 우선순위화한다.","사용률이 목표에 크게 못 미치므로 유지보수 비용을 줄이기 위해 기능을 즉시 제거한다.","사용률이 낮은 것은 인지도 부족 때문이므로 마케팅 부서에 홍보 강화를 요청하고 마무리한다."],"answer":[1],"explanation":"가치는 인도 자체가 아니라 사용자가 얻는 결과로 측정된다. 목표 결과에 미달하면 원인을 검증하고 학습을 백로그에 반영해 가치를 극대화하는 것이 경험적 접근이다.","optionNotes":["산출물 완료를 성공으로 간주하는 것은 결과·가치 중심 관점과 맞지 않는다.","정답. 데이터 기반으로 원인을 검증하고 개선 여부를 우선순위화한다.","원인 분석 없이 제거하면 투자한 가치를 회수할 기회를 잃는다.","원인이 홍보 부족인지 확인되지 않았으며 팀의 학습과 개선 책임을 외부로 넘긴다."],"diffNote":"7판에도 가치 중심 원칙이 있었지만, 8판은 6원칙 중 '가치에 집중'을 유지하면서 재무·거버넌스 영역과 연결해 결과(Outcome) 측정과 가치 인도를 더 전반적으로 강조한다."},{"id":"g-b025","domain":"business","edition":"both","approach":"hybrid","tags":["프로그램","디지털전환"],"stem":"한 은행의 디지털 전환 프로그램은 모바일 앱 재구축(애자일), 코어뱅킹 교체(예측형), 데이터 플랫폼 구축 등 5개 프로젝트로 구성된다. 모바일 앱 프로젝트를 맡은 당신은 코어뱅킹 프로젝트의 API 제공 일정이 2개월 늦어질 것이라는 소식을 비공식 경로로 들었다. 가장 적절한 조치는?","options":["앱 출시 일정을 지키기 위해 코어뱅킹 API에 의존하지 않는 자체 임시 API를 개발한다.","프로그램 일정 준수를 위해 코어뱅킹 프로젝트 관리자에게 원래 일정을 지키라고 강하게 요구한다.","코어뱅킹 PM에게 사실을 확인하고 프로그램 관리자와 함께 의존성 영향과 일정 조정을 협의한다.","비공식 정보로 계획을 바꾸면 혼란이 생기므로 공식 통보가 올 때까지 현재 계획을 유지한다."],"answer":[2],"explanation":"프로그램 내 프로젝트 간 의존성은 프로그램 수준에서 조율해야 프로그램 전체의 편익을 극대화할 수 있다. 정보를 확인한 뒤 프로그램 관리자와 함께 영향을 검토하는 것이 적절하다.","optionNotes":["독자적인 임시 API는 아키텍처 일관성을 해치고 중복 비용과 기술 부채를 만든다.","다른 프로젝트에 일방적으로 요구하는 것은 협력적 해결이 아니며 실제 제약을 바꾸지 못한다.","정답. 사실 확인 후 프로그램 차원에서 의존성을 조율한다.","조기 경보를 무시하면 대응할 시간을 잃는다."]},{"id":"g-b026","domain":"business","edition":"both","approach":"predictive","tags":["규제준수","윤리"],"stem":"의약품 생산 설비 검증(Validation) 프로젝트에서 규제기관 실사를 일주일 앞두고 일부 장비의 교정 기록이 누락된 사실이 발견되었다. 한 팀원이 '실제로 교정은 했으니 기록을 당시 날짜로 작성해 두자'고 제안했다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["교정은 실제로 수행되었으므로 사실을 반영하는 차원에서 당시 날짜로 기록 작성을 허용한다.","실사 범위에 포함되지 않을 가능성이 높으므로 해당 장비는 실사에서 별도로 언급하지 않는다.","규제기관에 실사 연기를 요청하고, 그 기간 동안 누락된 교정 기록을 당시 기준으로 작성한다.","소급 작성을 금지하고 QA와 함께 누락을 일탈(Deviation)로 문서화한 뒤 재교정 등 시정한다."],"answer":[3],"explanation":"기록을 과거 날짜로 꾸며내는 것은 데이터 무결성 위반이자 정직 의무 위반이다. 누락을 투명하게 문서화하고 정해진 품질 절차에 따라 시정하는 것이 규제 준수와 윤리에 맞다.","optionNotes":["교정 사실과 관계없이 과거 날짜로 기록을 작성하는 것은 기록 위조이다.","문제를 숨기는 것은 정직 의무 위반이며 발견 시 훨씬 큰 제재를 받는다.","연기 요청의 목적이 기록 작성(위조)이라면 근본적으로 부적절하다.","정답. 누락을 투명하게 문서화하고 품질 절차에 따라 시정한다."]},{"id":"g-b027","domain":"business","edition":"both","approach":"hybrid","tags":["데이터보호","조달"],"stem":"공공기관 민원 시스템을 클라우드로 이전하는 하이브리드 프로젝트에서 클라우드 업체 선정 평가가 진행 중이다. 가격이 가장 낮은 업체는 데이터를 해외 리전에 저장하는데, 해당 기관에는 개인정보를 국내에 보관해야 하는 내부 규정과 법적 요구사항이 있다. 프로젝트 관리자가 해야 할 가장 적절한 조치는?","options":["공공 예산 절감이 중요하므로 가격을 최우선으로 평가해 최저가 업체를 선정한다.","데이터 국내 보관을 필수 평가 조건으로 명시하고 법무·정보보호 부서 검토를 받아 진행한다.","최저가 업체와 우선 계약한 뒤, 계약 이행 과정에서 국내 리전으로 데이터 이전을 요청한다.","규정 해석이 모호해 분쟁 소지가 있으므로 데이터 보관 위치는 이번 평가 기준에서 제외한다."],"answer":[1],"explanation":"법적·규제 요구사항은 협상 대상이 아닌 필수 조건(Must-have)으로 조달 평가에 반영해야 한다. 전문 부서의 검토로 요구사항 해석을 명확히 하고 조달을 진행한다.","optionNotes":["규정을 위반하는 업체를 가격만으로 선정하면 법적 리스크가 발생한다.","정답. 규제 요구사항을 필수 평가 조건으로 명시하고 전문가 검토를 받는다.","계약 후 변경은 보장되지 않으며 그동안 규정 위반 상태가 된다.","모호함은 전문가 검토로 해소해야 하며, 평가에서 빼는 것은 규정 준수 책임을 회피하는 것이다."]},{"id":"g-b028","domain":"business","edition":"both","approach":"agile","tags":["정보보안","사고대응"],"stem":"애자일 팀이 사용하는 외부 협업 SaaS 도구의 공급업체가 대규모 보안 침해 사고를 공지했다. 팀은 이 도구에 고객사 시스템 설계 문서와 일부 접속 정보를 저장해 왔다. 스크럼 마스터로서 가장 먼저 해야 할 일은?","options":["도구 변경은 팀의 합의가 필요하므로 다음 회고에서 대체 도구 도입 여부를 팀과 논의한다.","추가 유출을 막기 위해 팀원들에게 도구에 저장된 설계 문서와 자료를 모두 삭제하도록 지시한다.","보안 사고 대응 절차에 따라 정보보호 부서에 즉시 보고하고 접속 정보 변경 등 지시를 따른다.","고객과의 신뢰를 지키기 위해 고객사에 침해 사실을 직접 통보하고 정중히 사과한다."],"answer":[2],"explanation":"보안 사고는 즉각적인 대응이 필요하며 조직의 사고 대응 절차를 따르는 것이 우선이다. 정보보호 부서가 영향 범위와 고객 통보 등 법적 의무를 판단하고 조치를 조율한다.","optionNotes":["보안 사고는 다음 회고까지 기다릴 수 없는 긴급 사안이다.","자료 삭제는 사고 조사에 필요한 증거를 훼손할 수 있으며 근본 대응도 아니다.","정답. 정해진 절차에 따라 즉시 보고하고 지시된 조치를 수행한다.","고객 통보는 필요할 수 있으나 법적·계약적 검토를 거쳐 조직 절차에 따라 이뤄져야 하며 가장 먼저 할 일이 아니다."]},{"id":"g-b029","domain":"business","edition":"both","approach":"agile","tags":["테일러링","규제준수"],"stem":"규제가 엄격한 증권사에서 처음 스크럼을 도입한 팀이 '문서는 낭비'라며 변경 승인 기록과 테스트 증적을 남기지 않고 있다. 컴플라이언스 부서는 감사 추적(Audit trail)이 없으면 운영 반영을 허용할 수 없다고 통보했다. 스크럼 마스터로서 가장 적절한 조치는?","options":["컴플라이언스 담당자와 협력해 필요한 감사 증적을 DoD에 포함하고 자동화로 부담을 줄인다.","애자일은 작동하는 소프트웨어를 중시하므로 문서 최소화가 필요하다고 컴플라이언스 부서를 설득한다.","규제가 엄격한 환경에는 애자일이 맞지 않으므로 이 팀을 예측형 방식으로 전환한다.","스프린트 속도를 유지하기 위해 운영 반영 직전에 필요한 문서를 한꺼번에 작성하도록 한다."],"answer":[0],"explanation":"애자일은 문서를 없애라는 것이 아니라 가치 있는 문서에 집중하라는 것이며, 규제 요구사항은 반드시 충족해야 하는 조건이다. 규정 준수를 완료 정의에 내재화하고 자동화하면 민첩성과 규정 준수를 함께 확보할 수 있다.","optionNotes":["정답. 규정 준수를 DoD에 내재화하고 자동화로 테일러링한다.","규제 요구사항은 협상 대상이 아니며, 애자일 원칙을 잘못 해석한 것이다.","적절한 테일러링으로 해결 가능한 문제를 방식 전체 전환으로 대응하는 것은 과도하다.","사후 일괄 작성은 실제 이력을 반영하지 못해 증적 신뢰성이 떨어지고 병목을 만든다."]},{"id":"g-b030","domain":"business","edition":"8th","approach":"hybrid","tags":["지속가능성","8판원칙"],"stem":"기업 데이터센터를 신규 시설로 이전하는 하이브리드 프로젝트를 기획하고 있다. 경영진은 PMBOK 8판의 '모든 프로젝트 영역에 지속가능성 통합(Integrate Sustainability Within All Project Areas)' 원칙을 프로젝트에 적용하라고 요청했다. 이 원칙에 부합하는 조치는? (2개를 고르시오)","options":["에너지 효율과 무관하게 최저가 호스팅 시설을 선정한다.","신규 시설의 전력 효율(PUE)과 탄소 배출량을 대안 평가 기준에 포함한다.","지속가능성 검토는 운영 단계 책임이므로 프로젝트 범위에서 제외한다.","폐기되는 서버의 재사용·재활용 및 전자폐기물 처리 계획을 수립한다.","일정 단축을 위해 지역사회·직원 등 영향을 받는 이해관계자의 참여를 생략한다."],"answer":[1,3],"explanation":"지속가능성 통합은 의사결정 기준과 인도물의 전체 생애주기에 환경·사회·경제적 영향을 반영하는 것이다. 에너지 효율을 평가 기준에 넣고 폐기 자산의 처리까지 계획하는 것이 대표적인 적용 사례이다.","optionNotes":["환경 영향을 고려하지 않은 최저가 선정은 원칙에 어긋난다.","정답. 에너지 효율과 탄소 배출을 의사결정 기준에 통합한다.","원칙은 '모든 프로젝트 영역'에 통합하라는 것이므로 운영으로 미루는 것은 맞지 않다.","정답. 폐기 자산의 재사용·재활용 계획은 생애주기 관점의 지속가능성 실천이다.","사회적 측면도 지속가능성의 일부이며 영향받는 이해관계자 참여 생략은 원칙에 반한다."],"diffNote":"'모든 프로젝트 영역에 지속가능성 통합'은 8판에서 새로 명시된 원칙이다. 7판에서는 스튜어드십 원칙 안에서 환경·사회적 책임을 간접적으로 다뤘다."},{"id":"g-b031","domain":"business","edition":"8th","approach":"predictive","tags":["AI거버넌스","정책"],"stem":"한 건설사가 전사 AI 거버넌스 정책을 수립했으며, 당신은 이를 바탕으로 대형 교량 프로젝트의 AI 활용 지침을 작성하고 있다. 팀은 AI를 일정 분석, 리스크 식별, 보고서 초안 작성에 활용할 계획이다. 지침에 포함하기에 가장 적절한 것은? (3개를 고르시오)","options":["AI가 생성한 일정·리스크 분석은 검토 없이 공식 기준선에 바로 반영한다.","AI 산출물을 근거로 한 의사결정의 최종 책임은 지정된 사람(역할)에게 있음을 명시한다.","AI 산출물의 편향과 오류 가능성을 사람이 검증하는 절차를 둔다.","생산성을 위해 기밀 설계 도면을 승인되지 않은 공개 AI 서비스에 입력하는 것을 허용한다.","이해관계자 보고서에 AI 활용 여부와 활용 범위를 투명하게 표시한다."],"answer":[1,2,4],"explanation":"조직 차원의 AI 거버넌스는 책임성(사람의 최종 책임), 공정성(편향·오류 검증), 투명성(활용 사실 공개), 보안(데이터 보호)을 핵심 요소로 한다. 프로젝트 지침은 이를 구체적인 작업 방식으로 옮겨야 한다.","optionNotes":["검토 없는 반영은 인간 감독과 책임성 원칙에 어긋나며 오류가 기준선에 들어갈 수 있다.","정답. AI 지원 의사결정에서도 책임은 사람에게 있어야 한다.","정답. 편향·오류 검증 절차는 AI 산출물 품질과 공정성 확보에 필수이다.","승인되지 않은 공개 AI에 기밀 정보를 입력하는 것은 보안·지식재산 위반 위험이 크다.","정답. AI 활용 사실의 공개는 투명성 확보의 핵심이다."],"diffNote":"8판은 AI 활용을 전반에 걸쳐 다루며 책임 있는 사용(책임성·투명성·편향 관리)을 강조한다. 7판에는 AI 거버넌스 지침이 사실상 없었다."},{"id":"g-b032","domain":"business","edition":"8th","approach":"agile","tags":["지속가능성","윤리"],"stem":"모바일 커머스 앱 팀의 스프린트 리뷰에서 마케팅 임원이 다음 릴리스 홍보 문구에 '탄소 중립 앱'이라는 표현을 넣자고 요청했다. 그러나 팀은 앱의 에너지 사용량이나 서버의 탄소 배출을 측정한 적이 없다. 제품 책임자로서 가장 적절한 대응은?","options":["홍보 문구는 마케팅 부서의 권한과 책임이므로 임원의 요청을 그대로 받아들인다.","'탄소 중립' 대신 '친환경 앱'으로 표현을 완화하면 문제가 줄어들므로 그렇게 사용한다.","근거 없는 주장은 그린워싱 위험이 있음을 설명하고 탄소 배출 측정 작업을 백로그에 추가한다.","제품 책임자의 역할 범위를 벗어나므로 논란을 피하기 위해 홍보 문구 검토에서 빠진다."],"answer":[2],"explanation":"검증되지 않은 환경 주장은 정직 의무에 어긋나고 규제·평판 리스크를 만든다. 실제 측정과 개선을 제품 작업으로 연결하면 지속가능성을 실질적 가치로 만들 수 있다.","optionNotes":["근거 없는 주장을 그대로 수용하는 것은 정직 의무 위반에 동참하는 것이다.","모호한 표현으로 바꿔도 근거 없는 환경 주장이라는 본질은 같다.","정답. 리스크를 설명하고 측정 가능한 지속가능성 작업으로 전환한다.","문제를 알면서 회피하는 것은 책임 있는 리더십이 아니다."],"diffNote":"8판은 지속가능성을 원칙으로 격상하고 '책임 있는 리더가 되라' 원칙을 통해 환경 관련 주장에도 정직성과 책임을 요구한다. 7판에는 지속가능성이 독립 원칙으로 존재하지 않았다."},{"id":"g-b033","domain":"business","edition":"8th","approach":"hybrid","tags":["거버넌스","OPA"],"stem":"두 회사가 합병하면서 당신이 관리하던 통합 물류 플랫폼 하이브리드 프로젝트에 서로 다른 프로젝트 방법론, 승인 절차, 템플릿을 가진 두 조직의 인력이 함께 일하게 되었다. 팀원들은 어떤 절차를 따라야 하는지 혼란스러워하고 있다. 가장 적절한 조치는?","options":["의사결정 속도를 위해 프로젝트 관리자에게 익숙한 기존 회사의 절차를 그대로 적용한다.","잘못된 절차로 인한 재작업을 막기 위해 통합 조직의 표준이 확정될 때까지 프로젝트를 중단한다.","익숙한 방식이 생산성이 높으므로 각 팀이 원래 소속 회사의 절차를 계속 사용하도록 한다.","두 조직의 OPA와 거버넌스 요구를 비교해 스폰서·PMO와 함께 적용할 절차를 테일러링·합의한다."],"answer":[3],"explanation":"조직 구조 변화로 OPA와 거버넌스가 충돌할 때는 양쪽을 분석해 프로젝트에 맞는 접근을 테일러링하고, 거버넌스 주체의 합의를 얻어 명확히 공유해야 한다. 이는 혼란을 줄이고 의사결정 권한을 명확히 한다.","optionNotes":["한쪽 절차를 일방적으로 강요하면 다른 조직 인력의 저항과 거버넌스 요구 누락이 생길 수 있다.","표준 확정을 기다리며 중단하면 가치 인도가 멈추고 비용이 증가한다.","서로 다른 절차를 병행하면 통합 프로젝트에서 혼란과 인터페이스 문제가 커진다.","정답. OPA와 거버넌스를 비교·테일러링해 합의된 절차를 적용한다."],"diffNote":"8판은 거버넌스를 독립 성과 영역으로 두고 조직 환경에 맞춘 프로세스 테일러링을 강조한다. 7판에는 거버넌스 성과 영역이 별도로 없었다."},{"id":"g-b034","domain":"business","edition":"both","approach":"predictive","tags":["포트폴리오","자원우선순위"],"stem":"당신의 고객 포털 개선 프로젝트와 다른 규제 대응 프로젝트가 같은 데이터베이스 전문가를 필요로 한다. 포트폴리오 검토 위원회가 규제 대응 프로젝트에 우선순위를 부여했고, 이로 인해 당신의 프로젝트는 해당 전문가를 6주간 활용할 수 없게 되었다. 가장 적절한 조치는?","options":["결정을 수용하고 영향을 분석해 작업 순서 조정, 외부 전문가 등 대안을 이해관계자와 협의한다.","공식 결정과 별도로 전문가의 기능 관리자에게 개인적으로 부탁해 주당 일부 시간을 확보한다.","고객 포털의 사업 가치도 크므로 스폰서에게 포트폴리오 결정을 번복해 달라고 요청한다.","일정을 지키기 위해 전문가 없이 계획대로 진행하고 데이터베이스 품질 문제는 나중에 수정한다."],"answer":[0],"explanation":"포트폴리오 우선순위는 조직 전략에 따라 자원을 배분하는 거버넌스 결정이므로 존중해야 한다. 프로젝트 관리자는 그 영향을 분석하고 대안을 마련해 공식 절차로 계획을 조정한다.","optionNotes":["정답. 결정을 수용하고 영향 분석과 대안으로 계획을 조정한다.","비공식 경로로 자원을 확보하는 것은 포트폴리오 거버넌스를 우회하는 것이다.","전략적 근거로 내린 결정의 번복을 요청하는 것은 조직 우선순위를 무시한다.","품질 리스크를 알면서 진행하는 것은 품질 내재화에 어긋나고 나중에 더 큰 비용이 든다."]},{"id":"g-b035","domain":"business","edition":"8th","approach":"hybrid","tags":["AI거버넌스","편향"],"stem":"보험 청구 문서 분류 자동화 하이브리드 프로젝트에서 외부 AI 서비스를 사용하고 있다. 공급업체가 사전 공지 없이 모델을 업데이트한 뒤, 외국인 고객이 제출한 문서의 오분류율이 3%에서 18%로 급증해 해당 고객들의 보상 처리가 지연되고 있다. 전체 정확도는 여전히 목표치 이상이다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["전체 정확도가 여전히 목표치 이상이므로 이 문제는 다음 정기 성과 검토 때 논의한다.","영향받는 문서를 사람 검토로 전환해 피해를 막고, AI 거버넌스 절차로 보고한 뒤 원인을 분석한다.","오분류 재발을 막기 위해 외국인 고객 문서를 자동화 대상에서 영구 제외하고 수작업으로 처리한다.","사전 공지 없는 모델 변경은 계약 위반에 해당하므로 공급업체와의 계약을 즉시 해지한다."],"answer":[1],"explanation":"특정 집단에 불리한 결과가 집중되는 것은 편향 문제로, 전체 평균 지표가 양호해도 즉시 대응해야 한다. 먼저 고객 피해를 억제하고 거버넌스 절차에 따라 보고한 뒤 근본 원인을 분석한다.","optionNotes":["평균 지표 뒤에 숨은 특정 집단의 피해를 방치하는 것은 공정성과 책임성 위반이다.","정답. 피해 억제, 보고, 원인 분석 순으로 책임 있게 대응한다.","원인 분석 없이 영구 제외하면 해당 고객에게 차별적 서비스가 될 수 있고 성급한 결정이다.","분석 없이 계약을 해지하는 것은 과도하며 계약상 절차도 거치지 않았다."],"diffNote":"8판은 AI를 전반에 반영하며 공정성·투명성·책임성을 포함한 책임 있는 AI 활용을 강조한다. 7판에는 AI 모델 감시나 편향 대응 지침이 없었다."},{"id":"g-b036","domain":"business","edition":"both","approach":"predictive","tags":["윤리","공정성"],"stem":"공급업체 입찰이 마감되어 평가가 진행 중인 상황에서, 스폰서가 프로젝트 관리자에게 '기존 거래 업체가 유리하도록 평가 기준의 가중치를 조정하라'고 지시했다. 평가 기준은 입찰 공고 때 모든 업체에 공개되었다. 가장 적절한 대응은?","options":["기준 변경은 공정성 위반임을 스폰서에게 설명하고 기존 기준을 유지하며, 압력이 계속되면 보고한다.","스폰서는 프로젝트 자금과 방향에 책임이 있으므로 지시에 따라 평가 가중치를 조정한다.","가중치는 공개된 대로 유지하되, 기존 업체의 실적을 고려해 정성 점수를 조금 더 준다.","스폰서와 충돌하지 않도록 아무 말 없이 지시를 무시하고 기존 기준대로 평가를 마친다."],"answer":[0],"explanation":"PMI 윤리 강령의 공정성 가치는 공개된 기준에 따라 투명하고 공정하게 의사결정할 것을 요구한다. 먼저 스폰서와 직접 소통해 문제를 설명하고, 해결되지 않으면 정해진 절차로 보고한다.","optionNotes":["정답. 공정성을 지키며 직접 소통하고, 필요 시 절차에 따라 보고한다.","마감 후 특정 업체에 유리하도록 기준을 바꾸는 것은 불공정 행위이다.","점수를 임의로 조정하는 것도 똑같이 불공정한 평가이다.","기준은 지켰지만 스폰서와 소통하지 않아 갈등과 오해를 남기며 문제 행동도 다뤄지지 않는다."]}]`),JSON.parse(`[{"id":"g-p001","domain":"people","edition":"both","approach":"predictive","tags":["팀개발","터크만"],"stem":"제조 설비 자동화 프로젝트 팀이 구성된 지 3주가 지났다. 기계 설계 담당과 제어 SW 담당 팀원들이 인터페이스 사양 작성이 누구의 책임인지를 두고 회의 때마다 언쟁을 벌이고 있으며, 일부는 상대 파트를 비난하기 시작했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["팀 내 합의가 어려우므로 기능 관리자에게 에스컬레이션해 담당자를 지정받는다","혼돈기는 자연스러운 단계이므로 팀이 규범기로 넘어갈 때까지 개입하지 않는다","관련 팀원들과 함께 RACI 차트를 검토·보완해 인터페이스 사양의 책임을 명확히 한다","갈등이 커지기 전에 언쟁을 주도한 팀원들에게 경고하고 담당자를 직접 지정한다"],"answer":[2],"explanation":"역할을 둘러싼 언쟁은 터크만 모델의 혼돈기(Storming)에서 흔히 나타나며, 이 사례의 근본 원인은 책임 불명확이다. 팀과 함께 RACI를 보완해 역할을 명확히 하면 갈등의 원인을 제거하고 팀이 규범기로 넘어가도록 돕는다.","optionNotes":["팀 내부에서 해결할 수 있는 문제를 먼저 에스컬레이션하는 것은 PM의 책임 회피다.","비난이 시작된 상황에서 방치하면 갈등이 고착되어 팀 성과가 떨어진다.","정답. 원인(역할 불명확)을 팀과 함께 해소하는 협력적 접근이다.","경고와 일방적 지정은 원인 분석 없이 강요하는 방식이라 수용도가 낮다."]},{"id":"g-p002","domain":"people","edition":"both","approach":"agile","tags":["서번트리더십","애자일지표"],"stem":"한 금융사의 스크럼 팀을 지원하는 스크럼 마스터에게 개발 부서장이 '다음 분기부터 개발자별 개인 속도(Velocity)를 집계해 성과 평가에 쓰겠다'고 통보했다. 팀원들은 이 소식에 불안해하고 있다. 스크럼 마스터의 가장 적절한 조치는?","options":["부서장과 면담해 속도를 개인 평가에 쓸 때의 부작용을 설명하고 대안 지표를 함께 찾는다","부서장의 공식 지시이므로 개인별 스토리 포인트를 집계해 제출하되 팀에는 알리지 않는다","평가 불이익을 막기 위해 팀원들에게 각자 개인 속도를 높이도록 독려하고 진척을 점검한다","애자일 원칙에 어긋나므로 공식 이의를 제기하고 결정이 나올 때까지 집계를 거부한다"],"answer":[0],"explanation":"서번트 리더는 조직이 애자일 지표를 오용하지 않도록 이해관계자를 교육하고 팀을 보호한다. 속도는 팀의 예측 도구일 뿐 개인 비교 지표가 아니므로, 부서장의 실제 정보 요구를 이해하고 적절한 대안을 함께 찾는 것이 바람직하다.","optionNotes":["정답. 이해관계자를 교육하고 근본 요구를 파악해 대안을 제시하는 서번트 리더십 행동이다.","팀 몰래 지표를 제출하는 것은 투명성을 해치고 지표 오용을 방치한다.","개인 속도 경쟁을 부추기면 협업이 무너지고 추정치가 부풀려진다.","대화 없이 거부하는 것은 대립적이며 부서장의 정당한 정보 요구를 무시한다."]},{"id":"g-p003","domain":"people","edition":"8th","approach":"predictive","tags":["책임있는리더","투명성"],"stem":"병원 전산 시스템 교체 프로젝트에서 프로젝트 관리자가 직접 산정한 데이터 이관 기간이 지나치게 낙관적이었던 것으로 드러나, 이관 작업이 계획보다 약 3주 지연될 전망이다. 스폰서는 아직 이 사실을 모른다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["스폰서의 불안을 줄이기 위해 초과 근무로 지연을 만회하고, 만회되면 별도로 보고하지 않는다","자신의 산정 오류를 인정하고 영향과 회복 대안을 분석해 스폰서에게 투명하게 보고한다","이관 담당 팀원들의 생산성 저하를 지연 원인으로 정리해 회복 계획과 함께 보고한다","지연 규모가 아직 불확실하므로 다음 정기 보고 때 확정된 수치와 함께 보고한다"],"answer":[1],"explanation":"책임 있는 리더는 자신의 결정과 그 결과에 대한 책임을 지고, 문제를 숨기지 않고 이해관계자에게 정직하게 알린다. 영향과 대안을 분석해 함께 보고하면 스폰서가 적시에 의사결정을 할 수 있다.","optionNotes":["보고 없이 초과 근무로 덮는 것은 투명성을 해치고 팀에 부담을 전가한다.","정답. 오류를 인정하고 분석된 대안과 함께 즉시 투명하게 보고한다.","자신의 오류를 팀에 전가하는 것은 정직성과 책임 원칙에 어긋난다.","알려진 중대한 지연을 늦게 보고하면 스폰서의 대응 시간을 빼앗는다."],"diffNote":"8판은 '책임 있는 리더가 되라(Be an Accountable Leader)'를 6원칙 중 하나로 직접 명시한다. 7판에서는 스튜어드십·리더십 행동 원칙 등에 나뉘어 있던 책임과 정직성을 리더의 핵심 원칙으로 끌어올렸다."},{"id":"g-p004","domain":"people","edition":"8th","approach":"hybrid","tags":["권한위임","의사결정권한"],"stem":"의료기기 개발 프로젝트는 규제 문서화는 예측형으로, SW 개발은 애자일로 운영하는 하이브리드 방식이다. SW 팀이 '기술 설계 결정마다 프로젝트 관리자의 승인을 받느라 2~3일씩 대기한다'며 불만을 제기했다. 가장 적절한 조치는?","options":["팀의 불만이 정당하므로 승인 절차를 즉시 폐지하고 모든 설계 결정을 팀에 맡긴다","대기 시간을 줄이기 위해 프로젝트 관리자가 매일 일정 시간을 승인 업무에 할애한다","결정 권한을 공식화하기 위해 모든 설계 결정을 변경 통제 위원회(CCB)에 올리도록 한다","규제 영향이 없는 결정은 팀이 자율 결정하도록 팀과 함께 의사결정 권한 범위를 정의한다"],"answer":[3],"explanation":"권한 위임 문화는 팀이 결정할 수 있는 범위를 명확히 정의해 주고, 그 안에서 자율적으로 결정하도록 하는 것이다. 규제 산업이므로 무제한 위임이 아니라 영향도에 따른 경계를 정하는 것이 가치와 통제를 함께 확보하는 방법이다.","optionNotes":["규제 영향이 있는 결정까지 통제 없이 위임하면 컴플라이언스 리스크가 생긴다.","병목 자체(모든 결정의 중앙 승인)를 그대로 두는 임시방편이다.","모든 설계 결정을 CCB로 보내면 대기가 오히려 늘어난다.","정답. 결정 경계를 팀과 함께 정의해 자율성과 통제를 균형 있게 확보한다."],"diffNote":"8판은 '권한 위임 문화 구축(Build an Empowered Culture)'을 6원칙 중 하나로 둔다. 7판에서는 '협업적인 프로젝트 팀 환경 조성' 원칙과 팀 성과 영역에서 다루던 내용이 권한 위임 중심으로 강조된다."},{"id":"g-p005","domain":"people","edition":"both","approach":"predictive","tags":["갈등관리","갈등해결기법"],"stem":"고객 시연을 하루 앞두고 두 팀원이 보고서 양식 문제로 언쟁을 벌였다. 프로젝트 관리자는 '두 사람 모두 시연 성공이라는 같은 목표를 가지고 있다'며 공통점을 강조하고, 의견 차이는 크지 않다며 분위기를 진정시켰다. 프로젝트 관리자가 사용한 갈등 해결 기법과 그 특성으로 가장 적절한 것은?","options":["완화/수용(Smoothing/Accommodating) — 관계를 유지하며 당면한 긴장을 낮추지만 근본 원인은 해결되지 않을 수 있다","협력/문제 해결(Collaborating/Problem solving) — 다양한 관점을 통합해 합의를 이끌어 영구적인 해결을 얻는다","타협/화해(Compromising/Reconciling) — 양측이 일부씩 양보해 모두가 부분적인 만족을 얻는 방식이다","강요/지시(Forcing/Directing) — 권한을 사용해 한쪽 입장을 관철함으로써 신속히 결론을 내는 방식이다"],"answer":[0],"explanation":"공통점을 강조하고 차이를 축소하는 것은 완화/수용 기법이다. 시간이 촉박할 때 관계 유지와 긴장 완화에 유용하지만 일시적 해결이므로, 시연 후 근본 문제를 다시 다루어야 한다.","optionNotes":["정답. 공통점 강조와 차이 축소는 완화/수용의 특징이며 일시적 해결이라는 한계가 있다.","양측 관점을 통합하는 논의가 없었으므로 협력/문제 해결이 아니다.","양측이 무언가를 양보하는 절충이 없었으므로 타협이 아니다.","PM이 권한으로 한쪽 입장을 관철하지 않았으므로 강요가 아니다."]},{"id":"g-p006","domain":"people","edition":"both","approach":"predictive","tags":["협상","자원확보"],"stem":"자동차 부품 시험 프로젝트의 프로젝트 관리자는 다음 달 4주간 사내 환경 시험실을 사용해야 한다. 그러나 시험실을 관리하는 품질 부서장은 같은 기간에 다른 제품의 인증 시험이 잡혀 있다며 난색을 표했다. 프로젝트 관리자의 가장 적절한 접근은?","options":["시험실 배정은 상위 결정 사항이므로 스폰서에게 요청해 우선 배정을 지시하게 한다","일정 지연을 막기 위해 사내 시험실 대신 외부 시험 기관과 즉시 계약을 체결한다","품질 부서장의 제약을 이해한 뒤 시험 순서 조정 등 양측 모두를 충족할 대안을 찾는다","프로젝트 일정이 더 시급하다는 근거 자료를 준비해 부서장을 설득하고 사용을 관철한다"],"answer":[2],"explanation":"원칙 기반 협상은 입장이 아니라 이해관계에 초점을 두고 상호 이익(Win-win) 대안을 찾는다. 상대의 제약을 먼저 이해하면 양측 목표를 모두 달성할 창의적 해결책이 나올 가능성이 높고 장기적 관계도 유지된다.","optionNotes":["협상 시도 없이 상급자 권한을 동원하는 것은 성급한 에스컬레이션이다.","내부 대안을 검토하지 않고 비용이 드는 외부 계약을 서두르는 것은 분석 없는 결정이다.","정답. 이해관계 기반 협상으로 상호 이익 대안을 찾는다.","자기 입장만 관철하려는 입장 중심 협상은 관계를 해치고 합의 가능성을 낮춘다."]},{"id":"g-p007","domain":"people","edition":"8th","approach":"agile","tags":["코칭","권한위임"],"stem":"애자일 팀의 주니어 개발자가 기술적 문제가 생길 때마다 팀 리더인 프로젝트 관리자에게 해결책을 묻는다. 프로젝트 관리자가 매번 답을 주다 보니 이 개발자의 의존도가 점점 높아지고 있다. 가장 적절한 대응은?","options":["당장의 진척이 중요하므로 계속 답을 주되, 답변 내용을 팀 위키에 정리해 두게 한다","코칭 질문으로 스스로 해결책을 찾게 하고, 필요하면 시니어 개발자와 페어링을 연결한다","의존도를 끊기 위해 앞으로는 질문하지 말고 스스로 해결하라고 분명하게 전달한다","기술 역량이 부족하다고 판단되므로 기능 관리자에게 별도 교육 프로그램 배정을 요청한다"],"answer":[1],"explanation":"코칭은 답을 주는 대신 질문을 통해 상대가 스스로 해결 능력을 키우도록 돕는 것이다. 페어링 같은 팀 내 학습 수단과 결합하면 개인 역량과 팀의 자율성을 함께 높일 수 있다.","optionNotes":["의존 구조를 그대로 유지하므로 근본적 역량 개발이 되지 않는다.","정답. 코칭 질문과 동료 학습으로 자립과 역량 성장을 돕는다.","지원 없이 질문을 막으면 심리적 안전감이 떨어지고 문제가 숨겨진다.","팀 안에서 해결 가능한 성장 과제를 외부로 넘기는 것은 이르다."],"diffNote":"8판의 '권한 위임 문화 구축' 원칙은 팀원이 스스로 판단하고 결정할 역량을 갖추도록 리더가 코칭·지원하는 것을 강조한다. 7판에서는 팀 성과 영역과 리더십 원칙에서 유사하게 다루었다."},{"id":"g-p008","domain":"people","edition":"both","approach":"predictive","tags":["감성지능","자기조절"],"stem":"프로젝트 관리자가 진행하는 변경 영향 검토 회의에서 한 부서장이 같은 질문을 반복하며 계획을 깎아내리자, 프로젝트 관리자는 자신이 점점 화가 나고 목소리가 높아지는 것을 느꼈다. 감성 지능(Emotional intelligence) 관점에서 가장 적절한 행동은?","options":["회의 진행을 지키기 위해 부서장의 태도가 회의를 방해하고 있다고 그 자리에서 지적한다","감정이 드러나 관계가 상하는 것을 막기 위해 회의를 즉시 종료하고 일정을 다시 잡는다","같은 질문이 반복되고 있으므로 부서장의 질문에는 대응하지 않고 다음 안건으로 넘어간다","자신의 감정을 인식해 잠시 호흡을 고른 뒤, 부서장의 우려를 바꾸어 말하기로 확인한다"],"answer":[3],"explanation":"감성 지능은 자기 인식, 자기 조절, 사회적 인식, 관계 관리로 구성된다. 자신의 감정을 먼저 인식·조절한 뒤 상대의 우려를 확인하는 것이 관계를 지키면서 회의 목적도 달성하는 방법이다.","optionNotes":["감정이 고조된 상태에서 공개적으로 지적하면 갈등이 커지고 관계가 손상된다.","회의를 갑자기 종료하는 것은 회피이며 회의 목적도 달성하지 못한다.","우려를 무시하면 부서장의 저항이 더 커질 수 있다.","정답. 자기 인식·자기 조절 후 공감적 경청으로 관계를 관리한다."]},{"id":"g-p009","domain":"people","edition":"both","approach":"hybrid","tags":["기본규칙","팀헌장"],"stem":"하이브리드 방식의 물류 시스템 프로젝트에서 팀은 착수 시 '발언 중인 사람의 말을 끊지 않는다'는 기본 규칙(Ground rules)에 합의했다. 그러나 경험 많은 시니어 아키텍트가 회의 때마다 다른 팀원의 말을 끊고 결론을 내려, 일부 팀원이 발언을 꺼리게 되었다. 가장 먼저 해야 할 일은?","options":["시니어 아키텍트와 개별 대화로 관찰한 행동과 팀에 미친 영향을 공유하고 규칙을 상기시킨다","모든 팀원이 규칙의 중요성을 알도록 다음 회의에서 위반 사례로 공개적으로 언급한다","반복되는 행동이므로 기능 관리자에게 알려 해당 아키텍트의 성과 평가에 반영하도록 한다","시니어 아키텍트의 전문성이 프로젝트에 중요하므로 팀과 상의해 기본 규칙을 완화한다"],"answer":[0],"explanation":"기본 규칙 위반은 우선 당사자와 비공개로 구체적 행동과 영향을 중심으로 다루는 것이 바람직하다. 팀이 함께 합의한 규칙을 근거로 하면 개인 비난이 아닌 약속 이행의 문제로 대화할 수 있다.","optionNotes":["정답. 비공개로 행동과 영향을 공유하고 합의된 규칙을 상기시킨다.","공개 지적은 당사자를 방어적으로 만들고 팀 분위기를 해친다.","직접 대화 없이 평가로 연결하는 것은 성급한 에스컬레이션이다.","규칙을 완화하면 다른 팀원의 참여가 더 위축되고 규칙의 의미가 사라진다."]},{"id":"g-p010","domain":"people","edition":"both","approach":"predictive","tags":["가상팀","시간대"],"stem":"서울, 베를린, 샌프란시스코에 팀원이 분산된 반도체 장비 SW 프로젝트에서 주간 조정 회의를 항상 서울 오후 시간에 열어 왔다. 최근 샌프란시스코 팀원들이 매번 심야에 참석해야 해 피로를 호소하고 참석률이 떨어지고 있다. 가장 적절한 조치는?","options":["샌프란시스코 팀원은 실시간 참석 대신 녹화본을 보고 이메일로 의견을 내도록 조정한다","조정 회의는 모든 팀원의 의무이므로 참석률이 떨어진 팀원들에게 참석 의무를 재공지한다","팀과 논의해 회의 시간을 순환 배정해 부담을 공평하게 나누고 비동기 협업으로 보완한다","시간대 문제를 없애기 위해 회의를 폐지하고 각 지역 리더가 주간 보고서를 제출하게 한다"],"answer":[2],"explanation":"분산 팀에서는 시간대 부담이 특정 그룹에 집중되지 않도록 공평하게 나누는 것이 포용성과 참여를 지킨다. 팀과 함께 방식을 정하고 비동기 협업을 보완하면 실시간 회의 의존도도 낮출 수 있다.","optionNotes":["한 지역만 수동적 참여자로 만들면 소외감과 정보 격차가 생긴다.","근본 원인(불공평한 시간 배정)을 무시하고 의무만 강조한다.","정답. 부담을 공평하게 나누고 비동기 협업으로 보완한다.","실시간 조정 기회를 없애 협업과 문제 해결이 약해진다."]},{"id":"g-p011","domain":"people","edition":"both","approach":"agile","tags":["다양성과포용","퍼실리테이션"],"stem":"다국적 애자일 팀의 반복 계획 회의에서 일부 팀원은 거의 발언하지 않는다. 이들은 개별 면담에서 '모국어가 아닌 언어로 빠르게 오가는 토론에 끼어들기 어렵다'고 말했다. 퍼실리테이터로서 가장 적절한 조치는?","options":["팀의 일원으로서 책임이 있으므로 다음 회의부터 반드시 한 번 이상 의견을 말하도록 요구한다","침묵 브레인스토밍과 라운드 로빈을 도입하고 안건을 미리 공유해 준비할 시간을 준다","회의 부담을 덜어 주기 위해 이 팀원들의 의견은 팀 리더가 따로 받아 회의에서 대신 전달한다","언어 부담을 줄이기 위해 모국어가 같은 팀원끼리 하위 그룹을 나누어 계획 회의를 진행한다"],"answer":[1],"explanation":"포용적 퍼실리테이션은 모든 구성원이 동등하게 기여할 수 있도록 회의 구조를 조정하는 것이다. 사전 안건 공유와 글로 쓰는 방식은 언어 부담을 낮추어 다양한 관점을 끌어낸다.","optionNotes":["발언 요구만으로는 장벽이 해소되지 않고 부담만 커진다.","정답. 구조를 바꿔 언어 장벽을 낮추고 모두의 참여를 보장한다.","대리 전달은 직접 참여를 막고 팀 내 분리를 고착시킨다.","팀을 언어로 나누면 단일 팀으로서의 공동 계획과 협업이 깨진다."]},{"id":"g-p012","domain":"people","edition":"both","approach":"predictive","tags":["동기부여","허즈버그"],"stem":"건설 프로젝트의 우수한 공정 엔지니어가 최근 급여 인상을 받았음에도 의욕이 떨어져 보인다. 면담에서 그는 '1년 넘게 같은 반복 업무만 하고 있고, 내 기여가 인정받는지 모르겠다'고 말했다. 허즈버그의 2요인 이론(Herzberg's two-factor theory) 관점에서 가장 효과적인 조치는?","options":["보상이 충분하지 않다고 느낄 수 있으므로 인사 부서에 추가 급여 인상을 요청한다","업무 만족도를 높이기 위해 현장 사무실 시설과 근무 환경을 개선하는 예산을 확보한다","장기적인 불안이 원인일 수 있으므로 고용 안정성을 보장한다는 확약을 제공한다","공정 개선 과제를 주도하는 등 더 도전적인 책임을 맡기고 기여를 공개적으로 인정한다"],"answer":[3],"explanation":"허즈버그 이론에서 급여·근무 환경·고용 안정은 위생 요인으로 불만을 줄일 뿐 동기를 높이지는 못한다. 성취감, 인정, 책임, 성장 같은 동기 요인이 실제 의욕을 높인다.","optionNotes":["급여는 위생 요인이며 이미 인상했음에도 의욕이 낮다.","근무 환경은 위생 요인으로 동기를 높이지 못한다.","고용 안정성도 위생 요인이며 언급된 불만과 관련이 없다.","정답. 책임 확대와 인정은 동기 요인으로 진짜 원인에 대응한다."]},{"id":"g-p013","domain":"people","edition":"both","approach":"hybrid","tags":["의사결정","합의도출"],"stem":"하이브리드 프로젝트 팀이 새 릴리스 계획에 대한 합의 수준을 확인하기 위해 주먹 다섯 손가락(Fist of five) 투표를 했다. 대부분 손가락 4~5개를 들었으나 두 명이 1개를 들었다. 퍼실리테이터가 해야 할 일은?","options":["1개를 든 팀원들에게 우려를 설명하도록 요청하고, 팀이 함께 논의한 뒤 다시 확인한다","대다수가 4~5개를 들어 충분한 지지를 확인했으므로 현재의 릴리스 계획을 확정한다","두 명의 의견은 소수이므로 회의록에 우려 사항으로 기록만 하고 계획대로 진행한다","의견이 갈렸으므로 시간을 아끼기 위해 프로젝트 관리자가 최종 결정을 내리고 공지한다"],"answer":[0],"explanation":"주먹 다섯 손가락 기법에서 손가락이 3개 미만인 구성원이 있으면 그 우려를 듣고 논의한 뒤 다시 투표한다. 소수 의견에 숨은 리스크나 정보를 확인하는 것이 이 기법의 목적이다.","optionNotes":["정답. 낮은 지지의 이유를 듣고 논의 후 재확인하는 것이 기법의 절차다.","강한 반대가 있는 상태에서 확정하면 실행 단계에서 몰입이 떨어진다.","기록만 하면 중요한 우려나 리스크를 놓칠 수 있다.","논의를 거치지 않은 일방적 결정은 팀 합의 기법의 취지와 맞지 않는다."]},{"id":"g-p014","domain":"people","edition":"both","approach":"predictive","tags":["이해관계자참여","참여평가매트릭스"],"stem":"통신망 구축 프로젝트의 이해관계자 참여 평가 매트릭스(Stakeholder engagement assessment matrix)에서 지자체 인허가 담당 과장의 현재(C) 참여 수준은 '저항(Resistant)', 목표(D) 수준은 '지지(Supportive)'로 표시되어 있다. 인허가 일정은 주 공정 경로에 있다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["인허가가 주 공정 경로에 있으므로 스폰서를 통해 지자체 상급자에게 협조 공문을 보낸다","인허가 지연 가능성에 대비해 이해관계자 활동 대신 일정에 충분한 버퍼를 추가한다","해당 과장과 면담해 저항의 원인과 우려를 파악하고, 이를 바탕으로 참여 전략을 세운다","목표가 비현실적일 수 있으므로 목표 수준을 '중립(Neutral)'으로 낮추어 현실화한다"],"answer":[2],"explanation":"현재 수준과 목표 수준의 차이를 좁히려면 먼저 저항의 원인을 이해해야 적절한 참여 전략을 세울 수 있다. 분석 후 행동하는 것이 PMI 관점의 기본 순서다.","optionNotes":["원인을 모른 채 상급자 압력을 동원하면 저항이 더 커질 수 있다.","버퍼는 리스크 대응의 일부일 뿐 참여 격차를 해소하지 못한다.","정답. 저항 원인을 파악해 참여 전략의 근거로 삼는다.","분석 없이 목표를 낮추는 것은 문제 해결이 아니라 회피다."]},{"id":"g-p015","domain":"people","edition":"both","approach":"predictive","tags":["의사소통계획","맞춤형보고"],"stem":"공공기관 시스템 구축 프로젝트의 한 실무 이해관계자가 '매주 받는 40쪽짜리 진행 보고서는 읽을 시간이 없고, 정작 우리 부서에 영향이 있는 일정 변경은 늦게 안다'고 불만을 제기했다. 가장 적절한 조치는?","options":["보고 부담을 줄이기 위해 모든 이해관계자의 보고서 분량을 일괄적으로 10쪽으로 줄인다","정보 요구사항을 확인하고 의사소통 관리 계획서를 갱신해 맞춤형 요약과 영향 알림을 제공한다","보고서는 조직 표준 양식이므로 변경할 수 없다고 설명하고 요약 페이지 활용을 안내한다","필요한 부분을 빠르게 찾아 읽을 수 있도록 기존 보고서에 상세 목차와 색인을 추가한다"],"answer":[1],"explanation":"효과적인 의사소통은 이해관계자별 정보 요구에 맞추어 내용·형식·시점을 조정하는 것이다. 요구사항을 확인한 뒤 의사소통 관리 계획서를 갱신해 체계적으로 반영해야 한다.","optionNotes":["다른 이해관계자의 요구를 확인하지 않은 일괄 변경은 새로운 문제를 만든다.","정답. 정보 요구를 확인하고 계획서에 반영해 맞춤형으로 전달한다.","이해관계자 요구를 무시하는 경직된 대응이다.","적시 영향 알림이라는 핵심 요구가 해결되지 않는다."]},{"id":"g-p016","domain":"people","edition":"8th","approach":"hybrid","tags":["AI도입","변화관리"],"stem":"하이브리드 방식의 보험 시스템 프로젝트에서 조직이 AI 코딩 어시스턴트 사용을 허용했다. 일부 시니어 개발자는 '코드 품질이 떨어지고 우리 역할이 줄어들 것'이라며 사용을 거부하고, 다른 팀원들은 생성된 코드를 검토 없이 그대로 커밋하고 있다. 가장 적절한 조치는?","options":["생산성 향상 효과를 확보하기 위해 팀원 전원에게 AI 어시스턴트 사용을 의무화한다","팀 내 갈등과 품질 리스크를 피하기 위해 AI 어시스턴트 사용을 전면 중단시킨다","도구 선택은 개인 역량의 영역이므로 각자 판단에 맡기고 결과 품질만 리뷰에서 확인한다","팀과 함께 파일럿과 교육을 진행하고, 사람의 코드 리뷰 의무 등 사용 지침을 합의한다"],"answer":[3],"explanation":"AI 도입은 기술 문제이자 변화 관리 문제이므로, 팀을 참여시켜 우려를 다루고 역량을 키우며 사람의 검토 책임을 명확히 하는 것이 중요하다. 이렇게 하면 저항과 무분별한 사용이라는 두 문제를 함께 해결할 수 있다.","optionNotes":["일방적 의무화는 저항을 키우고 품질 통제 문제도 해결하지 못한다.","가치를 줄 수 있는 도구를 분석 없이 포기하는 회피다.","검증 없는 커밋이라는 현재 리스크를 방치한다.","정답. 팀 참여, 교육, 사람의 감독 기준을 함께 갖춘 도입 방식이다."],"diffNote":"7판에는 AI 활용 지침이 제한적이었던 반면, 8판은 AI 활용을 표준 전반에 반영해 도구 도입, 팀 역량 강화, 사람의 감독을 PM의 관심사로 다룬다."},{"id":"g-p017","domain":"people","edition":"8th","approach":"agile","tags":["AI감독","책임"],"stem":"애자일 팀이 생성형 AI로 사용자 스토리의 인수 테스트 케이스를 자동 생성해 왔다. 최근 릴리스에서 AI가 누락한 예외 시나리오 때문에 운영 결함이 발생했고, 팀원들은 'AI가 만든 것이라 따로 확인하지 않았다'고 말했다. 가장 적절한 조치는?","options":["도구의 성능이 부족했던 것이므로 AI 테스트 생성 도구를 더 정확한 다른 제품으로 교체한다","결함의 원인이 도구에 있으므로 AI 도구 공급업체에 공식 통보하고 개선과 보상을 요구한다","회고에서 원인을 함께 분석하고, AI 산출물도 팀이 검토한다는 기준을 DoD에 반영한다","같은 결함이 재발하지 않도록 AI가 생성한 테스트를 모두 폐기하고 수동 작성으로 돌아간다"],"answer":[2],"explanation":"AI는 도구일 뿐 산출물에 대한 책임은 사람과 팀에 있다. 근본 원인(사람의 검토 부재)을 팀이 함께 분석하고 작업 기준에 반영하는 것이 재발을 막는 방법이다.","optionNotes":["원인이 도구가 아니라 검토 부재이므로 교체해도 같은 문제가 반복된다.","산출물 검증 책임은 팀에 있으므로 책임 전가에 불과하다.","정답. 근본 원인을 분석하고 사람의 검토 책임을 팀 기준에 반영한다.","AI가 주는 가치를 버리는 과잉 대응이며 원인 분석도 없다."],"diffNote":"8판은 AI 활용을 전반에 반영하면서 AI 산출물에 대한 사람의 감독과 책임을 강조한다. 7판에는 이러한 AI 관련 지침이 거의 없었다."},{"id":"g-p018","domain":"people","edition":"8th","approach":"predictive","tags":["AI편향","인력배치"],"stem":"대형 플랜트 프로젝트의 프로젝트 관리자가 AI 기반 인력 배치 도구로 다음 단계 작업 배정안을 받았다. 도구는 과거 생산성 데이터를 근거로, 육아 단축 근무 중인 숙련 엔지니어들을 핵심 작업에서 모두 제외하도록 추천했다. 가장 적절한 조치는?","options":["추천 데이터의 편향 가능성을 검토하고 실제 역량과 가용성을 확인해 사람이 최종 결정한다","과거 생산성 데이터에 근거한 객관적 추천이므로 도구가 제안한 배정안을 그대로 확정한다","공정성 논란을 피하기 위해 인력 배치에서 AI 도구 사용을 금지하도록 조직에 건의한다","투명성을 위해 제외된 엔지니어들에게 추천 결과를 통보하고 이의가 있으면 제기하게 한다"],"answer":[0],"explanation":"AI 추천은 과거 데이터의 편향을 그대로 재생산할 수 있으므로, 인력 관련 결정에는 사람의 검토와 최종 판단이 필요하다. 공정성과 실제 역량을 확인해 결정하는 것이 책임 있는 AI 활용이다.","optionNotes":["정답. AI 결과의 편향을 검토하고 사람이 책임지고 최종 결정한다.","편향 가능성이 있는 추천을 검증 없이 확정하면 차별과 역량 손실이 생긴다.","유용한 도구를 전면 금지하는 것은 과잉 대응이다.","검토 책임을 영향받는 사람에게 떠넘기는 방식이다."],"diffNote":"8판은 AI를 프로젝트 관리 전반에 활용하되 사람의 감독과 윤리적 판단을 유지할 것을 강조한다. 7판에는 AI 도구의 편향 관리에 대한 지침이 거의 없었다."},{"id":"g-p019","domain":"people","edition":"8th","approach":"agile","tags":["심리적안전감","비난없는문화"],"stem":"일일 스탠드업에서 한 개발자가 '어제 제가 설정을 잘못 바꿔 빌드 파이프라인이 반나절 멈췄습니다'라고 스스로 밝혔다. 참관하던 개발 부서장이 그 자리에서 '또 이런 실수가 나오면 책임을 묻겠다'고 강하게 질책했고, 이후 팀원들이 문제를 잘 보고하지 않는 분위기가 되었다. 스크럼 마스터의 가장 적절한 조치는?","options":["불필요한 질책을 피하도록 해당 개발자에게 앞으로 실수는 공개 석상에서 말하지 말라고 한다","부서장과 따로 대화해 질책이 은폐로 이어질 위험을 설명하고 비난 없는 방식에 협조를 구한다","팀의 심리적 안전감을 지키기 위해 부서장의 스탠드업 참관을 금지한다는 규칙을 공지한다","재발을 막기 위해 파이프라인 설정 변경 권한을 스크럼 마스터만 갖도록 통제를 강화한다"],"answer":[1],"explanation":"팀원이 실수를 투명하게 공유할 수 있는 심리적 안전감은 빠른 학습과 개선의 전제다. 부서장과의 비공개 대화로 영향을 설명하고 비난 없는 방식에 협조를 구하는 것이 근본적 해결이다.","optionNotes":["문제를 숨기도록 조언하면 투명성이 무너진다.","정답. 이해관계자를 교육하고 비난 없는 문화를 지킨다.","일방적 금지는 관계를 해치고 근본 인식을 바꾸지 못한다.","권한 집중은 팀의 자율성을 떨어뜨리며 심리적 안전 문제와 무관하다."],"diffNote":"8판의 '권한 위임 문화 구축' 원칙은 팀원이 두려움 없이 문제를 드러내고 결정에 참여할 수 있는 환경을 강조한다. 7판에서는 팀 성과 영역과 협업적 팀 환경 원칙에서 다루던 내용이다."},{"id":"g-p020","domain":"people","edition":"both","approach":"predictive","tags":["성과지원","면담"],"stem":"교량 설계 프로젝트에서 평소 성실하던 구조 엔지니어가 최근 2주간 산출물 마감을 연달아 놓치고 회의에서도 집중하지 못하는 모습을 보인다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["마감 누락이 반복되고 있으므로 기능 관리자에게 해당 엔지니어의 성과 문제를 보고한다","일정 영향을 막기 위해 해당 엔지니어의 작업 일부를 다른 팀원에게 우선 재배정한다","문제가 2주째 계속되므로 공식 경고와 함께 성과 개선 계획을 수립해 기대 수준을 명확히 한다","엔지니어와 비공개로 면담해 관찰한 변화를 공유하고 원인과 필요한 지원을 경청한다"],"answer":[3],"explanation":"갑작스러운 성과 저하에는 개인 사정, 업무 과부하, 갈등 등 다양한 원인이 있을 수 있으므로 먼저 원인을 이해해야 한다. 비공개 면담으로 경청하는 것이 적절한 지원과 조치의 출발점이다.","optionNotes":["원인 파악 없이 보고하는 것은 성급한 에스컬레이션이다.","원인을 모르는 상태에서의 재배정은 문제를 덮을 뿐이다.","평소 우수했던 팀원에게 원인 확인 없이 징계성 조치를 하는 것은 부적절하다.","정답. 먼저 비공개로 원인을 이해하고 지원 방안을 찾는다."]},{"id":"g-p021","domain":"people","edition":"both","approach":"predictive","tags":["문화간의사소통","협력사"],"stem":"해외 협력사 엔지니어들과 함께하는 플랜트 설계 프로젝트에서, 협력사 리드 엔지니어는 프로젝트 관리자가 일정을 물을 때마다 '문제없습니다'라고 답하지만 실제로는 납기를 반복해서 놓치고 있다. 그의 문화권에서는 상급자나 고객의 요청을 직접 거절하는 것이 무례로 여겨진다. 가장 적절한 조치는?","options":["남은 작업과 우려 요소를 묻는 열린 질문을 쓰고, 부담 없이 우려를 말할 1:1 채널을 만든다","약속 준수가 계약상 의무이므로 지체상금 조항을 상기시키며 납기 준수를 강하게 요구한다","보고의 신뢰성이 떨어지므로 협력사 경영진에게 리드 엔지니어를 교체해 달라고 요청한다","협력사 보고를 신뢰할 수 없으므로 협력사가 맡은 모든 작업에 50% 버퍼를 일괄 추가한다"],"answer":[0],"explanation":"고맥락 문화에서는 직접적인 '아니요'를 피하는 경향이 있으므로, 질문 방식과 소통 구조를 조정해 실제 상황이 드러나게 해야 한다. 문화적 차이를 이해하고 의사소통을 맞추는 것이 PM의 역할이다.","optionNotes":["정답. 문화 차이를 고려해 실제 상황을 드러내는 질문과 안전한 채널을 만든다.","압박을 높이면 우려를 더 숨기게 되어 문제가 악화된다.","원인이 소통 방식인데 사람을 교체하는 것은 과잉 대응이다.","근거 없는 일괄 버퍼는 소통 문제를 해결하지 못하고 일정만 부풀린다."]},{"id":"g-p022","domain":"people","edition":"both","approach":"hybrid","tags":["지식이전","오프보딩"],"stem":"하이브리드 방식의 데이터 플랫폼 프로젝트에서 레거시 시스템 구조를 아는 유일한 핵심 개발자가 4주 후 퇴사한다고 알려 왔다. 퇴사 후에도 3개월간 레거시 연계 작업이 남아 있다. 가장 적절한 조치는?","options":["핵심 인력 이탈을 막기 위해 스폰서에게 해당 개발자의 연봉 인상과 유지 보상을 요청한다","남은 4주 동안 해당 개발자가 레거시 연계 작업을 최대한 끝내도록 우선순위를 조정한다","후임자와의 페어 작업, 핵심 구조 문서화 등 지식 이전 계획을 세우고 리스크로 관리한다","지식 공백이 생기면 퇴사 후 외부 컨설팅 계약을 맺어 해당 개발자를 다시 활용하기로 한다"],"answer":[2],"explanation":"핵심 인력 이탈은 암묵지 손실 리스크이므로 체계적인 지식 이전(Knowledge transfer)이 우선이다. 페어 작업과 문서화를 계획에 반영하면 남은 작업을 팀이 이어받을 역량을 확보할 수 있다.","optionNotes":["개인의 퇴사 결정을 돈으로 되돌리려는 것은 불확실하며 PM의 권한 밖일 수 있다.","작업은 일부 끝내도 남은 3개월의 지식 공백이 해결되지 않는다.","정답. 지식 이전을 계획에 반영하고 리스크로 관리한다.","불확실한 사후 대안에 의존하며 팀 역량을 키우지 못한다."]},{"id":"g-p023","domain":"people","edition":"both","approach":"predictive","tags":["운영이관","교육훈련"],"stem":"물류창고 자동화 프로젝트가 종료 단계에 들어섰다. 운영 부서 직원들은 새 시스템의 장애 대응 방법을 잘 모른다며 인수에 불안해하고 있다. 프로젝트 관리자의 가장 적절한 조치는?","options":["운영 부서의 불안을 해소하기 위해 프로젝트 팀이 첫 6개월간 장애 대응을 맡겠다고 약속한다","운영 직원 대상 교육과 실습, 운영 매뉴얼 인계를 수행하고 인수 준비도를 확인한다","인수 지연을 막기 위해 스폰서를 통해 운영 부서의 공식 인수 서명을 먼저 받아 둔다","운영 매뉴얼과 사용자 매뉴얼을 공유 폴더에 게시하고 계획된 일정대로 프로젝트를 종료한다"],"answer":[1],"explanation":"가치가 실현되려면 결과물을 운영 조직이 실제로 사용·유지할 수 있어야 하므로, 교육과 지식 이전을 통해 인수 준비도를 확보해야 한다. 이는 원활한 운영 전환의 핵심 활동이다.","optionNotes":["승인되지 않은 지원 약속은 범위와 예산을 벗어나며 운영 역량도 키우지 못한다.","정답. 교육과 지식 이전으로 운영 인수 준비도를 확보한다.","준비되지 않은 상태로 서명을 강요하면 운영 실패와 편익 미실현 위험이 커진다.","문서 전달만으로는 실습과 역량 확인이 이루어지지 않는다."]},{"id":"g-p024","domain":"people","edition":"both","approach":"agile","tags":["상황적리더십","리더십스타일"],"stem":"애자일 경험이 전혀 없는 팀원들로 구성된 신규 팀이 첫 애자일 프로젝트를 시작했다. 팀원들은 스토리 분할이나 백로그 정제 방법을 모르고 무엇부터 해야 할지 혼란스러워한다. 상황적 리더십(Situational leadership) 관점에서 초기에 가장 적합한 접근은?","options":["위임(Delegating) — 자기 조직화 팀이므로 방법도 팀 스스로 찾도록 처음부터 맡긴다","거래적(Transactional) 리더십 — 목표 달성 시 보상, 미달 시 불이익을 명확히 한다","자유방임(Laissez-faire) — 실패를 통해 가장 잘 배우므로 리더는 개입하지 않고 지켜본다","지시·코칭(Directing/Coaching) — 프랙티스를 구체적으로 가르치고, 역량이 커지면 점차 위임한다"],"answer":[3],"explanation":"상황적 리더십은 구성원의 역량과 몰입 수준에 맞춰 리더십 스타일을 바꾼다. 역량이 낮은 초기에는 지시와 코칭으로 기반을 만들고, 성숙해짐에 따라 위임 쪽으로 이동하는 것이 자기 조직화 팀으로 가는 길이다.","optionNotes":["역량이 갖춰지지 않은 팀에 바로 위임하면 혼란과 실패가 커진다.","보상과 처벌만으로는 필요한 방법론 역량이 생기지 않는다.","지원 없는 방임은 학습이 아니라 혼란을 키운다.","정답. 현재 역량에 맞는 지시·코칭 후 점진적으로 위임한다."]},{"id":"g-p025","domain":"people","edition":"both","approach":"predictive","tags":["리더십스타일","안전"],"stem":"고층 건물 공사 현장에서 프로젝트 관리자가 크레인 작업 반경 아래로 작업자들이 안전 통제 없이 드나드는 것을 목격했다. 크레인은 몇 분 후 자재 인양을 시작할 예정이다. 이 상황에서 가장 적절한 리더십 행동은?","options":["즉시 작업 중지를 지시하고 출입을 통제한 뒤, 안전 조치가 확인되면 작업을 재개한다","작업자들이 스스로 위험을 인식하도록 질문을 던지는 코칭 방식으로 안전 의식을 높인다","안전 관리는 안전 관리자의 책임이므로 이메일로 상황을 알리고 조치를 요청한다","작업 흐름을 끊지 않도록 다음 날 안전 회의에서 출입 통제 문제를 안건으로 다룬다"],"answer":[0],"explanation":"생명과 안전이 걸린 긴급 상황에서는 지시적(Directive) 리더십이 적절하며 즉각 행동해야 한다. 상황에 따라 리더십 스타일을 조정하는 것이 효과적인 리더의 특징이다.","optionNotes":["정답. 임박한 안전 위험에는 즉각적인 지시와 통제가 필요하다.","코칭은 시간이 걸리므로 임박한 위험 상황에는 부적절하다.","이메일은 즉시성이 없어 사고를 막지 못할 수 있다.","다음 날로 미루는 것은 명백한 위험을 방치하는 것이다."]},{"id":"g-p026","domain":"people","edition":"8th","approach":"hybrid","tags":["RACI","책임있는리더"],"stem":"하이브리드 방식의 ERP 고도화 프로젝트에서 '데이터 이관 검증' 작업의 RACI 차트에 재무팀장과 IT 운영팀장이 모두 A(Accountable)로 표시되어 있다. 검증 결과를 승인할 때마다 두 사람이 서로 상대의 승인을 기다리느라 일정이 지연되고 있다. 가장 적절한 조치는?","options":["승인 지연을 막기 위해 두 팀장 모두에게 승인 기한을 정해 공식적으로 통보한다","일정 지연이 계속되고 있으므로 프로젝트 관리자가 대신 승인하고 사후에 공유한다","관련자와 협의해 A를 한 명으로 지정하고 다른 한 명은 C(Consulted)로 조정한다","두 부서 모두의 승인이 필요하므로 매번 합동 검토 회의를 소집해 공동으로 승인하게 한다"],"answer":[2],"explanation":"RACI에서 각 작업의 A는 한 명이어야 책임 소재가 명확해지고 의사결정이 지연되지 않는다. 관련자와 합의해 단일 책임자를 정하고 나머지는 협의 대상으로 두는 것이 근본 해결이다.","optionNotes":["기한을 정해도 누가 최종 책임자인지 불명확한 근본 문제는 남는다.","PM이 권한 없이 대신 승인하는 것은 거버넌스 위반이다.","정답. 단일 책임자를 정해 책임 소재를 명확히 한다.","공동 책임 구조를 유지해 회의 부담만 늘어난다."],"diffNote":"8판의 '책임 있는 리더가 되라' 원칙은 결정과 결과에 대한 책임 소재를 명확히 하는 것을 강조한다. 7판에서는 스튜어드십과 리더십 원칙에서 간접적으로 다루었다."},{"id":"g-p027","domain":"people","edition":"8th","approach":"predictive","tags":["정직성","상태보고"],"stem":"국방 통신 시스템 프로젝트에서 핵심 시험이 실패해 일정이 6주 지연될 가능성이 높다. 다음 주 고객 보고를 앞두고 스폰서가 '이번 보고서에는 일정 상태를 녹색으로 표시하고, 지연은 내부적으로 만회하자'고 요구했다. 가장 적절한 조치는?","options":["스폰서가 내린 결정이므로 녹색으로 보고하고 만회 계획은 내부적으로 조용히 실행한다","스폰서와 면담해 정확한 보고가 필요한 이유를 설명하고 원인·영향·회복 계획을 보고한다","스폰서와 고객 사이의 균형을 위해 상태를 노란색으로 절충해 표시하고 상세 내용은 생략한다","고객의 알 권리가 우선이므로 스폰서에게 알리지 않고 고객에게 실제 상황을 직접 알린다"],"answer":[1],"explanation":"PM은 정확하고 진실한 정보를 제공할 책임이 있으며, 이는 PMI 윤리 강령의 정직성 기준과 책임 있는 리더의 핵심이다. 먼저 스폰서와 직접 협의해 회복 계획과 함께 정확한 상태를 보고하는 것이 올바른 순서다.","optionNotes":["허위 보고는 윤리 위반이며 고객의 의사결정을 왜곡한다.","정답. 스폰서와 직접 협의해 정확한 상태와 회복 계획을 보고한다.","의도적으로 정보를 누락한 절충은 여전히 부정확한 보고다.","스폰서를 우회하는 것은 신뢰를 깨고 먼저 직접 해결하려는 노력을 건너뛴다."],"diffNote":"8판은 '책임 있는 리더가 되라'를 6원칙의 하나로 두어 투명성과 정직한 보고를 리더의 책무로 명시한다. 7판에서는 스튜어드십 원칙에서 정직성을 다루었다."},{"id":"g-p028","domain":"people","edition":"8th","approach":"agile","tags":["권한위임","팀실험"],"stem":"칸반 방식으로 운영하는 운영 지원 팀이 회고에서 '진행 중 작업(WIP) 한도를 5에서 3으로 줄여 2주간 실험해 보겠다'고 결정했다. 팀 리더인 프로젝트 관리자는 처리량이 줄어들까 우려된다. 가장 적절한 대응은?","options":["팀의 실험을 지지하고 처리량과 리드 타임을 함께 측정해 실험 후 팀이 결과를 평가하게 한다","처리량 감소 리스크가 확인되지 않았으므로 데이터가 쌓일 때까지 실험을 승인하지 않는다","팀의 의견과 리더의 우려를 절충하기 위해 WIP 한도를 4로 조정해 운영하도록 지시한다","실험에 대한 책임감을 높이기 위해 결과가 나쁘면 팀의 책임으로 기록하겠다고 미리 알린다"],"answer":[0],"explanation":"팀이 자신의 작업 방식을 개선하기 위해 짧고 되돌릴 수 있는 실험을 하는 것은 권한 위임과 지속적 개선의 핵심이다. 리더의 우려는 측정 지표로 표현해 팀이 데이터로 판단하도록 지원하는 것이 바람직하다.","optionNotes":["정답. 팀의 자율적 실험을 지지하고 우려를 측정 가능한 학습으로 바꾼다.","위험이 낮고 되돌릴 수 있는 실험을 막아 팀의 자율성을 훼손한다.","팀 결정을 일방적으로 바꾸는 지시로 권한 위임에 어긋난다.","실패를 처벌하겠다는 경고는 심리적 안전감과 실험 문화를 해친다."],"diffNote":"8판은 '권한 위임 문화 구축'을 원칙으로 두어 팀이 스스로 실험하고 결정하도록 지원할 것을 강조한다. 7판에서는 팀 성과 영역과 적응성 원칙에서 유사하게 다루었다."},{"id":"g-p029","domain":"people","edition":"both","approach":"predictive","tags":["가상팀","신뢰구축"],"stem":"4개국 팀원으로 새로 구성된 글로벌 가상 팀의 프로젝트 관리자가 팀 내 신뢰를 빠르게 형성하려 한다. 팀원들은 서로 만나 본 적이 없다. 가장 효과적인 조치 2개를 고르시오.","options":["모든 의사소통을 공식 이메일로 일원화해 기록을 남기도록 한다","화상 킥오프에서 팀원들이 각자의 배경, 전문성, 선호하는 업무 방식을 공유하는 시간을 갖는다","팀원별 접속 시간과 응답 속도를 모니터링하는 도구를 도입한다","초기에 작은 공동 과제를 맡겨 서로 약속을 지키는 경험을 쌓게 하고 성과를 팀 전체에 공유한다","문화 차이로 인한 오해를 피하기 위해 팀원 간 직접 소통을 줄이고 프로젝트 관리자를 통해 소통하게 한다"],"answer":[1,3],"explanation":"가상 팀의 신뢰는 서로를 알게 되는 관계 형성과, 약속을 지키는 경험이 반복되며 쌓인다. 킥오프에서의 상호 이해와 초기 작은 성공(Quick win)이 이 두 가지를 만든다.","optionNotes":["공식 이메일 일원화는 비공식 교류를 막아 관계 형성을 늦춘다.","정답. 서로의 배경과 업무 방식을 알게 해 관계 기반 신뢰를 만든다.","감시 도구는 불신의 신호가 되어 신뢰 형성을 방해한다.","정답. 공동 과제의 성공 경험이 역량 기반 신뢰를 쌓는다.","PM을 통한 간접 소통은 팀원 간 관계 형성을 가로막는다."]},{"id":"g-p030","domain":"people","edition":"8th","approach":"hybrid","tags":["생성형AI","AI거버넌스"],"stem":"하이브리드 방식의 고객 서비스 개선 프로젝트에서 팀이 생성형 AI로 요구사항 초안과 회의록을 작성하려 한다. 프로젝트 관리자가 취해야 할 조치 3개를 고르시오.","options":["조직의 AI 사용 정책과 데이터 분류 기준을 확인하고, AI에 입력할 수 있는 정보의 범위를 팀과 명확히 한다","AI 산출물은 정확도가 높으므로 검토 단계를 생략해 속도를 높인다","AI가 작성한 산출물은 담당자가 사실 여부를 검토·확인한 뒤 확정하도록 책임자를 정한다","AI 사용 여부는 개인 판단의 영역이므로 별도의 팀 지침을 두지 않는다","팀원들이 효과적인 프롬프트 작성과 결과 검증 방법을 익히도록 교육과 사례 공유를 지원한다"],"answer":[0,2,4],"explanation":"책임 있는 AI 활용에는 정책·데이터 보호 준수, 사람의 검토와 책임, 팀의 활용 역량 강화가 함께 필요하다. 이 세 가지를 갖추면 AI의 생산성 이점을 살리면서 리스크를 관리할 수 있다.","optionNotes":["정답. 정책과 데이터 보호 기준을 먼저 확인해 사용 범위를 정한다.","AI 산출물은 오류나 환각이 있을 수 있으므로 검토 생략은 위험하다.","정답. 사람의 검토 책임을 명확히 해 품질과 책임성을 확보한다.","지침 부재는 일관성 없는 사용과 정보 유출 리스크를 낳는다.","정답. 교육과 사례 공유로 팀의 AI 활용 역량을 높인다."],"diffNote":"8판은 AI 활용을 표준 전반에 반영해 정책 준수, 사람의 감독, 역량 강화를 PM의 역할로 다룬다. 7판에는 이러한 AI 활용 지침이 거의 없었다."},{"id":"g-p031","domain":"people","edition":"both","approach":"predictive","tags":["갈등관리","리더교육"],"stem":"프로젝트 관리자가 새로 임명된 하위 팀 리더들에게 갈등 관리 원칙을 교육하려 한다. 교육 내용으로 PMI 관점에 부합하는 것 2개를 고르시오.","options":["갈등은 팀 성과를 해치므로 아예 발생하지 않도록 원천 차단하는 것이 목표다","갈등은 공개 회의에서 다루어 팀 전체가 결론을 알게 하는 것이 우선이다","갈등은 초기에, 가능하면 당사자 간 비공개로, 사람이 아니라 이슈에 초점을 맞춰 다룬다","갈등이 생기면 우선 기능 관리자나 스폰서에게 에스컬레이션해 공식적으로 해결한다","시간과 신뢰가 확보된 상황에서는 협력/문제 해결 방식이 지속적인 해결을 가져올 가능성이 가장 높다"],"answer":[2,4],"explanation":"갈등은 피할 수 없고 잘 관리하면 더 나은 결과를 낳을 수 있다. 초기에 비공개로 이슈 중심으로 다루고, 여건이 되면 협력/문제 해결로 근본적 합의를 이끄는 것이 PMI의 권장 방식이다.","optionNotes":["갈등은 피할 수 없으며 건설적인 갈등은 혁신에 도움이 될 수 있다.","공개 처리는 당사자를 방어적으로 만들 수 있어 비공개 처리가 우선이다.","정답. 초기·비공개·이슈 중심 처리는 갈등 관리의 기본 원칙이다.","팀 수준에서 해결을 먼저 시도해야 하며 즉시 에스컬레이션은 부적절하다.","정답. 협력/문제 해결은 여건이 될 때 가장 지속적인 해결책을 만든다."]},{"id":"g-p032","domain":"people","edition":"both","approach":"agile","tags":["서번트리더십","장애물제거"],"stem":"새로 애자일 팀에 배치된 프로젝트 관리자가 서번트 리더십(Servant leadership)을 실천하려 한다. 서번트 리더의 행동으로 가장 적절한 것 2개를 고르시오.","options":["팀이 스스로 해결하기 어려운 조직 차원의 장애물을 찾아 제거한다","매일 각 팀원에게 작업을 배정하고 진척을 개별 점검한다","시간을 절약하기 위해 팀을 대신해 기술 설계 결정을 내린다","외부의 불필요한 간섭으로부터 팀을 보호해 업무에 집중할 수 있는 환경을 만든다","스프린트 목표 달성을 위해 팀원 간 실적 순위를 공개한다"],"answer":[0,3],"explanation":"서번트 리더는 팀을 통제하기보다 팀이 최고의 성과를 낼 수 있도록 장애물을 제거하고 집중할 환경을 보호한다. 작업 배정과 기술 결정은 자기 조직화 팀의 몫이다.","optionNotes":["정답. 장애물 제거는 서번트 리더의 대표적 역할이다.","작업 배정과 개별 점검은 지시·통제형 관리로 자기 조직화를 저해한다.","기술 결정을 대신 내리면 팀의 주인의식과 역량 성장을 막는다.","정답. 외부 간섭을 막아 팀의 집중을 보호하는 것은 서번트 리더의 역할이다.","개인 순위 공개는 경쟁을 부추겨 협업을 해친다."]},{"id":"g-p033","domain":"people","edition":"both","approach":"predictive","tags":["보상과인정","협업"],"stem":"통신사 네트워크 구축 프로젝트의 프로젝트 관리자가 분기마다 '최우수 팀원' 1명에게 포상을 해 왔다. 최근 팀원들이 정보를 서로 공유하지 않고 개인 실적 위주로 일하면서 협업이 눈에 띄게 줄었다. 가장 적절한 조치는?","options":["동기 부여 효과를 더 키우기 위해 최우수 팀원 포상 금액을 늘리고 수상 인원도 확대한다","부작용이 확인되었으므로 포상 제도를 즉시 폐지하고 혼란을 막기 위해 별도 설명은 생략한다","협업 저하는 개인 태도의 문제이므로 정보를 공유하지 않는 팀원들에게 공식 경고를 한다","팀과 논의해 협업과 팀 목표 달성을 인정하는 방향으로 보상·인정 체계를 재설계한다"],"answer":[3],"explanation":"한 사람만 이기는(Win-lose) 보상은 팀원 간 경쟁을 유발해 협업을 해칠 수 있다. 팀이 통제할 수 있는 협업 행동과 공동 성과를 인정하도록 보상 체계를 바꾸는 것이 근본 원인에 대응하는 방법이다.","optionNotes":["경쟁 구조를 더 강화해 문제를 악화시킨다.","설명 없는 폐지는 혼란과 불신을 낳고 대안도 없다.","행동의 원인인 보상 구조를 그대로 두고 증상만 처벌한다.","정답. 원인인 보상 구조를 팀 협업 중심으로 재설계한다."]},{"id":"g-p034","domain":"people","edition":"both","approach":"predictive","tags":["에스컬레이션","경청"],"stem":"한 팀원이 프로젝트 관리자와 상의 없이 스폰서에게 직접 '업무 배분이 불공정하다'는 메일을 보냈고, 스폰서가 이를 프로젝트 관리자에게 전달했다. 프로젝트 관리자가 가장 먼저 해야 할 일은?","options":["보고 체계를 지키는 것이 중요하므로 팀원에게 스폰서에게 직접 메일을 보낸 데 대해 경고한다","업무 배분이 공정했음을 보여 주는 근거 자료를 정리해 스폰서에게 먼저 회신한다","팀원과 비공개로 만나 업무 배분에 대한 우려를 경청하고 사실관계를 파악한다","스폰서까지 알게 된 사안이므로 논란을 피하기 위해 해당 팀원의 업무량을 즉시 줄인다"],"answer":[2],"explanation":"우회 보고의 형식보다 먼저 우려의 내용을 이해해야 한다. 비공개로 경청하고 사실을 파악한 뒤에 업무 배분 조정이나 의사소통 경로 재확인 등 후속 조치를 결정한다.","optionNotes":["절차 위반을 먼저 문제 삼으면 실제 우려가 묻히고 신뢰가 떨어진다.","팀원의 이야기를 듣기 전에 방어 자료를 내는 것은 분석 순서가 틀렸다.","정답. 먼저 경청하고 사실관계를 파악한다.","분석 없이 업무를 조정하면 다른 팀원에게 불공정이 생길 수 있다."]},{"id":"g-p035","domain":"people","edition":"both","approach":"hybrid","tags":["의사소통채널","계산"],"stem":"하이브리드 방식의 스마트팩토리 프로젝트 팀은 프로젝트 관리자를 포함해 8명이었는데, 통합 단계에 들어서며 4명이 추가로 합류했다. 의사소통 채널 수는 몇 개 증가하는가?","options":["4개 증가","38개 증가","66개 증가","28개 증가"],"answer":[1],"explanation":"의사소통 채널 수는 n(n-1)/2이다. 8명일 때 8×7/2=28개, 12명일 때 12×11/2=66개이므로 38개가 증가한다. 인원이 늘면 채널이 급격히 늘어나므로 의사소통 계획을 재검토해야 한다.","optionNotes":["추가 인원 수일 뿐 채널 증가량이 아니다.","정답. 66-28=38개 증가한다.","12명일 때의 전체 채널 수이며 증가량이 아니다.","8명일 때의 기존 채널 수다."]},{"id":"g-p036","domain":"people","edition":"both","approach":"predictive","tags":["이해관계자분석","권력관심격자"],"stem":"도시 재개발 프로젝트에서 시 재정국장은 프로젝트 예산 승인에 큰 영향력을 갖지만, 세부 진행 상황에는 관심이 적고 정기 회의 참석도 원하지 않는다. 권력/관심 격자(Power/interest grid)에 따른 가장 적절한 관리 전략은?","options":["만족 상태 유지(Keep satisfied) — 예산과 핵심 결정 관련 사항 위주로 간결하게 정보를 제공한다","밀접 관리(Manage closely) — 영향력이 크므로 모든 주간 회의에 초청하고 상세 보고서를 제공한다","정보 제공(Keep informed) — 정기 뉴스레터와 진행 현황 자료를 발송해 꾸준히 알린다","감시(Monitor) — 관심이 낮으므로 최소한의 노력으로 태도 변화만 주기적으로 관찰한다"],"answer":[0],"explanation":"권력이 높고 관심이 낮은 이해관계자는 만족 상태를 유지하는 전략이 적합하다. 원하지 않는 상세 정보로 부담을 주지 않으면서 중요한 사안은 놓치지 않게 해야 한다.","optionNotes":["정답. 고권력·저관심 이해관계자에 대한 표준 전략이다.","원하지 않는 상세 참여를 요구하면 오히려 불만을 살 수 있다.","저권력·고관심 이해관계자에 적합한 전략이다.","저권력·저관심 이해관계자 전략으로, 영향력이 큰 이해관계자를 방치하게 된다."]},{"id":"g-p037","domain":"people","edition":"both","approach":"agile","tags":
