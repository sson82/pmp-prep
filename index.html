["장애물제거","시스템적해결"],"stem":"스크럼 팀은 지난 세 번의 스프린트에서 매번 운영팀이 테스트 서버를 늦게 제공해 2~3일씩 작업이 막혔다. 팀원들은 '어차피 늦을 것'이라며 이를 당연하게 여기기 시작했다. 스크럼 마스터의 가장 적절한 조치는?","options":["현실을 반영하기 위해 스프린트 계획 시 서버 대기 기간을 감안해 약속 분량을 줄인다","팀의 자기 조직화를 존중해 팀원들이 운영팀에 직접 더 강하게 요청하도록 독려한다","운영팀 리더와 만나 지연 원인을 함께 파악하고 셀프서비스 환경 등 구조적 해결책을 협의한다","투명성을 위해 스프린트 리뷰에서 운영팀 지연으로 목표를 못 이뤘다고 이해관계자에게 보고한다"],"answer":[2],"explanation":"팀 외부의 반복적 장애물은 스크럼 마스터가 조직 차원에서 해결해야 할 대상이다. 원인을 함께 파악하고 구조적 해결책을 협의하면 재발을 막고 팀의 흐름을 회복할 수 있다.","optionNotes":["장애물을 받아들이고 생산성 손실을 고착시킨다.","조직 간 장애물 해결 책임을 팀원에게 떠넘긴다.","정답. 원인을 협력적으로 분석해 구조적으로 장애물을 제거한다.","비난은 협력 관계를 해치고 문제를 해결하지 못한다."]},{"id":"g-p038","domain":"people","edition":"both","approach":"agile","tags":["경력개발","페어링"],"stem":"애자일 팀의 백엔드 개발자가 1:1 면담에서 '클라우드 아키텍처 역량을 키우고 싶은데 지금 업무로는 기회가 없다'고 말했다. 다음 분기 백로그에는 클라우드 이전 관련 항목이 있다. 가장 적절한 조치는?","options":["현재 프로젝트 일정이 빠듯하므로 경력 개발은 프로젝트 종료 후에 논의하자고 미룬다","업무 공백이 생기지 않도록 외부 클라우드 교육 과정에 등록해 주고 현재 업무는 유지한다","성장 의지를 존중해 다음 분기 클라우드 이전 항목을 이 개발자에게 단독으로 배정한다","팀과 상의해 이 개발자가 경험 있는 팀원과 페어로 클라우드 이전 항목에 참여하게 한다"],"answer":[3],"explanation":"팀원의 성장 욕구를 프로젝트 필요와 연결하면 동기와 팀 역량을 함께 높일 수 있다. 애자일 팀에서는 작업 분담을 팀이 정하므로 팀과 상의하고, 페어링으로 학습과 품질 리스크를 함께 관리한다.","optionNotes":["성장 기회를 미루면 동기가 떨어지고 이직 위험이 커진다.","실무 적용 기회가 없는 교육은 효과가 제한적이다.","경험 없는 사람에게 단독 배정하면 품질 리스크가 크고 팀의 자기 조직화도 무시한다.","정답. 팀과 협의해 실무 학습 기회를 만들고 페어링으로 지원한다."]},{"id":"g-p039","domain":"people","edition":"both","approach":"hybrid","tags":["분산팀","포용성"],"stem":"본사 팀원 6명은 같은 사무실에서, 지방 공장 팀원 4명은 원격으로 참여하는 하이브리드 프로젝트에서, 원격 팀원들이 '중요한 결정이 사무실 복도 대화에서 이뤄지고 우리는 나중에야 안다'고 불만을 제기했다. 가장 적절한 조치는?","options":["결정 사항은 공용 채널에 기록·공유하고 회의는 원격 우선 방식으로 운영하도록 팀과 합의한다","대면 협업이 가장 효과적이므로 원격 팀원들도 주 3일은 본사로 출근하도록 요청한다","정보 격차를 없애기 위해 회의 밖 사무실 내 업무 관련 대화를 금지하는 규칙을 공지한다","원격 팀원들이 결정을 놓치지 않도록 매주 회의록과 결정 사항을 이메일로 정리해 보내 준다"],"answer":[0],"explanation":"혼합형 팀에서는 물리적 근접성 때문에 원격 구성원이 의사결정에서 소외되기 쉽다. 결정 기록의 투명성과 원격 우선 회의 방식을 팀 규칙으로 합의하면 모두가 동등하게 참여할 수 있다.","optionNotes":["정답. 투명한 기록과 동등한 참여 방식을 팀 합의로 정한다.","근무 형태 자체를 바꾸는 것은 비현실적이며 근본 원인을 해결하지 못한다.","자연스러운 대화를 금지하는 것은 비현실적이고 협업을 해친다.","주간 회의록은 지연된 정보 전달이며 결정 참여 문제를 해결하지 못한다."]},{"id":"g-p040","domain":"people","edition":"both","approach":"agile","tags":["지속가능한속도","번아웃"],"stem":"모바일 앱 스크럼 팀이 최근 다섯 스프린트 동안 약속한 스토리를 모두 완료했지만, 팀원 대부분이 매 스프린트 막바지에 야근과 주말 근무를 해 왔다. 한 팀원은 번아웃 증상을 호소했다. 스크럼 마스터의 가장 적절한 조치는?","options":["목표를 계속 달성하고 있으므로 현재 방식은 유지하고 번아웃을 호소한 팀원에게만 휴가를 권한다","팀의 추가 노력을 보상하기 위해 초과 근무 수당을 지급하도록 경영진에 건의한다","회고에서 이 문제를 다뤄 지속 가능한 역량에 맞게 약속 분량과 작업 방식을 팀이 조정하게 한다","업무량을 분산하기 위해 경영진에게 다음 스프린트부터 팀원 추가 투입을 즉시 요청한다"],"answer":[2],"explanation":"애자일은 무기한 유지할 수 있는 지속 가능한 속도(Sustainable pace)를 중시한다. 초과 근무로 달성한 속도는 실제 역량을 왜곡하므로 팀이 스스로 약속 수준과 작업 방식을 조정하도록 촉진해야 한다.","optionNotes":["증상만 개인적으로 처리하고 팀 전체의 구조적 문제를 방치한다.","보상으로 과로를 정당화할 뿐 지속 가능성 문제를 해결하지 못한다.","정답. 팀이 지속 가능한 속도에 맞게 계획과 작업 방식을 조정하도록 돕는다.","원인 분석 없이 자원을 추가하는 것은 성급하며 실제 역량 왜곡도 남는다."]},{"id":"g-p041","domain":"people","edition":"8th","approach":"predictive","tags":["권한위임","변경권한한도"],"stem":"대형 도로 공사 프로젝트에서 현장 감독들은 경미한 시공 방법 변경(비용 영향 500만 원 미만, 일정·안전 영향 없음)도 모두 프로젝트 관리자의 승인을 받아야 해 작업이 자주 멈춘다. 현장 감독들은 숙련도가 높다. 가장 적절한 조치는?","options":["모든 변경은 통합 변경 통제를 거쳐야 하므로 경미한 변경도 현행 승인 절차를 유지한다","현장 감독에게 위임할 결정 범위·한도·보고 방식을 정의해 승인받고 초과분만 변경 통제한다","현장 감독들의 숙련도가 높으므로 자유롭게 판단해 변경하게 하고 사후 보고도 생략한다","승인 대기 시간을 없애기 위해 프로젝트 관리자가 현장에 상주하며 즉시 승인하도록 한다"],"answer":[1],"explanation":"숙련된 인력에게 명확한 한도 내 결정 권한을 위임하면 흐름이 빨라지고 주인의식이 높아진다. 위임 범위와 보고 방식을 거버넌스 안에서 정의하면 통제와 추적성도 유지된다.","optionNotes":["변경 관리 계획은 권한 한도를 정할 수 있으며, 경미한 변경까지 중앙 승인하는 것은 비효율적이다.","정답. 명확한 경계 안에서 위임해 자율성과 통제를 함께 확보한다.","한도와 보고 없는 위임은 통제와 추적성을 잃는다.","PM에게 의존하는 병목 구조를 그대로 유지한다."],"diffNote":"8판은 '권한 위임 문화 구축' 원칙과 거버넌스 성과 영역을 통해, 명확한 결정 권한 경계 안에서 팀에 권한을 위임하도록 강조한다. 7판에는 거버넌스가 독립 성과 영역으로 없었다."},{"id":"g-p042","domain":"people","edition":"8th","approach":"hybrid","tags":["의사결정","타임박스"],"stem":"하이브리드 프로젝트 팀이 두 가지 데이터 시각화 라이브러리 중 하나를 고르기 위해 2주째 토론 중이지만 합의가 나지 않고 있다. 두 대안 모두 요구사항을 충족하며, 결정 지연이 일정에 영향을 주기 시작했다. 가장 적절한 조치는?","options":["일정 영향이 커지고 있으므로 프로젝트 관리자가 선호하는 라이브러리로 즉시 결정한다","팀의 자율성을 존중해 합의가 이뤄질 때까지 시간 제한 없이 토론을 계속하도록 한다","결정이 일정에 영향을 주기 시작했으므로 스폰서에게 상황을 보고하고 결정을 요청한다","평가 기준과 결정 시한을 정하고, 시한 내 합의가 없으면 팀 헌장의 결정 규칙을 따른다"],"answer":[3],"explanation":"팀에 권한을 위임하더라도 결정이 무기한 지연되지 않도록 기준, 시한, 대체 결정 규칙이 필요하다. 팀이 합의한 의사결정 규칙을 적용하면 자율성을 유지하면서 결정을 끝낼 수 있다.","optionNotes":["팀의 논의를 무시한 일방적 결정은 주인의식을 떨어뜨린다.","무기한 토론은 일정 지연을 계속 키운다.","팀 수준의 기술 결정을 스폰서에게 올리는 것은 부적절한 에스컬레이션이다.","정답. 기준·시한·합의된 결정 규칙으로 팀 자율성과 진척을 함께 확보한다."],"diffNote":"8판의 '권한 위임 문화 구축' 원칙은 팀에 결정권을 주되 명확한 의사결정 경계와 규칙을 함께 마련하도록 강조한다. 7판에서는 팀 성과 영역에서 공유 리더십으로 다루었다."},{"id":"g-p043","domain":"people","edition":"both","approach":"predictive","tags":["터크만","팀해산"],"stem":"2년간 진행된 공항 수하물 시스템 프로젝트가 종료를 앞두고 있다. 팀원들은 다음 배치가 정해지지 않아 불안해하고, 일부는 업무 집중도가 떨어지고 있다. 터크만(Tuckman) 모델의 해산기(Adjourning)에 해당하는 이 상황에서 가장 적절한 조치는?","options":["팀원 배치는 기능 관리자의 권한이므로 프로젝트가 끝날 때까지 배치 문제에 관여하지 않는다","종료 작업 품질을 지키기 위해 집중도가 떨어진 팀원들을 즉시 프로젝트에서 해제한다","기여를 인정하고 기능 관리자와 협력해 순차적 해제와 차기 배치를 지원하며 일정을 공유한다","팀원들이 불안해하는 기간을 줄이기 위해 남은 종료 일정을 최대한 앞당겨 조기 종료한다"],"answer":[2],"explanation":"해산기에는 팀원들이 상실감과 진로 불안을 느낄 수 있으므로, 기여를 인정하고 계획적인 해제와 전환을 지원해야 한다. 남은 작업을 명확히 하면 종료 품질도 유지된다.","optionNotes":["팀원의 불안을 방치하면 종료 단계의 생산성과 품질이 떨어진다.","계획 없는 해제는 남은 종료 작업에 공백을 만든다.","정답. 인정, 계획적 해제, 명확한 종료 일정으로 해산기를 관리한다.","필요한 종료 활동을 생략할 위험이 있다."]},{"id":"g-p044","domain":"people","edition":"8th","approach":"agile","tags":["AI역량강화","실천공동체"],"stem":"애자일 데이터 분석 팀에서 일부 팀원은 AI 분석 도구를 능숙하게 활용해 생산성이 크게 높아졌지만, 다른 팀원들은 사용법을 몰라 격차가 커지고 소외감을 느끼고 있다. 가장 적절한 조치는?","options":["팀 생산성을 높이기 위해 AI 활용에 능숙한 팀원들에게 분석 작업을 더 많이 배정한다","능숙한 팀원이 시연과 페어 작업으로 노하우를 나누는 실천 공동체(CoP) 운영을 지원한다","팀원 간 격차와 소외감을 없애기 위해 모두가 준비될 때까지 AI 도구 사용을 잠시 중단한다","팀 전체 생산성을 고려해 AI 도구에 익숙하지 않은 팀원을 다른 팀으로 재배치한다"],"answer":[1],"explanation":"AI 활용 역량 격차는 팀 내 지식 공유로 해소하는 것이 효과적이고 포용적이다. 동료 학습 구조를 지원하면 팀 전체의 역량과 결속이 함께 높아진다.","optionNotes":["격차와 소외감을 고착시키고 일부에게 업무가 몰린다.","정답. 동료 학습으로 팀 전체의 AI 활용 역량을 끌어올린다.","이미 얻은 가치를 포기하는 퇴행적 조치다.","역량 개발 기회를 주지 않고 사람을 내보내는 것은 부적절하다."],"diffNote":"8판은 AI 활용을 전반에 반영하며 팀의 AI 역량 강화(Upskilling)를 리더의 관심사로 다룬다. 7판에는 AI 역량 개발에 대한 지침이 거의 없었다."},{"id":"g-p045","domain":"people","edition":"both","approach":"predictive","tags":["성과평가","매트릭스조직"],"stem":"매트릭스 조직에서 프로젝트에 파견된 품질 엔지니어의 연간 성과 평가는 기능 관리자가 담당한다. 이 엔지니어는 프로젝트에서 뛰어난 성과를 냈다. 프로젝트 관리자가 할 가장 적절한 일은?","options":["엔지니어의 프로젝트 기여에 대한 구체적 피드백을 기능 관리자에게 제공해 평가에 반영되게 한다","성과 평가는 기능 관리자의 고유 권한이므로 요청이 없는 한 평가 과정에 관여하지 않는다","뛰어난 성과를 즉시 보상하기 위해 프로젝트 예산으로 엔지니어에게 성과급을 직접 지급한다","프로젝트 성과를 가장 잘 아는 사람이므로 직접 평가하도록 인사 부서에 권한 변경을 요청한다"],"answer":[0],"explanation":"매트릭스 조직에서 PM은 공식 평가 권한이 없더라도 프로젝트 성과에 대한 정보를 기능 관리자에게 제공해야 한다. 이는 공정한 평가와 팀원 동기 부여에 기여한다.","optionNotes":["정답. 평가 권한자에게 구체적 성과 정보를 제공한다.","기여가 평가에 반영되지 않아 동기와 공정성이 떨어진다.","조직 보상 정책과 예산 승인 범위를 벗어난 조치다.","조직 구조상 정해진 권한을 바꾸려는 것은 부적절하다."]},{"id":"g-p046","domain":"people","edition":"8th","approach":"hybrid","tags":["AI회의기록","동의"],"stem":"하이브리드 방식의 글로벌 제품 출시 프로젝트에서 프로젝트 관리자가 AI 회의 기록 도구로 모든 화상 회의를 녹음하고 자동 요약하려 한다. 참석자에는 여러 국가의 협력사 직원과 고객 대표가 포함된다. 도구를 사용하기 전에 가장 먼저 해야 할 일은?","options":["요약 품질과 기록 일관성을 높이기 위해 모든 회의를 기본으로 녹음하도록 도구를 설정한다","참석자에게는 요약본만 공유하면 되므로 회의 녹음과 AI 처리 사실은 따로 알리지 않는다","외부 참석자가 불편해할 수 있으므로 우선 내부 회의에서만 알리지 않고 시험 사용해 본다","정책과 관련 법규를 확인하고, 참석자에게 녹음·AI 처리 목적을 알려 동의를 받는 절차를 만든다"],"answer":[3],"explanation":"녹음과 AI 처리는 국가별 개인정보 법규와 조직 정책의 적용을 받으므로 사전 확인과 참석자 동의가 필수다. 투명하게 고지하는 것은 이해관계자 신뢰를 지키는 길이기도 하다.","optionNotes":["법규와 동의 확인 없이 기본 녹음을 설정하면 규정 위반 위험이 있다.","고지 없는 녹음은 신뢰와 법규를 모두 위반할 수 있다.","내부 회의라도 동의 없는 녹음은 부적절하다.","정답. 정책·법규 확인과 사전 동의로 책임 있게 AI를 활용한다."],"diffNote":"8판은 AI 활용을 반영하면서 데이터 보호, 투명성, 윤리적 사용을 함께 강조한다. 7판에는 AI 도구 사용 시의 동의·데이터 관리 지침이 거의 없었다."},{"id":"g-p047","domain":"people","edition":"both","approach":"predictive","tags":["조직문화","팀통합"],"stem":"합병한 두 회사의 엔지니어들로 구성된 통합 시스템 구축 프로젝트에서, A사 출신은 상세 문서와 공식 승인을 중시하고 B사 출신은 빠른 구두 합의를 선호한다. 양측이 '상대가 일을 비효율적으로 한다'며 불신이 쌓이고 있다. 가장 적절한 조치는?","options":["통합 조직의 일관성을 위해 문서화가 잘된 A사 방식을 표준으로 정해 모든 팀원에게 적용한다","양측이 각 방식의 장단점을 논의하는 워크숍을 열어 공통 작업 방식을 합의해 팀 헌장에 담는다","갈등을 줄이기 위해 출신 회사별로 하위 팀을 나누어 각자 익숙한 방식대로 일하게 한다","조직문화 차이는 전사적 과제이므로 인사 부서에 통합 교육을 요청하고 결과를 기다린다"],"answer":[1],"explanation":"서로 다른 조직 문화를 가진 팀은 공통의 작업 방식을 함께 만들 때 신뢰와 몰입이 생긴다. 양측의 관점을 존중하는 협력적 접근으로 합의한 규칙은 팀 헌장에 담아 지속적으로 적용한다.","optionNotes":["한쪽 방식을 일방적으로 강요하면 다른 쪽의 저항과 소외를 낳는다.","정답. 협력적으로 공통 작업 방식을 만들어 팀 헌장에 반영한다.","팀을 분리하면 통합 프로젝트의 협업과 인터페이스 문제가 커진다.","PM이 직접 해야 할 팀 개발 책임을 외부에 미루고 기다리는 것은 수동적이다."]}]`),JSON.parse(`[{"id":"g-r001","domain":"process","edition":"8th","approach":"predictive","tags":["프로젝트헌장","착수","AI활용"],"stem":"제조 기업의 스마트 공장 프로젝트 PM으로 내정되었다. 스폰서는 생성형 AI로 작성한 프로젝트 헌장(Project charter) 초안을 보내며 '형식만 갖추면 되니 바로 일정 계획을 시작하라'고 한다. 초안을 보니 측정 가능한 성공 기준과 PM의 권한 범위가 비어 있고, 일부 고수준 요구사항은 다른 사업부의 내용으로 보인다. PM이 가장 먼저 해야 할 일은?","options":["AI 초안을 그대로 승인된 헌장으로 간주하고 WBS 작성을 시작한다.","헌장 없이도 기획은 가능하므로 핵심 팀원을 모아 일정 계획 워크숍을 연다.","스폰서와 함께 초안의 정확성을 검토해 성공 기준·PM 권한·고수준 요구사항을 보완하고, 스폰서의 공식 승인을 받는다.","AI 산출물은 신뢰할 수 없으므로 초안을 폐기하고 PM이 단독으로 헌장을 새로 작성해 배포한다."],"answer":[2],"explanation":"프로젝트 헌장은 프로젝트를 공식 승인하고 PM에게 자원 사용 권한을 부여하므로, 기획에 앞서 내용이 정확해야 하고 스폰서가 승인해야 한다. AI 산출물은 유용한 출발점이지만 사람이 검증하고 책임져야 한다.","optionNotes":["검증되지 않은 초안을 승인본으로 간주하면 잘못된 요구사항과 불명확한 권한으로 기획이 시작된다.","공식 승인과 권한 부여 없이 기획을 진행하는 것은 착수 절차를 건너뛰는 것이다.","정답. 초안을 검증·보완하고 스폰서의 공식 승인을 받는 것이 우선이다.","헌장은 스폰서가 발행·승인하는 문서이며, 유용한 초안을 일방적으로 폐기할 이유도 없다."],"diffNote":"8판은 AI 활용을 전반에 반영하면서 AI 산출물에 대한 사람의 검증과 책임을 강조한다. 7판에는 AI 활용 지침이 거의 없었다."},{"id":"g-r002","domain":"process","edition":"both","approach":"predictive","tags":["EVM","TCPI"],"stem":"예산(BAC) $500,000인 사옥 리모델링 프로젝트의 현재 획득가치(EV)는 $200,000, 실제원가(AC)는 $250,000이다. 스폰서는 추가 예산 없이 원래 BAC 안에서 끝내야 한다고 강조한다. 남은 작업에 요구되는 완료성과지수(TCPI)와 그 의미로 가장 적절한 것은?","options":["0.83 — 현재보다 낮은 원가 효율로도 BAC 내 완료가 가능하다.","1.20 — 남은 작업을 현재 성과(CPI 0.8)보다 훨씬 높은 효율로 수행해야 한다.","1.67 — 남은 작업 1달러당 1.67달러의 가치를 만들어야 한다.","0.80 — 현재 원가 효율을 유지하면 BAC 내 완료가 가능하다."],"answer":[1],"explanation":"TCPI = (BAC − EV) / (BAC − AC) = (500,000 − 200,000) / (500,000 − 250,000) = 300,000 / 250,000 = 1.20이다. 현재 CPI가 200,000/250,000 = 0.8이므로 BAC를 지키려면 원가 효율을 크게 높여야 하며, 그 현실성을 스폰서와 검토해야 한다.","optionNotes":["0.83은 (BAC − AC)/(BAC − EV)로 분자와 분모를 뒤집은 값이다.","정답. 공식대로 계산하면 1.20이며 현재 CPI 0.8보다 높은 효율이 필요하다.","1.67은 BAC/(BAC − EV)로 계산한 값으로 TCPI 공식이 아니다.","0.80은 현재 CPI(EV/AC)이며, 이 효율로는 BAC 내 완료가 불가능하다."]},{"id":"g-r003","domain":"process","edition":"both","approach":"predictive","tags":["EMV","정량적리스크분석"],"stem":"해외 플랜트 건설 프로젝트의 리스크 관리대장에 다음 항목이 있다. 위협 A: 확률 30%, 영향 −$40,000 / 기회 B: 확률 20%, 영향 +$25,000 / 위협 C: 확률 10%, 영향 −$60,000. 세 항목을 합한 기대 금전 가치(EMV)는?","options":["−$13,000","−$23,000","+$13,000","−$18,000"],"answer":[0],"explanation":"EMV = Σ(확률 × 영향) = (0.3 × −40,000) + (0.2 × +25,000) + (0.1 × −60,000) = −12,000 + 5,000 − 6,000 = −13,000달러이다. 위협은 음수, 기회는 양수로 반영해 서로 상쇄한다.","optionNotes":["정답. 위협과 기회의 부호를 올바르게 반영한 합계이다.","기회 B를 위협처럼 음수로 처리한 값(−12,000 − 5,000 − 6,000)이다.","부호를 반대로 해석했다. 순 위협이 더 크므로 결과는 음수다.","기회 B를 빠뜨리고 위협만 합산한 값이다."]},{"id":"g-r004","domain":"process","edition":"both","approach":"predictive","tags":["EVM","VAC"],"stem":"데이터센터 이전 프로젝트(BAC $600,000)의 EV는 $250,000, AC는 $300,000이다. 원가 초과의 원인은 1회성 장비 운송 사고로 확인되었고, 원인이 제거되어 남은 작업은 원래 계획된 단가로 수행될 것으로 판단된다. 완료 시점 차이(VAC)는?","options":["−$120,000","+$50,000","−$350,000","−$50,000"],"answer":[3],"explanation":"차이가 비전형적(atypical)이면 EAC = AC + (BAC − EV) = 300,000 + 350,000 = 650,000달러이다. 따라서 VAC = BAC − EAC = 600,000 − 650,000 = −50,000달러이다.","optionNotes":["CPI(약 0.833)를 적용해 EAC = BAC/CPI = 720,000으로 본 전형적 차이 공식으로, 이 상황에 맞지 않는다.","부호가 반대다. EAC가 BAC를 초과하므로 VAC는 음수다.","350,000은 남은 작업의 가치(BAC − EV)이며 VAC가 아니다.","정답. 비전형적 차이 공식에 따른 결과이다."]},{"id":"g-r005","domain":"process","edition":"both","approach":"predictive","tags":["크래싱","일정단축","주경로"],"stem":"경로 A–B–D(A 5일, B 7일, D 4일)가 주경로이고, 병행 경로 A–C–D(C 4일)가 있다. 계약 완료일을 맞추려면 프로젝트를 2일 단축해야 한다. 활동별 일일 크래싱(Crashing) 비용과 최대 단축 가능 일수는 A $2,000(2일), B $1,500(2일), C $800(2일), D $2,500(1일)이다. 가장 적절한 방안과 추가 비용은?","options":["C를 2일 단축, $1,600","B를 2일 단축, $3,000","A를 2일 단축, $4,000","B와 D를 각각 1일 단축, $4,000"],"answer":[1],"explanation":"크래싱은 주경로(A–B–D, 16일) 활동 중 일일 비용이 가장 낮은 것부터 단축한다. B를 2일 줄이면 주경로는 14일이 되고 병행 경로(13일)는 여전히 짧으므로, 추가 비용 $3,000(2 × 1,500)으로 목표를 달성한다.","optionNotes":["C는 주경로에 있지 않아(여유 3일) 단축해도 프로젝트 기간이 줄지 않는다.","정답. 주경로상 최저 비용 활동이며 2일 모두 단축 가능하다.","같은 효과를 내지만 B보다 $1,000 더 비싸다.","2일 단축은 되지만 비용이 $1,500 + $2,500 = $4,000으로 B 단독보다 비싸다."]},{"id":"g-r006","domain":"process","edition":"both","approach":"predictive","tags":["PERT","추정"],"stem":"신규 ERP 인터페이스 개발 활동에 대해 전문가들이 낙관 6일, 최빈 9일, 비관 18일로 추정했다. 베타 분포 기반 3점 추정(PERT)을 적용할 때 기대 기간과 표준편차는?","options":["10일, 2일","11일, 2일","9일, 2일","10일, 3일"],"answer":[0],"explanation":"기대값 = (O + 4M + P) / 6 = (6 + 36 + 18) / 6 = 60 / 6 = 10일이고, 표준편차 = (P − O) / 6 = (18 − 6) / 6 = 2일이다. 비관치가 크게 치우쳐 있어 기대값이 최빈값보다 길어진다.","optionNotes":["정답. 베타 분포 공식에 따른 결과이다.","11일은 삼각 분포 단순 평균 (6 + 9 + 18) / 3이다.","9일은 최빈값으로, 비관치의 비대칭성을 반영하지 못한다.","기대값은 맞지만 표준편차를 잘못 계산했다. (18 − 6) / 6 = 2일이다."]},{"id":"g-r007","domain":"process","edition":"both","approach":"predictive","tags":["EVM","원가차이","일정차이"],"stem":"8개월 동안 매월 균등하게 진행하도록 계획된 교육 시스템 구축 프로젝트(BAC $400,000)의 4개월 차 말 현황이다. 실제 완료율은 40%이며 지금까지 $180,000를 지출했다. 원가차이(CV)와 일정차이(SV)는?","options":["CV −$40,000, SV −$20,000","CV +$20,000, SV +$40,000","CV −$20,000, SV −$40,000","CV −$20,000, SV −$20,000"],"answer":[2],"explanation":"PV = 400,000 × 50% = 200,000, EV = 400,000 × 40% = 160,000, AC = 180,000이다. CV = EV − AC = −20,000, SV = EV − PV = −40,000으로 예산 초과이면서 일정도 지연된 상태다.","optionNotes":["CV와 SV 값을 뒤바꿨다.","공식을 반대로(AC − EV, PV − EV) 적용해 부호가 틀렸다.","정답.","SV를 AC − PV로 잘못 계산한 값이다."]},{"id":"g-r008","domain":"process","edition":"both","approach":"hybrid","tags":["EVM","ETC"],"stem":"하드웨어 제작은 예측형, 펌웨어는 반복형으로 진행하는 하이브리드 프로젝트에서 PMO가 통합 EVM 보고를 요구한다. 현재 BAC $1,000,000, PV $500,000, EV $400,000, AC $500,000이며, 계약상 고정된 납기 때문에 남은 작업에는 원가와 일정 성과가 모두 영향을 줄 것으로 판단된다. 잔여분 산정치(ETC)는?","options":["$600,000","$750,000","$1,437,500","$937,500"],"answer":[3],"explanation":"CPI = 400,000 / 500,000 = 0.8, SPI = 400,000 / 500,000 = 0.8이다. 원가·일정 성과를 함께 고려하면 ETC = (BAC − EV) / (CPI × SPI) = 600,000 / 0.64 = 937,500달러이며, 이때 EAC = AC + ETC = 1,437,500달러가 된다.","optionNotes":["남은 작업을 계획 단가로 수행한다고 가정한 값(BAC − EV)이다.","CPI만 반영한 ETC(600,000 / 0.8)로, 일정 성과의 영향을 빠뜨렸다.","EAC(AC + ETC)이며 ETC가 아니다.","정답. CPI와 SPI를 모두 반영한 잔여분 산정치이다."]},{"id":"g-r009","domain":"process","edition":"both","approach":"predictive","tags":["조달","계약유형","CPIF"],"stem":"구매자가 원가 정산 성과급(CPIF) 계약으로 시험 장비 개발을 발주했다. 목표 원가 $200,000, 목표 수수료 $20,000, 원가 분담 비율은 구매자 80 : 판매자 20이다. 판매자가 실제 원가 $180,000로 작업을 완료했다면 구매자가 지급할 총액은?","options":["$204,000","$200,000","$196,000","$220,000"],"answer":[0],"explanation":"원가 절감액 $20,000 중 판매자 몫 20%($4,000)가 수수료에 더해져 수수료는 $24,000가 된다. 원가 정산형이므로 실제 원가 $180,000 + 수수료 $24,000 = $204,000를 지급한다.","optionNotes":["정답. 절감액 분담을 반영한 총액이다.","실제 원가에 목표 수수료만 더해 성과 인센티브를 누락했다.","절감 몫을 수수료에서 차감해 인센티브 방향을 반대로 적용했다.","목표 원가와 목표 수수료의 합으로, 실제 원가를 무시했다."]},{"id":"g-r010","domain":"process","edition":"both","approach":"predictive","tags":["주경로","여유","선후행관계"],"stem":"A(4일)가 끝나면 B(6일)와 C(3일)가 시작된다. D(5일)는 C 완료 후 2일 지연(FS+2 lag)을 두고 시작하며, E(2일)는 B와 D가 모두 끝나야 시작할 수 있다. 프로젝트 전체 기간과 활동 B의 총 여유(Total float)는?","options":["14일, 2일","16일, 4일","16일, 0일","12일, 4일"],"answer":[1],"explanation":"경로 A–C–(lag 2)–D–E = 4 + 3 + 2 + 5 + 2 = 16일이 주경로이고, A–B–E = 4 + 6 + 2 = 12일이다. 따라서 B의 총 여유는 16 − 12 = 4일이다. 지연(lag)은 작업이 아니지만 기간 계산에는 포함해야 한다.","optionNotes":["lag 2일을 빠뜨려 기간과 여유를 모두 과소 계산했다.","정답.","B는 주경로에 있지 않으므로 여유가 0이 아니다.","12일은 비주경로(A–B–E)의 길이이며, 프로젝트 기간은 가장 긴 경로로 결정된다."]},{"id":"g-r011","domain":"process","edition":"8th","approach":"predictive","tags":["품질비용","예방"],"stem":"의료기기 소프트웨어 프로젝트에서 출시 후 결함 대응 비용이 커지자, 스폰서는 품질을 프로세스 초기에 내재화하기 위한 투자를 늘리라고 지시했다. 다음 중 품질 비용(Cost of quality)에서 예방 비용(Prevention cost)에 해당하는 것 2개를 고르시오.","options":["개발자 대상 보안 코딩·규제 요건 교육","출시 전 시스템 테스트용 시험 장비 교정","설계 표준과 코딩 가이드라인 수립 및 프로세스 문서화","고객 현장 결함에 대한 보증 수리 및 리콜","내부 테스트에서 발견된 결함의 재작업"],"answer":[0,2],"explanation":"예방 비용은 결함이 처음부터 생기지 않도록 하는 활동(교육, 표준·프로세스 수립, 품질 계획)에 드는 비용이다. 8판의 품질 내재화 원칙은 검사로 걸러내기보다 프로세스 단계에서 결함을 예방하는 것을 강조한다.","optionNotes":["정답. 교육은 대표적인 예방 비용이다.","시험 장비 교정은 평가 비용(Appraisal cost)이다.","정답. 표준 수립과 프로세스 문서화는 예방 비용이다.","외부 실패 비용(External failure cost)이다.","내부 실패 비용(Internal failure cost)이다."],"diffNote":"8판은 '프로세스와 인도물에 품질 내재화'를 6원칙 중 하나로 두어 예방 중심 품질을 원칙 수준에서 강조한다. 7판에서도 유사한 원칙이 12원칙 중 하나였으나, 8판은 원칙 수를 줄이며 이를 핵심으로 유지했다."},{"id":"g-r012","domain":"process","edition":"both","approach":"predictive","tags":["관리도","품질통제"],"stem":"자동차 부품 사출 공정의 관리도(Control chart)를 검토하던 품질 담당자가, 최근 측정값 8개가 모두 관리 한계 안에 있지만 연속해서 평균선 위에 있다고 보고했다. 규격 한계를 벗어난 제품은 아직 없다. PM이 취해야 할 가장 적절한 조치는?","options":["모든 점이 관리 한계 안에 있으므로 공정은 안정적이며 조치가 필요 없다.","즉시 생산 라인을 멈추고 해당 기간 생산품을 전량 폐기한다.","관리 한계를 더 좁게 재설정해 변동을 엄격히 관리한다.","공정이 통제를 벗어났다는 신호(7의 규칙)로 보고 특별 원인(Assignable cause)을 조사한다."],"answer":[3],"explanation":"관리 한계 안이라도 평균 한쪽에 연속 7개 이상의 점이 나타나면(7의 규칙) 무작위 변동이 아니라 특별 원인을 의심해야 한다. 규격 이탈이 생기기 전에 원인을 분석해 시정하는 것이 예방적 품질 관리다.","optionNotes":["관리 한계 안이어도 비무작위 패턴은 통제 이탈 신호다.","원인 분석 없는 극단적 조치이며, 규격 이탈 제품도 없다.","관리 한계는 공정 데이터로 산출되며, 임의로 조정해도 원인은 해결되지 않는다.","정답. 비무작위 패턴의 원인을 먼저 조사한다."]},{"id":"g-r013","domain":"process","edition":"8th","approach":"predictive","tags":["관리예비비","재무","변경통제"],"stem":"공공 SI 프로젝트 진행 중, 리스크 관리대장에 없던 상위 법령 해석 변경으로 예상치 못한 추가 작업이 생겼다. 우발사태 예비비(Contingency reserve)는 식별된 리스크에 이미 배정되어 있고, 관리 예비비(Management reserve)는 스폰서가 통제한다. PM이 취해야 할 가장 적절한 조치는?","options":["우발사태 예비비 일부를 전용해 즉시 작업을 진행한다.","원가 기준선 안에서 다른 작업 패키지 예산을 줄여 비용을 흡수한다.","범위·일정·원가 영향을 분석한 뒤 변경 요청을 제출해, 승인 권한자의 승인을 받아 관리 예비비를 사용한다.","추가 작업은 고객 책임이므로 별도 분석 없이 작업 중단을 통보한다."],"answer":[2],"explanation":"식별되지 않은 리스크(unknown-unknowns)는 관리 예비비로 대응하며, 관리 예비비는 원가 기준선 밖에 있으므로 사용하려면 변경 통제와 승인 권한자의 승인이 필요하다. 승인되면 원가 기준선이 갱신된다.","optionNotes":["우발사태 예비비는 식별된 리스크용이며 임의 전용은 기준선 통제를 무력화한다.","승인 없이 다른 작업 예산을 줄이면 해당 작업이 위험해지고 기준선이 왜곡된다.","정답. 영향 분석 후 정식 변경 통제로 관리 예비비를 요청한다.","분석·협의 없이 일방적으로 중단을 통보하는 것은 부적절하다."],"diffNote":"8판은 재무(Finance)를 독립 성과 영역으로 두어 예비비·자금 통제와 승인 체계를 명시적으로 다룬다. 7판에서는 이 내용이 기획·측정 성과 영역 등에 분산되어 있었다."},{"id":"g-r014","domain":"process","edition":"both","approach":"predictive","tags":["2차리스크","리스크대응"],"stem":"핵심 부품 공급 지연 리스크를 완화하기 위해 해외 2차 공급업체를 추가하기로 했다. 계획 검토 중 한 팀원이 해외 조달 때문에 환율 변동과 통관 지연이라는 새로운 리스크가 생길 수 있다고 지적했다. PM이 해야 할 일로 가장 적절한 것은?","options":["2차 리스크(Secondary risk)로 식별해 리스크 관리대장에 기록하고, 분석하여 필요한 대응을 계획한다.","원래 리스크 대응이 이미 승인되었으므로 새 리스크는 실제로 발생하면 대응한다.","새 리스크가 생기므로 2차 공급업체 추가 계획을 즉시 철회한다.","잔존 리스크(Residual risk)로 분류해 별도 조치 없이 수용한다."],"answer":[0],"explanation":"리스크 대응을 실행한 직접적인 결과로 생기는 새 리스크는 2차 리스크이며, 다른 리스크와 마찬가지로 식별·분석·대응 계획이 필요하다. 대응 전략을 고를 때 2차 리스크까지 고려해야 순효과를 판단할 수 있다.","optionNotes":["정답.","발생한 뒤에 대응하는 것은 사전 예방적 리스크 관리에 어긋난다.","분석 없이 대응을 철회하면 원래 리스크가 다시 노출된다. 비교 분석이 먼저다.","잔존 리스크는 대응 후에도 남는 원래 리스크를 뜻하며, 대응 때문에 새로 생긴 리스크와 다르다."]},{"id":"g-r015","domain":"process","edition":"both","approach":"predictive","tags":["정량적리스크분석","리스크한계선"],"stem":"임상시험 지원 시스템 프로젝트의 몬테카를로 시뮬레이션 결과, 약속한 완료일을 맞출 확률이 45%로 나왔다. 스폰서가 정한 리스크 한계선(Risk threshold)은 '약속 일자 달성 확률 80% 이상'이다. PM이 다음으로 해야 할 가장 적절한 일은?","options":["시뮬레이션은 가정에 따라 달라지므로 결과는 참고만 하고, 보고 없이 기존 계획대로 실행을 계속한다.","민감도 분석으로 일정 리스크에 가장 크게 기여하는 요인을 찾아 대응 방안을 수립하고, 결과와 선택지를 스폰서와 공유한다.","한계선을 충족하도록 완료일을 즉시 P80 날짜로 바꾸고, 일정 기준선을 갱신해 팀에 공지한다.","팀에 초과 근무를 지시해 모든 활동 기간을 20% 단축하고, 달성 확률이 80%가 될 때까지 반복한다."],"answer":[1],"explanation":"리스크 노출이 한계선을 넘었으므로 토네이도 다이어그램 같은 민감도 분석으로 주요 원인을 찾아 대응을 계획하고, 의사결정자에게 투명하게 보고해야 한다. 기준선 변경이 필요하더라도 변경 통제를 거쳐야 한다.","optionNotes":["한계선 초과 사실을 숨기는 것은 투명성과 책임에 어긋난다.","정답. 분석 후 대응 방안과 선택지를 의사결정자와 공유한다.","분석과 승인 없이 기준선을 임의로 바꿀 수 없다.","근본 원인 분석 없이 일괄 단축을 지시하는 것은 비현실적이며 새 리스크를 만든다."]},{"id":"g-r016","domain":"process","edition":"both","approach":"predictive","tags":["의사소통채널","커뮤니케이션관리"],"stem":"공장 설비 증설 프로젝트의 핵심 팀은 PM을 포함해 6명이었는데, 상세 설계 단계에 들어서며 협력업체 엔지니어 4명이 합류해 10명이 되었다. 최근 일부 팀원이 변경된 도면 정보를 늦게 받는 일이 반복되고 있다. 의사소통 채널(Communication channels)은 몇 개 늘었으며, PM이 해야 할 가장 적절한 일은?","options":["4개 증가 — 인원 증가 폭이 작으므로 기존 커뮤니케이션 방식을 유지한다.","45개 증가 — 모든 정보를 전체 메일로 공유하도록 규칙을 바꾼다.","30개 증가 — PM이 모든 정보를 직접 중계하는 단일 창구가 된다.","30개 증가 — 정보 요구를 다시 분석해 커뮤니케이션 관리 계획을 갱신한다."],"answer":[3],"explanation":"채널 수는 n(n−1)/2이므로 6명일 때 6×5/2 = 15개, 10명일 때 10×9/2 = 45개로 30개가 늘었다. 채널이 크게 늘면 정보 누락 가능성도 커지므로, 새 구성원의 정보 요구를 분석해 커뮤니케이션 관리 계획(배포 대상·방법·빈도)을 갱신해야 한다.","optionNotes":["4는 늘어난 인원 수이지 채널 수가 아니며, 이미 정보 누락 문제가 생기고 있다.","45는 증가분이 아니라 전체 채널 수이고, 무차별 전체 메일은 정보 과부하를 부른다.","증가분 계산은 맞지만 PM이 모든 정보를 중계하면 병목이 되어 전달이 더 늦어진다.","정답. 증가분 계산이 맞고, 계획을 갱신해 체계적으로 대응한다."]},{"id":"g-r017","domain":"process","edition":"8th","approach":"agile","tags":["조달","애자일계약"],"stem":"보험사가 외부 업체와 함께 고객용 모바일 앱을 애자일로 개발하려 한다. 초기에는 핵심 기능만 명확하고 이후 범위는 사용자 피드백에 따라 바뀔 예정이다. 구매 부서는 원가 통제와 중도 종료 가능성을 동시에 확보하길 원한다. 가장 적절한 계약 접근은?","options":["전체 기능 명세를 확정한 뒤 단일 확정 고정가(FFP) 계약을 체결한다.","상한 없는 시간·자재(T&M) 계약으로 업체가 필요한 만큼 작업하게 한다.","증분(스프린트·릴리스) 단위로 가격을 정하고, 우선순위 교체와 조기 종료 조항을 둔 단계적 계약을 체결한다.","범위가 불확실하므로 구두 합의로 먼저 시작하고 범위가 확정되면 계약한다."],"answer":[2],"explanation":"범위가 진화하는 애자일 작업에는 증분 단위 가격, 백로그 우선순위 교체, 조기 종료 권리를 담은 유연한 계약이 원가 통제와 적응성을 함께 제공한다. 8판은 이런 현대적 계약 방식에 대한 지침을 보강했다.","optionNotes":["범위가 바뀌는 상황에서 전체 명세를 고정하면 잦은 변경과 분쟁을 부른다.","상한 없는 T&M은 구매자의 원가 리스크가 너무 크다.","정답. 증분 단위 통제와 유연성을 함께 확보한다.","계약 없이 작업을 시작하면 법적·재무적 리스크가 생긴다."],"diffNote":"8판은 조달과 현대적 계약 방식(증분형·적응형 계약 등)에 대한 지침을 보강했다. 7판은 조달을 모델·방법·산출물 부분에서 간략히 다뤘다."},{"id":"g-r018","domain":"process","edition":"8th","approach":"predictive","tags":["제작구매분석","지속가능성"],"stem":"전기차 충전기 제조사가 충전 제어 모듈을 직접 개발할지 외부에서 구매할지 결정해야 한다. 외부 구매 단가는 내부 개발비보다 15% 낮지만, 이 모듈은 회사의 핵심 경쟁 기술이고 외부 제품은 부품 수명이 짧아 교체 비용과 폐기물이 많다. 제작-구매 분석(Make-or-buy analysis)에서 PM이 취해야 할 가장 적절한 접근은?","options":["초기 단가뿐 아니라 수명주기 원가, 지식재산·핵심 역량, 환경 영향을 종합 평가해 의사결정자에게 권고한다.","외부 구매 단가가 내부 개발보다 15% 낮으므로, 원가 절감을 위해 외부 구매로 결정한다.","핵심 경쟁 기술이므로 원가 분석을 생략하고 내부 개발로 결정해 기술 유출을 막는다.","결정을 미루고 두 방안을 모두 병행 개발해 결과를 본 뒤 더 나은 쪽을 선택한다."],"answer":[0],"explanation":"제작-구매 분석은 직접 비용뿐 아니라 총소유비용, 전략적 역량과 지식재산, 리스크, 지속가능성 영향을 함께 고려해야 한다. 8판은 지속가능성을 모든 프로젝트 영역에 통합하고 가치 중심 의사결정을 강조한다.","optionNotes":["정답. 수명주기·전략·환경 요인을 함께 평가한다.","단가만 비교하면 수명주기 원가와 전략적 요인을 놓친다.","분석 없이 결론을 내리는 것은 근거 기반 의사결정에 어긋난다.","근거 없는 병행 개발은 자원을 낭비한다."],"diffNote":"8판은 '모든 프로젝트 영역에 지속가능성 통합'을 원칙으로 두어 조달 결정에서도 환경·사회적 영향을 고려하도록 한다. 7판은 스튜어드십 원칙 등에서 간접적으로만 다뤘다."},{"id":"g-r019","domain":"process","edition":"both","approach":"predictive","tags":["공급자선정","조달"],"stem":"병원 정보시스템 구축 입찰에서 사전 공지한 선정 기준에 '의료정보 보안 인증 보유'가 필수 요건(Screening criterion)으로 들어 있었다. 최저가를 제출한 업체는 인증이 없지만 계약 후 6개월 안에 취득하겠다고 제안했다. 구매 담당 임원은 가격 차이가 크니 이 업체를 선정하자고 한다. PM이 취해야 할 가장 적절한 조치는?","options":["임원 의견대로 최저가 업체를 선정하고 인증 취득을 계약 조건으로 넣는다.","공지된 선정 기준에 따라 해당 업체를 필수 요건 미충족으로 제외하고, 기준을 충족한 업체들을 평가한다.","평가 도중에 인증 요건을 삭제하고 가격만으로 다시 평가한다.","최저가 업체에 다른 업체의 가격을 알려 주고 추가 협상을 한다."],"answer":[1],"explanation":"공지된 필수 요건을 충족하지 못한 제안은 선별 기준에 따라 제외해야 한다. 특정 업체에 맞춰 사후에 기준을 바꾸면 공정성과 조달 규정을 위반하며, 기준 변경이 정말 필요하면 모든 입찰자에게 공지하고 다시 입찰하는 정식 절차를 밟아야 한다.","optionNotes":["공지된 필수 기준을 무시하는 것으로 불공정하고 보안 리스크도 만든다.","정답. 공지된 기준을 일관되게 적용한다.","평가 도중 기준을 임의로 바꾸면 공정성이 훼손된다.","경쟁사 가격을 공개하는 것은 비윤리적이며 기밀 위반이다."]},{"id":"g-r020","domain":"process","edition":"both","approach":"hybrid","tags":["의사결정나무","EMV"],"stem":"물류 기업이 배송 관리 시스템을 두 방식 중 하나로 도입하려 한다. A안은 예측형 자체 개발로 비용 $120,000이며, 30% 확률로 $50,000의 납기 지연 위약금이 생길 수 있다. B안은 SaaS를 구매해 반복적으로 설정하는 방식으로 비용 $100,000이며, 40% 확률로 $80,000의 연동 재작업이 생길 수 있다. 의사결정 나무(Decision tree) 분석에 따른 선택과 그 기대 비용은?","options":["A안, 기대 비용 $135,000","B안, 기대 비용 $100,000","B안, 기대 비용 $132,000","A안, 리스크 비용 $15,000이 B안의 $32,000보다 작으므로"],"answer":[2],"explanation":"A안 기대 비용 = 120,000 + (0.3 × 50,000) = 135,000달러, B안 기대 비용 = 100,000 + (0.4 × 80,000) = 132,000달러이다. 기대 비용이 더 낮은 B안을 선택한다. 의사결정 나무는 초기 비용과 리스크의 기대 영향을 함께 비교해야 한다.","optionNotes":["A안의 기대 비용 계산은 맞지만 B안(132,000)보다 높다.","B안의 리스크 기대 비용 32,000을 빠뜨렸다.","정답. 초기 비용과 리스크 기대 비용을 합해 비교한 결과다.","리스크 비용만 비교하고 초기 비용 차이 20,000을 무시했다."]},{"id":"g-r021","domain":"process","edition":"both","approach":"predictive","tags":["자원최적화","자원평활화"],"stem":"건축 설계 프로젝트에서 구조 엔지니어 한 명이 3주 차에 두 활동에 동시에 배정되어 과다 할당(Overallocation)되었다. 두 활동 중 하나는 주경로에 있고, 다른 하나는 총 여유가 6일이다. 프로젝트 종료일은 바꿀 수 없다. 가장 적절한 자원 최적화 기법은?","options":["자원 평준화(Resource leveling)를 적용해 주경로 활동을 뒤로 미룬다.","주경로 활동에 패스트 트래킹(Fast tracking)을 적용한다.","엔지니어에게 3주 차에 평소의 두 배로 일하도록 요청한다.","여유가 있는 활동을 여유 범위 안에서 옮기는 자원 평활화(Resource smoothing)를 적용한다."],"answer":[3],"explanation":"자원 평활화는 여유 범위 안에서 활동을 조정해 과다 할당을 해소하므로 주경로와 종료일이 바뀌지 않는다. 반면 자원 평준화는 주경로를 바꾸고 종료일을 늦출 수 있다.","optionNotes":["주경로 활동을 늦추면 종료일이 지연된다.","패스트 트래킹은 일정 단축 기법이며 오히려 과다 할당을 악화시킬 수 있다.","지속할 수 없는 업무 부담은 품질 저하와 번아웃 리스크를 높인다.","정답. 여유를 활용해 종료일 영향 없이 과다 할당을 해소한다."]},{"id":"g-r022","domain":"process","edition":"both","approach":"hybrid","tags":["형상관리","버전관리"],"stem":"하이브리드 방식의 스마트 빌딩 프로젝트에서 하드웨어 팀은 설계 사양서 v2.3을, 소프트웨어 팀은 v2.1을 기준으로 작업해 통합 테스트에서 인터페이스 불일치가 발생했다. 두 버전 모두 공유 드라이브에 있고 어느 것이 승인본인지 표시가 없다. PM이 취해야 할 가장 적절한 조치는?","options":["형상 관리(Configuration management) 절차를 확립해 승인된 기준 버전을 식별하고, 변경 이력과 현황을 추적·공유한다.","최신 버전인 v2.3이 승인본일 가능성이 높으므로, 소프트웨어 팀에 v2.3 기준으로 즉시 재작업을 지시한다.","각 팀이 익숙한 버전을 계속 쓰게 하고, 불일치를 흡수하도록 통합 테스트 기간을 2주 늘린다.","불일치를 일으킨 책임자를 찾아 공식 경고하고, 문서 관리 담당자를 다른 사람으로 교체한다."],"answer":[0],"explanation":"형상 관리는 인도물과 문서의 버전을 식별하고 변경을 통제하며 현황을 기록·검증해 모두가 승인된 기준으로 일하게 한다. 최신 버전이 곧 승인본이라는 보장이 없으므로 먼저 기준을 확정해야 한다.","optionNotes":["정답. 근본 원인인 버전 통제 부재를 해결한다.","v2.3이 승인본인지 확인하지 않고 재작업을 지시하면 낭비가 커질 수 있다.","근본 원인을 방치해 불일치가 반복된다.","비난 중심 대응은 프로세스 문제를 해결하지 못한다."]},{"id":"g-r023","domain":"process","edition":"both","approach":"hybrid","tags":["요구사항추적","범위"],"stem":"하이브리드 방식의 은행 대출 시스템 프로젝트에서 감사팀이 '규제 요구사항 R-14가 실제로 구현·테스트되었는지 증명하라'고 요청했다. 일부 요구사항은 예측형 설계 문서에, 일부는 애자일 팀의 사용자 스토리에 반영되어 있다. PM이 활용해야 할 가장 적절한 도구는?","options":["프로젝트 일정의 마일스톤 차트","이해관계자 참여 평가 매트릭스(Stakeholder engagement assessment matrix)","요구사항을 설계 요소·사용자 스토리·테스트 케이스와 연결한 요구사항 추적 매트릭스(Requirements traceability matrix)","리스크 관리대장의 규제 리스크 항목"],"answer":[2],"explanation":"요구사항 추적 매트릭스는 요구사항을 출처에서 설계, 구현(스토리), 테스트까지 연결해 각 요구사항이 충족·검증되었음을 입증한다. 하이브리드 환경에서는 두 방식의 산출물을 하나의 추적 체계로 연결하는 것이 중요하다.","optionNotes":["마일스톤 완료는 특정 요구사항의 구현·검증을 증명하지 못한다.","이해관계자 참여 수준을 관리하는 도구다.","정답. 요구사항부터 테스트까지의 연결을 보여준다.","리스크 정보일 뿐 구현·테스트의 증거가 아니다."]},{"id":"g-r024","domain":"process","edition":"both","approach":"predictive","tags":["범위검증","인수"],"stem":"물류 창고 자동화 프로젝트의 첫 번째 주요 인도물이 내부 품질 통제(Control quality) 검사를 모두 통과했다. 고객은 아직 인도물을 확인하지 않았다. PM이 다음으로 해야 할 일로 가장 적절한 것은?","options":["품질 검사를 통과했으므로 인도물을 운영 조직에 바로 이관하고 종료 단계로 전환한다.","고객과 함께 인수 기준에 따라 인도물을 검토해 공식 인수를 받는다(범위 검증, Validate scope).","고객 확인은 미루고 다음 인도물의 품질 검사부터 진행해 효율을 높인다.","품질 보고서를 이메일로 보내고 일주일 안에 회신이 없으면 인수된 것으로 간주한다."],"answer":[1],"explanation":"품질 통제는 인도물의 정확성을 확인하고, 범위 검증은 고객이나 스폰서가 인수 기준에 따라 인도물을 공식적으로 인수하는 과정이다. 일반적으로 품질 통제를 통과한 인도물을 대상으로 범위 검증을 수행한다.","optionNotes":["공식 인수 없이 이관할 수 없으며, 첫 번째 인도물일 뿐이므로 종료 단계도 아니다.","정답. 품질 통제 다음은 고객의 공식 인수다.","인수를 미루면 고객 요구와의 불일치를 늦게 발견할 위험이 있다.","무응답을 인수로 간주하는 것은 공식 인수가 아니다."]},{"id":"g-r025","domain":"process","edition":"both","approach":"predictive","tags":["프로젝트종료","조기종료"],"stem":"시장 변화로 이사회가 진행 중인 매장 POS 교체 프로젝트를 60% 시점에서 중단하기로 결정했다. 스폰서는 PM에게 프로젝트를 정리하라고 요청했다. PM이 해야 할 일로 가장 적절한 것 2개를 고르시오.","options":["중단된 프로젝트이므로 문서화를 생략하고 팀을 즉시 다른 프로젝트로 보낸다.","완료·미완료 인도물의 상태와 중단 사유를 문서화하고 프로젝트 기록을 보관한다.","이미 투입한 작업이 아까우므로 잔여 작업을 줄여서라도 계속하자고 스폰서를 설득한다.","계약의 종료 조항에 따라 공급업체 계약을 정리하고 미결 사항을 해결한다.","결정에 대한 팀의 불만을 고려해 교훈 수집은 하지 않는다."],"answer":[1,3],"explanation":"조기 종료된 프로젝트도 정상 종료와 같은 종료 절차를 따라야 한다. 인도물 상태와 사유 문서화, 계약 종료, 자원 해제, 기록 보관, 교훈 정리를 통해 조직 지식을 보존하고 법적·재무적 미결 사항을 남기지 않는다.","optionNotes":["문서화를 생략하면 조직 학습과 감사 추적이 훼손된다.","정답. 인도물 상태와 사유를 기록하고 보관한다.","이미 내려진 거버넌스 결정을 뒤집으려는 것은 부적절하다(매몰 비용 오류).","정답. 조달 계약을 종료하고 미결 사항을 해결한다.","조기 종료 프로젝트의 교훈은 특히 가치가 크다."]},{"id":"g-r026","domain":"process","edition":"8th","approach":"hybrid","tags":["인계","가치인도","종료"],"stem":"하이브리드 방식으로 개발한 지자체 민원 챗봇 서비스가 최종 릴리스를 마쳤다. 운영은 IT 운영팀이 맡을 예정이며, 스폰서는 서비스가 의도한 편익(민원 처리 시간 단축)을 계속 내기를 원한다. 프로젝트 종료 전에 PM이 해야 할 일 2개를 고르시오.","options":["운영팀이 인수 기준에 따라 서비스를 공식 인수했는지 확인한다.","프로젝트가 끝나면 편익 측정은 의미가 없으므로 성과 지표 이관은 생략한다.","남은 예산으로 운영팀과 합의하지 않은 신규 기능을 추가 개발한다.","운영팀이 준비되지 않았더라도 일정대로 프로젝트 팀을 즉시 해산한다.","운영 매뉴얼·지식과 함께 편익 측정 지표와 책임을 운영 조직에 이관한다."],"answer":[0,4],"explanation":"전환(Transition)은 운영 조직이 인도물을 공식 인수하고, 지속적으로 가치를 낼 수 있도록 지식·문서·편익 측정 책임을 넘겨받게 하는 활동이다. 8판은 산출물 인도를 넘어 지속적인 가치 실현을 강조한다.","optionNotes":["정답. 운영 조직의 공식 인수를 확인한다.","편익은 종료 후에 실현되는 경우가 많으므로 측정 책임을 이관해야 한다.","합의되지 않은 추가 개발은 금도금(Gold plating)이다.","준비되지 않은 상태에서 해산하면 인계 실패 리스크가 커진다.","정답. 지식과 편익 측정 책임을 운영 조직에 넘긴다."],"diffNote":"8판은 '가치에 집중' 원칙과 종료 중점 영역을 통해 인계 이후 편익 지속까지 연결해 다룬다. 7판은 가치 인도를 원칙과 인도 성과 영역 중심으로 다뤘다."},{"id":"g-r027","domain":"process","edition":"8th","approach":"hybrid","tags":["테일러링","프로세스"],"stem":"중견 기업의 3개월짜리 내부 대시보드 구축 프로젝트(팀원 4명)에 대해 PMO가 PMBOK 8판의 40개 프로세스를 모두 수행하고 각 산출물을 문서로 제출하라고 요구했다. 팀은 일부 작업을 반복적으로 진행하려 한다. PM이 취해야 할 가장 적절한 접근은?","options":["PMO가 요구한 거버넌스 기준이므로 40개 프로세스의 모든 산출물을 빠짐없이 작성해 제출한다.","프로세스는 반복적 방식에 맞지 않으므로 PMO에 알리지 않고 문서화를 모두 생략한다.","PMO 요구는 일단 무시하고 팀이 원하는 방식으로 진행한 뒤 성과로 PMO를 설득한다.","프로세스는 비규범적이므로 프로젝트 규모·리스크·개발 방식에 맞게 테일러링하고, 그 근거를 PMO와 합의해 문서화한다."],"answer":[3],"explanation":"8판의 40개 프로세스는 비규범적이며 프로젝트 상황에 맞게 테일러링하도록 되어 있다. PM은 거버넌스 요구와 프로젝트 특성을 조화시키기 위해 테일러링 근거를 PMO와 합의하고 문서화해야 한다.","optionNotes":["소규모 프로젝트에 모든 프로세스를 그대로 적용하면 가치 없는 부담만 늘어난다.","투명성 없이 생략하는 것은 거버넌스 위반이다.","거버넌스를 무시한 일방적 행동이다.","정답. 상황에 맞게 테일러링하고 거버넌스와 합의한다."],"diffNote":"8판은 7판에서 본문에서 빠졌던 프로세스를 40개의 비규범적·테일러링 가능한 프로세스로 다시 제공한다. 7판은 원칙과 성과 영역 중심으로 구성되었다."},{"id":"g-r028","domain":"process","edition":"8th","approach":"hybrid","tags":["거버넌스","의사결정권한","하이브리드"],"stem":"공항 수하물 시스템 교체 프로젝트는 설비 설치를 단계 게이트로, 제어 소프트웨어를 스프린트로 진행한다. 최근 제품 책임자가 백로그 우선순위를 바꿀 때마다 운영위원회 승인이 필요한지, 설비 일정에 영향을 주는 변경은 누가 결정하는지를 두고 혼선이 생겨 의사결정이 늦어지고 있다. PM이 취해야 할 가장 적절한 조치는?","options":["거버넌스 구조에 의사결정 권한과 에스컬레이션 기준(예: 기준선이나 인터페이스에 영향을 주는 변경만 운영위원회에 상정)을 정의하고 이해관계자와 합의한다.","혼선을 없애기 위해 모든 백로그 변경을 운영위원회 승인 대상으로 지정한다.","소프트웨어 팀은 자율적이므로 설비 일정에 영향을 주는 변경도 제품 책임자가 단독으로 결정하게 한다.","PM이 모든 변경을 직접 결정해 의사결정 속도를 높인다."],"answer":[0],"explanation":"하이브리드 거버넌스에서는 팀 수준 결정(백로그 우선순위)과 상위 거버넌스 결정(기준선·통합 영향)을 구분하는 권한과 임계값을 명확히 해야 민첩성과 통제를 함께 확보할 수 있다. 8판은 거버넌스를 성과 영역으로 다루며 이런 의사결정 체계 설계를 강조한다.","optionNotes":["정답. 결정 수준별 권한과 상정 기준을 명확히 한다.","과도한 통제로 애자일의 적응성과 속도를 잃는다.","통합 영향이 있는 변경을 단독 결정하면 설비 작업 흐름에 리스크가 생긴다.","권한 위임 문화에 어긋나며 PM이 병목이 된다."],"diffNote":"8판은 거버넌스를 7개 성과 영역 중 하나로 두어 하이브리드 환경의 의사결정 구조를 명시적으로 다룬다. 7판에는 거버넌스 성과 영역이 없었다."},{"id":"g-r029","domain":"process","edition":"both","approach":"agile","tags":["인수기준","범위","백로그"],"stem":"애자일로 진행하는 영업 관리 앱에서 '보고서 내보내기' 스토리는 'CSV 형식으로 내보낼 수 있어야 한다'는 인수 기준(Acceptance criteria)을 충족해 지난 스프린트 리뷰에서 제품 책임자가 인수했다. 이번 주 영업 본부장이 '엑셀 형식이 안 되는 심각한 결함'이라며 경영진에게 에스컬레이션했다. 가장 적절한 조치는?","options":["결함으로 분류하고 현재 스프린트 작업을 멈춘 뒤 팀이 즉시 수정한다.","합의된 인수 기준에 없으므로 요청을 거절하고 더 이상 논의하지 않는다.","결함이 아닌 신규 요구로 보고, 제품 책임자가 백로그에 추가해 우선순위를 정하게 한다.","스토리 인수를 취소하고 인수 기준에 엑셀 형식을 넣어 미완료로 되돌린다."],"answer":[2],"explanation":"합의된 인수 기준을 충족한 스토리는 완료된 것이며, 기준에 없던 기능 요청은 결함이 아니라 새로운 요구사항이다. 제품 책임자가 본부장과 대화해 필요와 가치를 파악하고, 새 백로그 항목으로 다른 항목과 비교해 우선순위를 정하는 것이 범위를 투명하게 관리하는 방법이다.","optionNotes":["인수 기준을 충족했으므로 결함이 아니며, 스프린트를 멈추면 합의된 목표가 흔들린다.","요구 자체는 가치가 있을 수 있으므로 일방적 거절은 이해관계자 참여에 어긋난다.","정답. 신규 요구로 백로그에 넣고 가치에 따라 우선순위를 정한다.","이미 인수된 작업을 사후에 기준을 바꿔 되돌리면 완료의 의미가 무너진다."]}]`),JSON.parse(`[{"id":"g-r101","domain":"process","edition":"both","approach":"hybrid","tags":["MoSCoW","우선순위"],"stem":"금융 규제 보고 시스템을 하이브리드 방식으로 구축하는 중이다. 규제 보고 모듈은 3월 31일까지 반드시 가동되어야 하며 기한은 변경할 수 없다. 남은 팀 역량으로는 백로그의 약 60%만 완료할 수 있는데, 각 부서 이해관계자는 자신이 요청한 기능이 모두 '필수'라고 주장한다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["전체 범위를 기한 내 완료할 수 없다는 분석 결과를 근거로, 스폰서에게 마감일 연기를 요청하는 변경 요청을 제출한다.","제품 책임자·핵심 이해관계자와 MoSCoW 워크숍을 열어 규제 준수에 꼭 필요한 항목만 Must로 정하고 나머지를 분류한다.","모든 이해관계자의 요구를 충족하기 위해 팀에 두 달간 주말 초과근무를 요청하고 추가 수당 예산을 확보한다.","이해관계자 간 논쟁을 줄이기 위해 프로젝트 관리자가 기술 난이도와 의존성을 기준으로 우선순위를 정해 공지한다."],"answer":[1],"explanation":"기한이 고정된 상황에서는 범위를 조정 변수로 삼아야 하며, MoSCoW는 이해관계자와 함께 '반드시 필요한 것'을 합의하는 데 효과적인 기법이다. 규제 준수라는 객관적 기준으로 Must를 좁히면 기한 내 핵심 가치를 확보할 수 있다.","optionNotes":["기한은 법적으로 변경 불가하며, 범위 조정을 검토하기 전에 연기부터 요청하는 것은 부적절하다.","정답. 고정 기한하에서 이해관계자와 함께 가치·규제 기준으로 범위 우선순위를 합의하는 협업적 접근이다.","수당을 지급하더라도 지속 불가능한 업무 강도는 품질 저하와 번아웃 위험을 키우며 범위 문제를 해결하지 못한다.","우선순위는 가치 기준으로 제품 책임자와 이해관계자가 정해야 하며, PM의 일방적 결정은 수용성을 떨어뜨린다."]},{"id":"g-r102","domain":"process","edition":"both","approach":"agile","tags":["WSJF","백로그우선순위","계산"],"stem":"애자일 릴리스 트레인에서 가중 최단 작업 우선(WSJF, Weighted Shortest Job First)으로 다음 기능을 고르려 한다. 각 기능의 지연 비용(Cost of Delay)과 작업 크기(Job size)는 다음과 같다. 결제 개선: CoD 21, 크기 7 / 대용량 보고서: CoD 30, 크기 12 / 알림 설정: CoD 16, 크기 4 / 로그인 UX: CoD 9, 크기 3. 가장 먼저 착수해야 할 기능은?","options":["결제 개선","대용량 보고서","알림 설정","로그인 UX"],"answer":[2],"explanation":"WSJF = 지연 비용 ÷ 작업 크기이다. 결제 개선 21/7=3.0, 대용량 보고서 30/12=2.5, 알림 설정 16/4=4.0, 로그인 UX 9/3=3.0이므로 알림 설정이 가장 높다. WSJF는 지연 비용이 크면서 작은 작업을 먼저 수행해 경제적 가치를 극대화한다.","optionNotes":["WSJF 3.0으로 알림 설정(4.0)보다 낮다.","지연 비용은 가장 크지만 작업 크기도 커서 WSJF 2.5로 가장 낮다.","정답. WSJF 4.0으로 가장 높다.","WSJF 3.0으로 알림 설정보다 낮다."]},{"id":"g-r103","domain":"process","edition":"both","approach":"agile","tags":["사용자스토리","INVEST","스토리분할"],"stem":"스크럼 팀의 평균 속도는 스프린트당 25포인트인데, 백로그 정제 중 '정산 관리자로서 월말 정산 전체를 시스템에서 처리하고 싶다'는 스토리가 40포인트로 추정되었다. 제품 책임자는 이 스토리를 다음 스프린트에 넣고 싶어 한다. 가장 적절한 조치는?","options":["제품 책임자와 팀이 함께 워크플로 단계나 업무 규칙 기준으로, 각각 사용자 가치를 인도하는 작은 수직 슬라이스로 분할한다.","아키텍처 일관성을 위해 UI, API, 데이터베이스 등 기술 계층별로 나누어 각 계층을 별도 스토리로 만든다.","이 스토리를 한 번에 완료할 수 있도록 다음 스프린트 기간만 예외적으로 4주로 늘린다.","스토리를 그대로 스프린트에 넣고 진행하며, 미완료분은 다음 스프린트로 이월해 이어서 개발한다."],"answer":[0],"explanation":"INVEST 기준에서 스토리는 작고(Small) 추정 가능하며 가치 있어야(Valuable) 한다. 스프린트 역량을 넘는 스토리는 종단 간 기능을 유지하는 수직 슬라이스로 분할해야 각 조각이 독립적으로 가치를 인도하고 검증될 수 있다.","optionNotes":["정답. 각 조각이 독립적으로 가치를 인도하는 수직 분할로 INVEST를 충족한다.","수평(계층) 분할은 개별 조각이 사용자 가치를 인도하지 못하고 상호 의존성을 만든다.","타임박스를 임의로 바꾸면 리듬과 예측 가능성이 깨지며 근본 문제(큰 스토리)를 해결하지 못한다.","완료 불가능한 작업을 계획적으로 투입하는 것으로 스프린트 목표 달성과 투명성을 해친다."]},{"id":"g-r104","domain":"process","edition":"both","approach":"agile","tags":["인수기준","백로그정제"],"stem":"스프린트 리뷰에서 제품 책임자가 '할인 쿠폰 적용' 스토리를 기대와 다르다며 수락하지 않았다. 개발자들은 스토리 설명대로 구현했다고 주장하며, 조사해 보니 스토리에는 '쿠폰을 적용할 수 있어야 한다'는 문장만 있었다. 이런 일이 반복되지 않도록 프로젝트 관리자(스크럼 마스터)가 촉진해야 할 가장 적절한 조치는?","options":["개발자들이 설명대로 구현한 것은 사실이므로, 이번 스토리는 수락하고 기대 차이는 신규 스토리로 등록하도록 제품 책임자를 설득한다.","기대 불일치를 막기 위해 앞으로 모든 스토리에 대해 착수 전 상세 요구사항 명세서를 작성하고 제품 책임자의 서명을 받는다.","스프린트 흐름을 방해하지 않도록 이 문제는 다음 회고 때 논의하기로 하고 남은 스토리 개발을 계속 진행한다.","백로그 정제 때 제품 책임자, 개발자, 테스터가 테스트 가능한 인수 기준(Acceptance criteria)을 함께 합의하고 스프린트 투입 조건에 포함한다."],"answer":[3],"explanation":"스토리 수락 불일치의 근본 원인은 모호한 인수 기준이다. 정제 단계에서 '세 명의 관점(Three Amigos)'이 구체적이고 테스트 가능한 인수 기준을 합의하면 공유된 이해가 생기고 리뷰에서의 거절이 줄어든다.","optionNotes":["수락 권한은 제품 책임자에게 있으며, 설득으로는 모호한 인수 기준이라는 근본 원인이 해결되지 않는다.","과도한 사전 문서화로 애자일의 적시 협업 원칙에 어긋나고 낭비를 만든다.","개선을 미루는 회피적 대응이며 남은 스토리에서도 같은 문제가 계속 발생한다.","정답. 협업적으로 테스트 가능한 인수 기준을 정의해 기대 불일치를 예방한다."]},{"id":"g-r105","domain":"process","edition":"both","approach":"hybrid","tags":["속도오용","지표"],"stem":"하이브리드 프로그램의 PMO 디렉터가 네 개 애자일 팀의 속도(Velocity)를 한 대시보드에 나란히 놓고 순위를 매겨, 하위 팀에는 개선 계획을 요구하고 상위 팀에는 성과급을 주겠다고 한다. 프로그램 관리자가 취해야 할 가장 적절한 조치는?","options":["PMO 디렉터의 권한 범위 내 요청이므로 팀별 속도 순위 대시보드를 만들어 제공하고, 팀에는 목적을 설명한다.","공정한 비교가 가능하도록 모든 팀의 스토리 포인트 기준을 하나로 표준화한 뒤 속도 순위를 산출한다.","PMO 디렉터에게 속도는 팀 고유의 계획 도구라 비교·보상에 쓰면 왜곡된다는 점을 설명하고, 인도 가치·예측 가능성 등 대안 지표를 제안한다.","애자일 원칙에 어긋나므로 요청을 거절하고, 팀이 동요하지 않도록 이 논의 내용은 팀에 알리지 않는다."],"answer":[2],"explanation":"속도는 각 팀의 추정 기준에 따라 달라지는 상대적 값으로, 팀 내부 계획 용도로만 의미가 있다. 비교·보상에 사용하면 굿하트의 법칙처럼 지표가 왜곡되므로, 이해관계자의 실제 정보 요구를 파악해 가치·결과 중심 지표를 제안하는 것이 바람직하다.","optionNotes":["설명을 덧붙여도 지표 오용을 그대로 수용하는 것으로, 팀 행동 왜곡과 신뢰 저하를 초래한다.","포인트 표준화는 상대 추정의 본질을 훼손하고 비교 압박으로 인한 부풀리기를 막지 못한다.","정답. 이해관계자를 교육하고 목적에 맞는 대안 지표를 제시하는 협업적 접근이다.","일방적 거절과 정보 은폐는 투명성과 신뢰를 해친다."]},{"id":"g-r106","domain":"process","edition":"both","approach":"agile","tags":["칸반","WIP한도"],"stem":"IT 운영팀의 칸반 보드에서 '테스트' 열의 WIP 한도는 4인데 현재 7개 항목이 쌓여 있다. 개발자들은 자기 열에 여유가 있다며 계속 새 작업을 개발 열로 당겨오고 있고, 평균 리드 타임은 지난달보다 40% 늘었다. 프로젝트 관리자가 취해야 할 가장 적절한 조치 2개를 고르시오.","options":["현재 상황을 반영해 테스트 열의 WIP 한도를 10으로 올린다.","개발자들이 새 작업을 시작하기보다 테스트 대기 항목 처리에 함께 참여(스워밍)하도록 '시작을 멈추고 끝내기'를 독려한다.","팀과 함께 테스트 단계 병목의 원인을 분석하고, WIP 한도 준수와 당기기(Pull) 정책을 명시적으로 합의한다.","리드 타임을 줄이기 위해 테스트 단계를 생략하고 운영 배포 후 문제를 수정한다.","즉시 추가 테스터 두 명의 채용을 경영진에 요청한다."],"answer":[1,2],"explanation":"WIP 한도는 흐름을 보호하고 병목을 드러내기 위한 장치이므로, 한도 초과 시 새 작업 착수를 멈추고 막힌 작업을 끝내는 데 집중해야 한다. 동시에 팀이 병목 원인을 분석하고 명시적 정책을 합의해야 재발을 막을 수 있다.","optionNotes":["한도를 올리면 병목이 숨겨질 뿐이며 리드 타임은 더 늘어난다.","정답. 스워밍으로 흐름을 회복하는 칸반의 핵심 실천이다.","정답. 근본 원인 분석과 명시적 프로세스 정책은 칸반의 지속적 개선 실천이다.","품질 활동 생략은 결함과 재작업을 늘리는 위험한 결정이다.","원인 분석 없이 자원 추가를 요청하는 것은 성급하다."]},{"id":"g-r107","domain":"process","edition":"both","approach":"agile","tags":["리틀의법칙","사이클타임","계산"],"stem":"칸반 방식의 고객지원 개선팀은 진행 중 작업(WIP)이 평균 24개이고, 처리량(Throughput)은 주당 평균 8개이다. 리틀의 법칙(Little's Law)에 따른 평균 사이클 타임과, 처리량을 유지하면서 사이클 타임을 줄이기 위한 가장 적절한 방법은?","options":["약 3주; WIP 한도를 낮춰 동시에 진행하는 작업 수를 줄인다.","약 3주; 신규 요청을 더 빨리 착수하도록 투입량을 늘린다.","약 0.33주; WIP 한도를 낮춰 동시에 진행하는 작업 수를 줄인다.","약 16주; 처리량 목표를 두 배로 높이도록 팀에 지시한다."],"answer":[0],"explanation":"리틀의 법칙에 따르면 평균 사이클 타임 = 평균 WIP ÷ 평균 처리량 = 24 ÷ 8 = 3주이다. 처리량이 같을 때 WIP를 줄이면 사이클 타임이 비례해 줄어들므로, WIP 한도를 낮추는 것이 가장 직접적인 방법이다.","optionNotes":["정답. 계산(24/8=3주)과 개선 방향 모두 옳다.","계산은 맞지만 투입을 늘리면 WIP가 증가해 사이클 타임이 오히려 길어진다.","처리량을 WIP로 나눈(8/24) 잘못된 계산이다.","계산이 틀렸고, 일방적으로 처리량 목표를 지시하는 것은 흐름 개선 방법이 아니다."]},{"id":"g-r108","domain":"process","edition":"both","approach":"agile","tags":["누적흐름도","병목"],"stem":"프로젝트 관리자가 지난 4주간의 누적 흐름도(CFD, Cumulative Flow Diagram)를 검토하고 있다. 유입(백로그) 선의 기울기는 일정한데, '코드 리뷰' 영역의 띠는 계속 넓어지고 '완료' 선의 기울기는 점점 완만해지고 있다. 이 패턴에 대한 가장 적절한 해석과 조치는?","options":["진행 중인 작업량이 늘어난 것은 팀의 생산성이 높아졌다는 뜻이므로, 다음 주부터 신규 작업 투입을 확대한다.","코드 리뷰 단계에 병목이 생겨 리드 타임이 늘고 있으므로, 팀과 원인을 분석하고 리뷰 단계 WIP 한도 등을 검토한다.","작업 항목의 총량이 계속 늘고 있으므로 범위 증가로 판단하고 변경 통제 절차를 강화한다.","완료 선이 완만해지는 것은 스프린트 막바지에 흔한 정상 변동이므로 추세를 몇 주 더 지켜본다."],"answer":[1],"explanation":"CFD에서 특정 단계의 띠가 넓어지면 그 단계의 WIP가 증가하고 있다는 뜻이며, 완료 선이 완만해지면 처리량이 줄고 있다는 뜻이다. 유입은 일정하므로 범위 증가가 아니라 코드 리뷰 병목이 원인이며, 팀과 함께 흐름을 개선해야 한다.","optionNotes":["띠가 넓어지는 것은 정체를 의미하며 투입 확대는 병목을 악화시킨다.","정답. CFD 패턴을 정확히 해석하고 팀 차원의 흐름 개선을 추진한다.","유입 선의 기울기가 일정하므로 범위 증가로 볼 근거가 없다.","처리량 감소와 WIP 증가가 이미 4주간 지속된 추세로, 관망하면 납기 위험이 커진다."]},{"id":"g-r109","domain":"process","edition":"both","approach":"hybrid","tags":["속도예측","릴리스계획","계산"],"stem":"하드웨어 팀은 예측형, 소프트웨어 팀은 스크럼(2주 스프린트)으로 진행하는 하이브리드 프로젝트이다. 소프트웨어 릴리스 백로그에는 180 스토리 포인트가 남아 있고, 최근 세 스프린트의 속도는 28, 32, 30이었다. 하드웨어 팀과의 통합 마일스톤은 지금부터 10주 후로 계획되어 있다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["남은 180포인트는 평균 속도 기준 6스프린트 분량이므로, 약 6주 후 완료되어 마일스톤까지 여유가 있다고 보고한다.","최근 최고 속도 32를 기준으로 남은 기간을 계산하면 충분하므로, 통합 마일스톤을 충족할 수 있다고 보고한다.","약 12주가 필요하므로 마일스톤을 맞추기 위해 다음 스프린트부터 속도를 36으로 높이도록 팀에 목표를 부여한다.","약 12주가 필요해 마일스톤을 약 2주 초과할 가능성을 공유하고, 범위 조정이나 통합 일정 조정 대안을 분석해 이해관계자와 논의한다."],"answer":[3],"explanation":"평균 속도는 (28+32+30)/3 = 30이고, 180/30 = 6스프린트, 2주 스프린트이므로 약 12주가 걸려 10주 마일스톤을 약 2주 초과한다. 예측을 투명하게 공유하고 범위 또는 일정 대안을 분석해 이해관계자와 결정하는 것이 바람직하다.","optionNotes":["스프린트 수를 주 수로 혼동한 계산 오류이다(6스프린트 × 2주 = 12주).","180/32 = 5.6스프린트로 여전히 약 11~12주가 필요하며, 최고치만 쓰는 것은 낙관 편향이다.","속도는 지시로 높일 수 있는 목표가 아니며, 강요하면 품질 저하와 포인트 부풀리기가 생긴다.","정답. 정확한 예측을 투명하게 공유하고 대안 분석 후 협업적으로 의사결정한다."]},{"id":"g-r110","domain":"process","edition":"both","approach":"agile","tags":["MVP","가설검증"],"stem":"밀키트 스타트업이 '개인 맞춤 식단 구독' 앱을 개발하려 한다. 고객이 맞춤 식단에 추가 요금을 낼지는 아직 검증되지 않았는데, 스폰서는 9개월 동안 모든 기능을 갖춘 앱을 만든 뒤 출시하자고 한다. 프로젝트 관리자가 제안할 가장 적절한 접근은?","options":["스폰서의 요청대로 9개월 전체 개발 계획을 수립하고, 범위 변경을 막기 위해 기능 명세를 조기에 확정한다.","경쟁사 앱의 요금제와 리뷰를 분석해 고객 지불 의사를 추정하고, 그 결과에 따라 전체 기능 범위를 확정한다.","'고객이 맞춤 식단에 비용을 지불한다'는 핵심 가설을 검증할 최소 기능 제품(MVP)을 빠르게 출시해 실사용 데이터로 학습한다.","모든 기능의 클릭 가능한 프로토타입을 만들어 내부 직원들에게 시연하고, 반응이 좋으면 전체 개발을 승인받는다."],"answer":[2],"explanation":"불확실성이 큰 신제품에서는 MVP로 핵심 가설을 실제 고객과 빠르게 검증해 학습하는 것이 낭비와 위험을 줄인다. 검증 결과에 따라 투자 방향을 조정하는 것이 가치 중심 인도의 핵심이다.","optionNotes":["검증되지 않은 가설에 9개월을 투자하는 것은 높은 사업 리스크를 안는다.","간접 추정일 뿐 실제 고객 행동으로 가설을 검증하지 못한다.","정답. MVP로 핵심 가설을 실사용 데이터로 검증하고 학습한다.","내부 직원의 의견은 실제 고객의 지불 의사를 대변하지 못한다."]},{"id":"g-r111","domain":"process","edition":"both","approach":"agile","tags":["스파이크","추정"],"stem":"스프린트 계획 중 팀은 '레거시 메인프레임 고객 원장과 실시간 연동' 스토리를 추정하지 못하고 있다. 해당 시스템의 인터페이스 문서가 없고, 연동 방식에 대해 팀원 누구도 경험이 없다. 가장 적절한 조치는?","options":["불확실성을 감안해 100포인트로 크게 추정하고, 충분한 버퍼를 둔 채 이번 스프린트에 바로 투입한다.","연동 경험이 있는 엔터프라이즈 아키텍트에게 대신 추정해 달라고 요청하고, 그 값을 스프린트 계획에 사용한다.","정보가 부족해 추정이 불가능하므로, 인터페이스 문서가 확보될 때까지 스토리를 백로그 맨 아래로 내린다.","연동 방식을 조사하는 타임박스형 스파이크(Spike)를 백로그 항목으로 수행한 뒤, 그 결과로 스토리를 다시 추정한다."],"answer":[3],"explanation":"스파이크는 기술적·기능적 불확실성을 줄여 추정과 설계를 가능하게 하기 위한 타임박스 조사 작업이다. 학습 결과를 바탕으로 다시 추정하면 신뢰할 수 있는 계획이 가능해진다.","optionNotes":["근거 없는 큰 추정치는 계획의 신뢰성을 떨어뜨리고 불확실성을 해소하지 못한다.","추정은 작업을 수행할 팀이 해야 하며 외부 추정은 책임감과 정확성을 떨어뜨린다.","문서가 언제 확보될지 모르는 채 가치 있는 항목을 미루는 것은 리스크를 키우는 회피이다.","정답. 타임박스형 스파이크로 불확실성을 줄인 후 재추정한다."]},{"id":"g-r112","domain":"process","edition":"8th","approach":"hybrid","tags":["기술부채","품질"],"stem":"보험 핵심 시스템 하이브리드 프로젝트에서 애자일 팀들이 예측형 릴리스 마일스톤을 맞추느라 리팩터링과 자동화 테스트를 계속 생략해 왔다. 최근 세 스프린트 동안 결함 유입률은 두 배가 되었고 속도는 20% 떨어졌다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["기술 부채를 백로그에 가시화하고 결함률·속도 데이터로 영향을 이해관계자에게 설명한 뒤, 매 반복 일정 역량을 상환에 배정하고 DoD를 강화한다.","현재 릴리스 일정은 유지하되, 다음 릴리스가 끝난 뒤 3개월짜리 별도 '안정화 단계'를 두어 기술 부채를 한꺼번에 해결한다.","계약상 마일스톤 준수가 최우선이므로 현재 방식을 유지하고, 결함은 운영 지원팀이 릴리스 후 처리하도록 조정한다.","결함 유입을 막기 위해 독립 QA 팀을 추가로 투입하고, 릴리스 직전 통합 검사 단계를 2주 늘려 강화한다."],"answer":[0],"explanation":"기술 부채는 가시화하고 지속적으로 상환해야 속도와 품질의 장기적 저하를 막을 수 있다. 품질은 사후 검사가 아니라 작업 방식과 완료 기준 안에 내재화해야 하며, 영향을 데이터로 보여 주어 이해관계자와 투자 결정을 함께 내리는 것이 바람직하다.","optionNotes":["정답. 부채를 투명하게 관리하고 품질을 프로세스에 내재화한다.","상환을 미루는 동안 부채가 누적되며 일괄 안정화는 일정·비용 리스크가 크다.","단기 마일스톤만 좇아 장기 가치와 품질을 훼손하고 결함 비용을 운영으로 떠넘긴다.","사후 검사 강화는 결함을 늦게 발견할 뿐 원인(품질 내재화 부족)을 해결하지 못한다."],"diffNote":"8판은 '프로세스와 인도물에 품질 내재화'를 6원칙 중 하나로 두어 사후 검사보다 작업 방식 속 품질 확보를 강조한다. 7판의 12원칙에도 유사한 품질 원칙이 있었으나, 8판은 원칙을 6개로 통합하면서 이를 핵심 원칙으로 유지했다."},{"id":"g-r113","domain":"process","edition":"both","approach":"agile","tags":["회고","지속적개선"],"stem":"지난 네 번의 스프린트 회고에서 매번 '테스트 환경이 자주 다운된다'는 문제가 제기되어 여러 실행 항목이 도출되었지만, 실제로 실행된 것은 없다. 팀원들은 '회고해 봐야 바뀌는 게 없다'며 냉소적으로 변하고 있다. 스크럼 마스터 역할의 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["효과가 없는 회의에 시간을 쓰지 않도록, 회고를 월 1회로 줄이고 남는 시간을 개발에 투입한다.","실행 항목을 1~2개로 좁혀 담당자를 정하고 다음 스프린트 백로그에 넣으며, 팀 밖 장애물은 직접 제거를 추진한다.","반복되는 문제를 끝내기 위해 프로젝트 관리자가 해결책을 직접 정하고, 팀원별로 작업을 배정한다.","테스트 환경은 인프라 팀 소관이라 팀이 통제할 수 없으므로, 회고 의제에서 제외하고 팀 내부 문제에 집중한다."],"answer":[1],"explanation":"회고의 가치는 실행된 개선에서 나온다. 소수의 실행 항목을 구체화해 백로그에 넣고 책임자를 정하며, 팀이 해결할 수 없는 장애물은 서번트 리더로서 프로젝트 관리자가 제거해야 개선 루프가 작동한다.","optionNotes":["근본 문제(실행 부재)를 해결하지 못하고 개선 기회를 줄인다.","정답. 실행 가능성과 추적성을 높이고 장애물 제거를 지원한다.","일방적 지시는 팀의 자기조직화와 주인의식을 약화한다.","장애물 제거는 리더의 역할이며 문제를 회피하면 팀의 냉소가 심화된다."]},{"id":"g-r114","domain":"process","edition":"both","approach":"predictive","tags":["정보방열기","의사소통"],"stem":"물류창고 신축 프로젝트에서 하도급 반장들과 발주처 담당자들이 공정 현황, 다음 주 작업 구역, 안전 지표를 확인하려고 하루에도 여러 번 프로젝트 관리자에게 전화한다. 이로 인해 프로젝트 관리자의 업무가 계속 중단되고 있다. 가장 적절한 조치는?","options":["모든 이해관계자에게 매일 저녁 각자의 관심사에 맞춘 개별 현황 이메일을 보내 전화 문의를 대신한다.","업무 중단을 줄이기 위해 현황 문의는 공식 월간 보고서와 월례 회의를 통해서만 받도록 공지한다.","전화 응대를 현장 사무원에게 맡겨, 프로젝트 관리자는 긴급한 사안에 대해서만 직접 답하도록 한다.","모두가 볼 수 있는 현장 사무소 벽에 마일스톤, 3주 선행 일정, 안전 지표를 담은 정보 방열기를 두고 갱신한다."],"answer":[3],"explanation":"정보 방열기는 누구나 필요할 때 스스로 확인할 수 있는 끌어오기(Pull) 방식의 가시적 의사소통 도구로, 예측형 현장에서도 효과적이다. 반복 문의를 줄이고 투명성을 높여 프로젝트 관리자의 시간을 확보한다.","optionNotes":["작성 부담이 크고 실시간성이 떨어지며 정보 과부하를 유발한다.","이해관계자의 정당한 정보 요구를 차단해 참여도와 신뢰를 떨어뜨린다.","문의 경로만 바꿀 뿐 정보 접근성 문제를 해결하지 못하고 사무원에게 부담이 옮겨 간다.","정답. 가시적 정보 공유로 반복 문의를 줄이고 투명성을 높인다."]},{"id":"g-r115","domain":"process","edition":"both","approach":"predictive","tags":["지속적통합","테일러링"],"stem":"물류 회사의 창고관리시스템 구축을 예측형으로 진행한다. 이전 유사 프로젝트에서는 여섯 개 모듈을 4개월간 따로 개발한 뒤 통합 단계에서 한꺼번에 합쳤는데, 인터페이스 결함이 대량으로 발견되어 일정이 3개월 지연되었다. 이번 프로젝트를 계획하는 프로젝트 관리자가 취할 가장 적절한 조치는?","options":["이전 지연을 교훈으로 삼아 통합 단계 기간을 두 배로 잡고, 일정 버퍼를 충분히 확보한다.","인터페이스 명세를 착수 시 완전히 동결하고, 위반한 모듈 팀에는 벌점을 부과하는 규칙을 만든다.","모듈 개발 중에도 자주 병합하고 자동 빌드·테스트를 실행하는 지속적 통합(CI)을 테일러링해 도입한다.","통합 리스크를 근본적으로 없애기 위해 프로젝트 전체를 즉시 스크럼 방식으로 전환한다."],"answer":[2],"explanation":"지속적 통합은 작은 단위로 자주 통합하고 자동 테스트로 결함을 조기에 발견해 '빅뱅 통합' 리스크를 줄인다. 예측형 생애주기에서도 이런 기술 실천은 테일러링을 통해 도입할 수 있다.","optionNotes":["버퍼만 늘리면 결함 발견 시점이 늦은 근본 문제는 그대로 남는다.","명세 동결과 처벌은 변경 대응력과 협업을 떨어뜨리며 결함을 조기에 발견하지 못한다.","정답. 교훈을 반영해 결함을 조기에 발견하는 실천을 테일러링으로 도입한다.","생애주기 전체 전환은 근거 없는 과잉 대응이며 필요한 것은 통합 실천의 개선이다."]},{"id":"g-r116","domain":"process","edition":"both","approach":"hybrid","tags":["하이브리드조정","의존성관리"],"stem":"병원 신관 건립 프로그램에서 건축 공사는 예측형으로, 환자 동선 안내 앱은 애자일로 개발한다. 앱 팀은 병실 번호 체계와 네트워크 설치 위치 정보가 필요한데, 설계 변경이 앱 팀에 늦게 전달되어 몇 차례 재작업이 발생했다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["두 팀 대표가 참여하는 정기 동기화 회의와 공유 의존성 보드를 운영하고, 공사 마일스톤과 앱 릴리스 계획을 연계한다.","생애주기 차이로 인한 조정 부담을 없애기 위해 앱 팀도 공사 일정에 맞춘 예측형 방식으로 전환한다.","각 팀이 자기 방식대로 독립적으로 작업하게 하고, 차이는 최종 통합 시점에 한꺼번에 해결한다.","팀 간 정보 전달 문제가 반복되므로 즉시 프로그램 스폰서에게 에스컬레이션해 해결을 요청한다."],"answer":[0],"explanation":"하이브리드 환경에서는 서로 다른 생애주기 간 의존성을 가시화하고 정기적으로 동기화하는 조정 메커니즘이 필요하다. 마일스톤과 릴리스 계획을 연계하면 변경 정보가 적시에 전달되어 재작업이 줄어든다.","optionNotes":["정답. 의존성 가시화와 정기 동기화로 두 생애주기를 효과적으로 연결한다.","각 작업의 특성에 맞는 방식을 버리는 것은 테일러링 원칙에 어긋난다.","통합을 미루면 재작업 리스크가 누적되어 더 커진다.","프로젝트 관리자 수준에서 해결 가능한 조정 문제를 성급하게 에스컬레이션하는 것이다."]},{"id":"g-r117","domain":"process","edition":"8th","approach":"hybrid","tags":["거버넌스","하이브리드보고"],"stem":"은행의 디지털 채널 프로그램은 애자일 팀이 제품 백로그로 작업하지만, 스티어링 위원회는 매월 간트 차트상의 '완료율(%)' 보고를 요구한다. 위원들은 스프린트 번다운과 스토리 포인트 보고를 이해하지 못해 프로젝트가 통제되지 않는다고 우려한다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["위원회가 익숙한 형식을 유지하도록 애자일 팀에 작업을 간트 차트 활동으로 분해하게 하고, 활동별 완료율을 매월 보고한다.","위원회와 협의해 릴리스 마일스톤, 번업 차트, 인도된 가치와 주요 리스크를 담은 하이브리드 보고 형식을 정해 거버넌스에 반영한다.","애자일의 투명성을 활용해, 위원들에게 월간 보고서 대신 격주 스프린트 리뷰에 직접 참석해 달라고 요청한다.","위원회의 요구는 애자일과 맞지 않으므로, 스프린트 번다운 보고를 유지하고 읽는 방법을 위원들에게 교육한다."],"answer":[1],"explanation":"거버넌스 주체의 감독 요구와 애자일 팀의 작업 방식을 모두 존중하는 테일러링된 보고 체계를 합의해야 한다. 번업 차트와 마일스톤, 가치·리스크 정보는 범위와 진척을 직관적으로 보여 주어 의사결정을 지원한다.","optionNotes":["팀의 작업 방식을 왜곡시켜 불필요한 부담을 주고 실제 가치 흐름을 보여 주지 못한다.","정답. 거버넌스 요구에 맞게 하이브리드 보고를 테일러링하고 공식 체계에 반영한다.","리뷰 참여는 도움이 되지만 위원회의 정기적 감독·의사결정 요구를 대체하지 못한다.","교육은 유용하나 번다운은 전체 범위·마일스톤 관점을 보여 주지 못해 위원회의 정당한 정보 요구를 충족하지 못한다."],"diffNote":"8판은 거버넌스를 7개 성과 영역 중 하나로 독립시켜 하이브리드 환경에서의 감독·의사결정·보고 체계 테일러링을 명시적으로 다룬다. 7판의 8개 성과 영역에는 거버넌스 영역이 없었다."},{"id":"g-r118","domain":"process","edition":"8th","approach":"hybrid","tags":["자원관리","공유자원"],"stem":"데이터 보안 아키텍트 한 명이 예측형 코어뱅킹 업그레이드 프로젝트와 두 개의 애자일 팀에 공유되어 있다. 애자일 팀들이 스프린트 중 수시로 그녀를 불러 작업을 요청하는 바람에, 예측형 프로젝트의 보안 설계 검토 일정이 두 차례 지연되었다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["예측형 프로젝트에는 계약 마일스톤이 있으므로, 아키텍트를 예측형 프로젝트에만 100% 배정하도록 지시한다.","아키텍트가 각 업무의 중요도를 가장 잘 알므로, 우선순위를 스스로 판단해 처리하도록 재량을 준다.","기능 관리자·팀 리더들과 아키텍트의 가용 역량을 가시화해 팀별 배분과 검토 시간대를 합의하고, 지식 이전을 추진한다.","공유 자원 충돌이 반복되므로, 즉시 외부 보안 아키텍트 추가 채용을 경영진에 요청한다."],"answer":[2],"explanation":"희소한 공유 자원은 관련 당사자가 함께 가용성을 가시화하고 배분 규칙을 합의해야 충돌을 줄일 수 있다. 예측형 일정과 애자일 반복 계획 모두에 그 배분을 반영하고, 핵심 인력 의존 리스크를 지식 이전으로 줄이는 것이 지속 가능한 해법이다.","optionNotes":["한쪽만 고려한 일방적 결정으로 애자일 팀의 작업이 막힌다.","조정 책임을 개인에게 떠넘기는 회피이며 갈등을 키운다.","정답. 이해관계자와 협업해 자원 배분을 투명하게 합의하고 의존 리스크를 줄인다.","분석과 조정 없이 자원 추가부터 요청하는 성급한 조치이다."],"diffNote":"8판은 자원(Resources)을 7개 성과 영역 중 하나로 두어 인적·물적 자원의 확보와 배분, 하이브리드 환경의 공유 자원 조정을 명시적으로 다룬다. 7판에는 자원 성과 영역이 없고 관련 내용이 팀·기획 등 여러 영역에 흩어져 있었다."},{"id":"g-r119","domain":"process","edition":"8th","approach":"hybrid","tags":["추정","재무"],"stem":"공공기관 민원 플랫폼 구축 프로젝트는 착수 전 전체 예산 승인이 필요하다. 첫 릴리스 범위는 비교적 명확하지만 이후 범위는 사용자 피드백에 따라 크게 달라질 수 있어 하이브리드로 진행하기로 했다. 재무 담당 임원은 단일 금액의 확정 총사업비를 요구한다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["예산 승인 요건을 충족하기 위해 전체 범위를 지금 상세 WBS로 분해하고, 상향식 추정으로 단일 확정 금액을 제시한다.","범위가 불확실해 신뢰할 수 있는 추정이 불가능하므로, 총사업비 대신 스프린트 단위로 예산을 요청하겠다고 답한다.","유사 팀의 속도를 가정해 '총 스토리 포인트 × 포인트당 단가'로 계산한 단일 금액을 총사업비로 제출한다.","가정과 범위(Range)를 명시한 개략 추정과 예비비를 제시하고, 단계별 자금 승인 시점마다 추정을 구체화하도록 재무 임원과 합의한다."],"answer":[3],"explanation":"불확실성이 큰 범위에 단일 확정 금액을 제시하면 거짓 정밀성을 만든다. 범위 추정과 예비비, 근거 가정을 투명하게 제시하고, 단계적 자금 조달 시점마다 추정을 정교화하는 방식이 재무 거버넌스와 적응형 인도를 함께 만족시킨다.","optionNotes":["불확실한 미래 범위를 상세 분해하는 것은 거짓 정밀성과 낭비를 낳는다.","조직의 정당한 예산 승인 요구를 거부하는 비협조적 대응이다.","가정에 기반한 단일 금액은 불확실성을 숨기고 거짓 정밀성을 만든다.","정답. 불확실성을 반영한 범위 추정과 점진적 구체화를 거버넌스와 합의한다."],"diffNote":"8판은 재무(Finance)를 독립된 성과 영역으로 두어 추정, 자금 조달, 재무적 가치 관리를 별도로 강조한다. 7판에서는 비용 추정과 예산이 기획 성과 영역 안에서 다뤄졌다."},{"id":"g-r120","domain":"process","edition":"8th","approach":"hybrid","tags":["AI활용","예측"],"stem":"PMO가 도입한 AI 예측 도구가 과거 이슈 관리 데이터를 분석해, 팀 자체 예측보다 6주 빠른 릴리스 날짜를 제시했다. 스폰서는 이 AI 날짜를 고객에게 바로 공지하자고 한다. 프로젝트 관리자가 취해야 할 가장 적절한 조치 2개를 고르시오.","options":["예측에 사용된 데이터의 품질과 범위(예: 과거 팀 구성 변화, 아직 백로그에 반영되지 않은 범위)와 모델의 가정을 검토한다.","AI가 대량의 데이터를 분석했으므로 스폰서 요청대로 AI 날짜를 고객에게 즉시 공지한다.","AI 예측은 신뢰할 수 없다고 판단해 해당 도구의 사용을 중단한다.","팀과 함께 AI 예측과 팀 예측의 차이 원인을 분석하고, 신뢰 구간을 포함한 범위 예측으로 스폰서에게 설명한 뒤 공지 여부를 결정한다.","AI가 제시한 날짜에 맞추도록 팀의 스프린트 목표를 상향 조정한다."],"answer":[0,3],"explanation":"AI 예측은 유용한 입력이지만 데이터 품질과 가정에 따라 크게 달라지므로, 인간이 검증하고 책임 있게 해석해야 한다. 팀과 함께 차이를 분석하고 불확실성을 범위로 표현해 이해관계자에게 설명하는 것이 책임 있는 AI 활용이다.","optionNotes":["정답. AI 결과의 근거가 되는 데이터와 가정을 사람이 검증한다.","검증되지 않은 예측을 외부에 공지하면 신뢰 손상과 약속 위반 리스크가 크다.","도구를 폐기하기보다 검증을 거쳐 적절히 활용해야 한다.","정답. 팀의 전문 지식과 결합해 불확실성을 투명하게 소통한다.","검증되지 않은 예측에 맞춰 목표를 올리면 품질 저하와 번아웃을 부른다."],"diffNote":"8판은 AI를 기획·예측 등 프로젝트 전반의 도구로 다루면서 결과에 대한 인간 검토와 책임을 강조한다. 7판은 AI 활용을 거의 다루지 않았다."},{"id":"g-r121","domain":"process","edition":"8th","approach":"predictive","tags":["AI활용","WBS"],"stem":"프로젝트 관리자가 정유 공장 정기보수(셧다운) 프로젝트를 기획하면서, 생성형 AI 도구에 과거 유사 프로젝트 자료를 입력해 WBS 초안과 활동별 기간 추정치를 만들었다. 초안은 형식상 완전해 보인다. 다음으로 해야 할 가장 적절한 조치는?","options":["유사 프로젝트 자료에 기반한 초안이 완성도 높아 보이므로, 바로 일정 기준선으로 승인을 요청한다.","정비 SME 및 팀과 초안을 검토해 누락 작업, 현장 조건에 맞는 기간, 숨은 가정을 검증·수정한 뒤 확정한다.","AI 결과는 근거를 추적하기 어려워 신뢰할 수 없으므로, 초안을 폐기하고 처음부터 수작업으로 작성한다.","다른 AI 도구로 같은 작업을 수행해 교차 검증하고, 두 결과가 일치하는 항목은 그대로 확정한다."],"answer":[1],"explanation":"AI 초안은 기획 효율을 높이지만, 현장 조건과 이번 프로젝트의 고유 특성을 반영하려면 작업 수행자의 전문 판단으로 검증해야 한다. 최종 계획의 책임은 프로젝트 관리자와 팀에 있다.","optionNotes":["인간 검증 없이 AI 결과를 기준선으로 삼는 것은 책임 있는 AI 활용이 아니다.","정답. AI를 출발점으로 활용하되 전문가와 팀이 검증해 품질과 수용성을 확보한다.","유용한 초안을 버리는 것은 비효율적이며 AI의 가치를 활용하지 못한다.","AI 간 일치는 같은 데이터·가정의 오류를 함께 반영할 수 있어 인간 검토를 대체하지 못한다."],"diffNote":"8판은 AI를 기획 도구로 적극 활용하되 사람의 검토와 책임 있는 리더십을 전제로 한다. 7판은 AI 활용 지침을 사실상 다루지 않았다."},{"id":"g-r122","domain":"process","edition":"8th","approach":"predictive","tags":["지속가능성","대안분석"],"stem":"데이터센터 증설 프로젝트(예측형)에서 냉각 시스템 설계 대안 두 가지가 나왔다. A안은 초기 투자비가 8% 낮지만 15년 운영 기간의 전력 소비가 크게 많고, B안은 초기 투자비가 높지만 승인된 예산 허용 범위 안에 있으며 탄소 배출과 운영비가 훨씬 적다. 스폰서는 착수 시 '프로젝트 비용 최소화'를 강조했다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["두 대안의 수명주기 비용과 에너지·탄소 영향을 분석해 조직의 지속가능성 목표와 함께 스폰서에게 제시하고 결정을 받는다.","스폰서가 착수 시 비용 최소화를 명확히 지시했으므로, 초기 투자비가 낮은 A안을 선택한다.","친환경 대안이 조직에 옳은 선택이므로, 프로젝트 관리자가 B안으로 결정하고 스폰서에게는 사후 보고한다.","냉각 방식 선택은 기술적 판단이므로 설계팀에 결정을 위임하고, 결과만 통보받아 계획에 반영한다."],"answer":[0],"explanation":"지속가능성은 프로젝트 비용만이 아니라 제품 수명주기 전체의 경제적·환경적 영향을 고려하는 것이다. 프로젝트 관리자는 분석을 통해 결정권자가 조직 전략과 지속가능성 목표에 맞는 결정을 내리도록 지원해야 한다.","optionNotes":["정답. 수명주기 관점의 분석으로 근거 있는 의사결정을 지원한다.","프로젝트 비용만 보는 좁은 관점으로 장기 운영비와 환경 영향을 무시한다.","의사결정 권한을 넘어선 일방적 결정이다.","전략적 비용·지속가능성 판단을 기술팀에 떠넘기는 회피이다."],"diffNote":"8판은 '모든 프로젝트 영역에 지속가능성 통합'을 6원칙 중 하나로 두어 대안 선택에 환경·사회적 영향을 체계적으로 반영하도록 한다. 7판은 스튜어드십 원칙 안에서 간접적으로만 다루었다."},{"id":"g-r123","domain":"process","edition":"both","approach":"hybrid","tags":["의사소통관리","하이브리드"],"stem":"하이브리드 ERP 프로그램에서 운영·규제 부서 이해관계자들은 월간 상태 보고서로만 정보를 받는다. 최근 스프린트 리뷰에서 제품 책임자가 재고 알림 기능의 우선순위를 낮췄는데, 이를 한 달 뒤에야 알게 된 운영 이사가 '중요한 결정에서 배제되었다'며 강하게 불만을 제기했다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["운영 이사에게 사과하고, 재발 방지를 위해 다음 월간 보고서부터 스프린트별 결정 사항을 상세히 기술한다.","앞으로 애자일 팀이 기능 우선순위를 바꾸기 전에는 반드시 운영 이사의 사전 승인을 받도록 규칙을 만든다.","이해관계자 정보 요구를 재분석해 스프린트 리뷰의 주요 결정을 짧은 주기로 공유하도록 의사소통 계획을 조정한다.","애자일 결정 과정을 직접 보도록 모든 운영·규제 부서 이해관계자에게 데일리 스탠드업 참석을 요청한다."],"answer":[2],"explanation":"하이브리드 환경에서는 애자일 의사결정 주기와 예측형 보고 주기가 어긋나 정보 공백이 생기기 쉽다. 이해관계자 요구를 재분석해 적절한 주기와 채널로 핵심 결정을 공유하도록 의사소통 방식을 조정해야 한다.","optionNotes":["월 단위 주기는 그대로여서 애자일 결정 주기와의 불일치라는 근본 원인을 해결하지 못한다.","제품 책임자의 우선순위 권한을 약화시키고 의사결정 병목을 만든다.","정답. 이해관계자의 정보 요구에 맞게 의사소통 방식을 테일러링한다.","스탠드업은 개발 팀의 조정 회의로, 이해관계자 정보 요구에 맞지 않고 시간 낭비를 유발한다."]},{"id":"g-r124","domain":"process","edition":"8th","approach":"predictive","tags":["가치측정","성과지표"],"stem":"종합병원의 전자처방 시스템 도입 프로젝트(예측형)를 기획 중이다. 스폰서는 '납기 준수나 산출물 개수가 아니라 이 프로젝트가 실제로 어떤 가치를 만들었는지 보여 줄 지표'를 요구했다. 결과(Outcome) 중심 지표로 가장 적절한 것 2개를 고르시오.","options":["병동에 설치된 처방 단말기 수","완료된 사용자 교육 세션 수","투약 오류 발생률의 감소","계획 대비 완료된 작업 패키지 비율","처방 발행부터 조제 완료까지 걸리는 평균 시간의 단축"],"answer":[2,4],"explanation":"가치 인도는 산출물(Output)의 양이 아니라 그 산출물이 만든 결과와 편익으로 측정해야 한다. 투약 오류 감소와 처방 처리 시간 단축은 환자 안전과 운영 효율이라는 조직 목표에 직접 연결되는 결과 지표이다.","optionNotes":["설치 수량은 산출물 지표로, 실제 개선 효과를 보여 주지 못한다.","교육 횟수는 활동·산출물 지표이다.","정답. 환자 안전이라는 결과를 직접 측정한다.","작업 완료율은 진척(산출물) 지표이다.","정답. 운영 효율 개선이라는 결과를 측정한다."],"diffNote":"7판에도 가치 중심 원칙이 있었으나, 8판은 6원칙의 '가치에 집중'과 재무 성과 영역을 통해 산출물이 아닌 결과·편익 측정을 프로젝트 전반에 통합하도록 더 강조한다."},{"id":"g-r125","domain":"process","edition":"both","approach":"predictive","tags":["테일러링","규제환경"],"stem":"제약회사의 실험 장비 적격성 평가(Qualification) 프로젝트를 규제 요건에 따라 예측형으로 수행 중이다. 실행 단계에서 검증팀이 테스트 수행 작업 관리를 위해 칸반 보드와 15분 일일 회의를 쓰자고 제안했고, 품질보증(QA) 관리자는 승인된 계획과 다르다며 우려한다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["승인된 프로젝트 관리 계획서에 없는 방식이므로, 규제 리스크를 피하기 위해 제안을 거절한다.","규제 문서화·승인 절차는 유지하면서 칸반과 일일 회의를 실행 조정 도구로 테일러링하고, QA와 협의해 계획서에 반영한다.","애자일 실천의 효과를 극대화하기 위해 이 기회에 프로젝트 전체를 애자일 방식으로 전환한다.","실행 효율에 도움이 되므로 팀이 비공식적으로 사용하도록 허용하되, 논란을 피하려 QA에는 알리지 않는다."],"answer":[1],"explanation":"예측형 생애주기에서도 규제 요건을 훼손하지 않는 범위에서 애자일 실천을 테일러링해 도입할 수 있다. 이해관계자의 우려를 협의로 해소하고 계획서에 반영해 투명성과 준수를 함께 확보해야 한다.","optionNotes":["규제 요건을 해치지 않는 효과적 실천을 형식적 이유로 배제하는 경직된 대응이다.","정답. 규제 준수를 유지하면서 실행 효율을 높이는 테일러링이며 공식 계획에 반영한다.","규제 문서화 요건이 강한 프로젝트에 근거 없는 전면 전환은 부적절하다.","투명성을 해치고 QA와의 신뢰를 훼손한다."]},{"id":"g-r126","domain":"process","edition":"both","approach":"predictive","tags":["인계","요구사항추적"],"stem":"플랜트 증설 프로젝트에서 설계는 사내 엔지니어링팀이 완료했고, 시공은 외부 시공사가 수행한다. 과거 프로젝트에서는 설계 인계 후 시공사가 도면을 잘못 해석해 큰 재작업이 발생한 적이 있다. 설계 단계 종료를 앞둔 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["시공사 핵심 인원이 참여하는 설계 워크스루로 요구사항 추적 매트릭스와 인수 기준을 함께 확인하고 질의응답 체계를 마련한다.","완성된 설계 도서 일체를 시공사에 공식 문서로 전달하고, 모든 도면에 대한 수신 확인 서명을 받는다.","설계 단계 종료 승인을 받으면 비용 절감을 위해 설계팀을 즉시 다른 프로젝트로 재배치한다.","도면 오해로 인한 재작업 비용은 시공사가 부담하도록 계약의 책임 조항을 강화해 둔다."],"answer":[0],"explanation":"단계 간 인계는 지식 손실과 오해가 생기기 쉬운 지점이므로, 수신 측이 참여하는 공동 검토와 추적성 확인으로 공유된 이해를 만들어야 한다. 이는 과거 교훈을 반영한 예방 활동이다.","optionNotes":["정답. 수신 측이 참여하는 공동 검토와 추적성 확인으로 인계 리스크를 예방한다.","문서 전달만으로는 설계 의도와 암묵지가 전달되지 않는다.","시공 중 질의에 대응할 설계 지식이 사라져 리스크가 커진다.","책임 전가는 재작업 자체를 예방하지 못하고 협력 관계를 악화시킨다."]},{"id":"g-r127","domain":"process","edition":"both","approach":"predictive","tags":["연동기획","점진적구체화"],"stem":"5년짜리 철도 신호 시스템 교체 프로그램은 3단계로 진행된다. 1단계(시범 구간)의 작업은 명확하지만, 2·3단계의 방식은 시범 구간 결과에 따라 달라진다. 스폰서는 지금 바로 전 단계의 활동 수준 상세 일정을 요구한다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["스폰서의 요구대로 모든 단계를 활동 수준까지 분해해 상세 일정을 작성하고, 변동은 변경 통제로 관리한다.","불확실성을 고려해 1단계만 상세 계획하고, 2·3단계는 시범 결과가 나올 때까지 계획을 보류한다.","후속 단계의 불확실성이 크므로 프로그램 전체를 애자일 방식으로 전환하겠다고 스폰서에게 제안한다.","연동 기획으로 1단계는 상세히, 2·3단계는 계획 패키지 수준으로 작성해 점진적으로 구체화하도록 스폰서와 합의한다."],"answer":[3],"explanation":"연동 기획은 가까운 작업은 상세히, 먼 작업은 개략적으로 계획하고 정보가 확보되면 점진적으로 구체화하는 기법이다. 스폰서에게 근거를 설명해 전체 그림과 현실적 정밀도를 함께 제공한다.","optionNotes":["불확실한 미래 작업의 상세 계획은 거짓 정밀성을 만들고 잦은 재계획과 변경 요청을 부른다.","후속 단계의 개략 계획 없이는 자원·예산·의존성 관리가 불가능하다.","규제·안전 중심 인프라 사업을 근거 없이 전면 전환하는 것은 부적절하다.","정답. 점진적 구체화로 현실적인 계획 정밀도를 확보하고 스폰서와 합의한다."]},{"id":"g-r128","domain":"process","edition":"both","approach":"predictive","tags":["진척측정","획득가치"],"stem":"변전소 건설 프로젝트에서 작업 패키지 책임자들이 진척률을 주관적으로 보고하고 있다. 여러 작업이 3주째 '90% 완료' 상태로 보고되고 있어, 획득가치(EV) 산정의 신뢰성이 의심된다. 프로젝트 관리자가 취해야 할 가장 적절한 조치는?","options":["작업 패키지 책임자들에게 보고 정확성의 중요성을 강조하고, 앞으로 더 보수적으로 진척률을 보고하라고 지시한다.","90%에 머문 작업들을 일정 지연으로 간주하고, 즉시 스폰서에게 에스컬레이션해 조치를 요청한다.","작업 패키지별로 0/100, 50/50, 가중 마일스톤 등 객관적 진척 측정 규칙을 정의해 EV 산정에 적용한다.","진척을 더 촘촘히 파악하기 위해 진척 보고 주기를 주간에서 일간으로 늘린다."],"answer":[2],"explanation":"주관적 완료율은 '90% 증후군'처럼 진척을 과대평가하기 쉽다. 작업 특성에 맞는 객관적 진척 측정 규칙을 정의하면 EV의 신뢰성이 높아지고 성과 분석이 정확해진다.","optionNotes":["측정 기준 없이 정확성만 요구해서는 문제가 해결되지 않는다.","실제 상태 분석 없이 성급하게 에스컬레이션하는 것이다.","정답. 객관적 측정 규칙으로 진척과 EV의 신뢰성을 높인다.","보고 빈도를 늘려도 주관적 측정 방식은 그대로이며 부담만 커진다."]}]`)]).flat(),Ye=new Ee,Xe=`pmp-prep:updatedAt`,Ze=()=>{try{return Number(localStorage.getItem(Xe))||0}catch{return 0}};function Qe(
